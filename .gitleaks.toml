[extend]
useDefault = true

[[allowlists]]
description = "Downloaded or generated local tooling is outside repository scope."
paths = [
  '''(?:^|/)\.ansible(?:/|$)''',
  '''(?:^|/)\.build(?:/|$)''',
  '''(?:^|/)\.terraform\.d(?:/|$)''',
  '''(?:^|/)\.tools(?:/|$)''',
  '''(?:^|/)\.venv(?:/|$)''',
  '''(?:^|/)\.terraform(?:/|$)''',
]

[[allowlists]]
description = "Verified public API 23 and rollback API 22 image digests, not credentials."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^(?:/repo/)?docs/ORGANIZATIONWEB\.md$''']
regexes = [
  '''(?m)^API sha256:313446ebc241ec2812c2d5dcbfb5618a3bc398253e9b4e78b55b6730c650216d\r?$''',
  '''(?m)^API sha256:1276d6e618f5ab6aadfa816244f5022a2393cd46d2c8c09a6d5bde1e8ec9f49b\r?$''',
]
