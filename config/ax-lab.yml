---
# Reviewed contract of the AX lab (playbook `ax-lab`): Google's Agent
# Executor on Agent Substrate, in a kind Kubernetes cluster beside Swarm.
# scripts/validate-ax-lab.py pins the shape and every value below. See
# docs/AX.md.
#
# The playbook codifies the host prerequisites (the inotify limits kind
# needs and the pinned kind and kubectl binaries) and the lifecycle of the
# kind cluster and its local registry. Substrate and AX are still the manual
# trial of docs/DEPLOYMENT_STATUS.md until the later changes in docs/AX.md
# codify them; `sources` and the redis and openai_proxy images are their
# reviewed pins, not yet used.
ax_lab:
  schema_version: 1
  # Under platform_install_root (config/platform.yml), root:root 0750.
  install_root: /opt/dockerswarm/ax-lab
  # Owner-provisioned, root-only credential files for AX live here. Only
  # the path is versioned: no playbook reads, copies or prints their
  # contents, and none of them belongs in Git.
  credential_directory: /etc/dockerswarm/ax
  # kind known issues, "Pod errors due to too many open files":
  # https://kind.sigs.k8s.io/docs/user/known-issues/
  # Persisted in /etc/sysctl.d/99-z-dockerswarm-ax-lab.conf. The keys must
  # stay disjoint from host_baseline_sysctl and the platform role's file.
  sysctl:
    fs.inotify.max_user_watches: "524288"
    fs.inotify.max_user_instances: "512"
  # The exact commits the lab was built from. Substrate's is the one AX
  # pins in its go.mod at this AX commit.
  sources:
    ax:
      repository: https://github.com/google/ax
      commit: f009cc81c9a571073bc1dd58cd2ed934bf2d5b1c
    substrate:
      repository: https://github.com/agent-substrate/substrate
      commit: 672533541dbfcd29084e4de2475267088bda3651
  # Official linux-amd64 release assets. Each sha256 is the one upstream
  # publishes next to the asset (kind-linux-amd64.sha256sum on the kind
  # release, kubectl.sha256 on dl.k8s.io).
  binaries:
    kind:
      version: v0.33.0
      url: "https://github.com/kubernetes-sigs/kind/releases/download/\
        v0.33.0/kind-linux-amd64"
      sha256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    kubectl:
      version: v1.37.0
      url: "https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl"
      sha256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
  # Upstream images by tag and index digest. kind_node is kind v0.33.0's
  # default node image (pkg/apis/config/defaults/image.go), and its
  # Kubernetes version equals kubectl's.
  images:
    kind_node: "docker.io/kindest/node:v1.37.0@sha256:\
      a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
    registry: "docker.io/library/registry:3@sha256:\
      852b3e4d378c426dda6b318fe9d9bfe8e92a0eccb9926671ec3d3ea17a196696"
    redis: "docker.io/library/redis:7-alpine@sha256:\
      858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499"
    openai_proxy: "docker.io/nginxinc/nginx-unprivileged:1.30-alpine@sha256:\
      4714e0b1b2577eaa1a6131d07c958b67f0eb68e6d0521e90c6e5287db8cf0bc5"
  # The kind cluster the role creates when it is absent and reconciles
  # afterwards (docs/AX.md, «Ciclo de vida del clúster»). kind names the
  # node <name>-control-plane and attaches it to its fixed Docker network
  # `kind` (kind v0.33.0 pkg/cluster/internal/providers/docker/network.go).
  cluster:
    name: kind
    node_container: kind-control-plane
    network: kind
    # The Kubernetes API is published only on the IPv4 loopback, on a fixed
    # reviewed port instead of the random one kind picks by default (kind
    # configuration guide, «API Server»). 6443 is outside the kernel's
    # ephemeral port range (32768-60999 on this host) and no other listener
    # of the host uses it.
    api_server:
      address: 127.0.0.1
      port: 6443
    # Converged with `docker update` only when the live value differs. They
    # must equal the node's entry in host_containers.ax-lab of
    # config/capacity-profiles.yml, which the validator checks.
    resources:
      memory_limit_mib: 3584
      memory_reservation_mib: 1792
      cpu_limit_millicores: 2000
      pids_limit: 4096
    # kind creates the node with on-failure:1 (provision.go, line 167). The
    # lab only starts through this playbook, so the capacity preflight runs
    # first and the proxy_arp and proxy_ndp settings follow. Stopped after a
    # host or Docker restart, it blocks no other playbook.
    restart_policy: "no"
  # kind's local registry (https://kind.sigs.k8s.io/docs/user/local-registry/),
  # created by the role from images.registry on the kind network only and
  # published only on the loopback addresses.
  registry:
    container: kind-registry
    # Named, so the pushed images survive a recreation of the container.
    volume: ax-lab-registry
    host_port: 5001
    container_port: 5000
    bind_addresses: ["127.0.0.1", "::1"]
    resources:
      memory_limit_mib: 256
      memory_reservation_mib: 128
      cpu_limit_millicores: 500
      pids_limit: 256
    restart_policy: "no"
# Owner acceptance that the kind node runs root-equivalent: kind starts it
# with --privileged and seccomp and AppArmor unconfined (kind v0.33.0
# pkg/cluster/internal/providers/docker/provision.go, lines 226-228). The
# role refuses to create or touch the cluster while it is false.
#
# Accepted by the owner on 2026-09-25, who delegated the decision on every
# recommendation of the AX lab plan ("Si a todo, autorizo todo, seguiré todas
# tus recomendaciones"). It accepts a privileged node without seccomp or
# AppArmor confinement, root-equivalent on this host, bound to loopback and
# never published. See docs/AX.md, «Aceptación del nodo privilegiado».
ax_lab_privileged_node_accepted: true
