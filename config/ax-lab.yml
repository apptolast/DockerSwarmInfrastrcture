---
# Reviewed contract of the AX lab (playbook `ax-lab`): Google's Agent
# Executor on Agent Substrate, in a kind Kubernetes cluster beside Swarm.
# scripts/validate-ax-lab.py pins the shape and every value below. See
# docs/AX.md.
#
# The playbook codifies the host prerequisites (the inotify limits kind
# needs and the pinned kind and kubectl binaries), the lifecycle of the kind
# cluster and its local registry, Agent Substrate (its pinned images, a
# backup of them and its install with upstream's ate-setup) and AX on top of
# it: its seeded images, control plane, WorkerPool, CLI and operator helpers.
ax_lab:
  schema_version: 3
  # Under platform_install_root (config/platform.yml), root:root 0750.
  install_root: /opt/dockerswarm/ax-lab
  # Owner-provisioned, root-only credential files for AX live here. Only
  # the path is versioned: no playbook reads, copies or prints their
  # contents, and none of them belongs in Git.
  credential_directory: /etc/dockerswarm/ax
  # kind known issues, "Pod errors due to too many open files":
  # https://kind.sigs.k8s.io/docs/user/known-issues/
  # Persisted in /etc/sysctl.d/99-z-dockerswarm-ax-lab.conf. The keys must
  # stay disjoint from host_baseline_sysctl and the platform role's file.
  sysctl:
    fs.inotify.max_user_watches: "524288"
    fs.inotify.max_user_instances: "512"
  # The exact commits the lab was built from. Substrate's is the one AX
  # pins in its go.mod at this AX commit.
  sources:
    ax:
      repository: https://github.com/google/ax
      commit: f009cc81c9a571073bc1dd58cd2ed934bf2d5b1c
      # google/ax#375 as proposed on arkady-emelyanov/ax local-models
      # (c7fd10b, 89fa366), without its committed __pycache__, byte for byte
      # the diff the manual lab staged over the commit above and built every
      # AX image from (images/ax/README.md). Only the reproducibility
      # workflow applies it; the host never compiles AX.
      patch:
        path: images/ax/google-ax-375.patch
        sha256: 7b8bff50ffc90f06970352f4576ee1dc0d3d9c2fcfb520fea86249beeeae9d72
    substrate:
      repository: https://github.com/agent-substrate/substrate
      commit: 672533541dbfcd29084e4de2475267088bda3651
  # Official linux-amd64 release assets. Each sha256 is the one upstream
  # publishes next to the asset (kind-linux-amd64.sha256sum on the kind
  # release, kubectl.sha256 on dl.k8s.io).
  binaries:
    kind:
      version: v0.33.0
      url: "https://github.com/kubernetes-sigs/kind/releases/download/\
        v0.33.0/kind-linux-amd64"
      sha256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    kubectl:
      version: v1.37.0
      url: "https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl"
      sha256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
  # Upstream images by tag and index digest. kind_node is kind v0.33.0's
  # default node image (pkg/apis/config/defaults/image.go), and its
  # Kubernetes version equals kubectl's.
  images:
    kind_node: "docker.io/kindest/node:v1.37.0@sha256:\
      a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
    registry: "docker.io/library/registry:3@sha256:\
      852b3e4d378c426dda6b318fe9d9bfe8e92a0eccb9926671ec3d3ea17a196696"
    # AX's own Redis (deploy/redis.yaml, line 40, at sources.ax), by digest.
    redis: "docker.io/library/redis:7-alpine@sha256:\
      858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499"
    # The official Go image that the explicit fallback build and the
    # reproducibility workflow run: Go 1.27.1 (Substrate's go.mod says
    # `go 1.27.0`), git and make. The manual lab built every pinned
    # Substrate image in this exact digest.
    toolbox: "docker.io/library/golang:1.27.1@sha256:\
      3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244"
  # The kind cluster the role creates when it is absent and reconciles
  # afterwards (docs/AX.md, «Ciclo de vida del clúster»). kind names the
  # node <name>-control-plane and attaches it to its fixed Docker network
  # `kind` (kind v0.33.0 pkg/cluster/internal/providers/docker/network.go).
  cluster:
    name: kind
    node_container: kind-control-plane
    network: kind
    # The Kubernetes API is published only on the IPv4 loopback, on a fixed
    # reviewed port instead of the random one kind picks by default (kind
    # configuration guide, «API Server»). 6443 is outside the kernel's
    # ephemeral port range (32768-60999 on this host) and no other listener
    # of the host uses it.
    api_server:
      address: 127.0.0.1
      port: 6443
    # Converged with `docker update` only when the live value differs. They
    # must equal the node's entry in host_containers.ax-lab of
    # config/capacity-profiles.yml, which the validator checks.
    resources:
      memory_limit_mib: 3584
      memory_reservation_mib: 1792
      cpu_limit_millicores: 2000
      pids_limit: 4096
    # kind creates the node with on-failure:1 (provision.go, line 167). The
    # lab only starts through this playbook, so the capacity preflight runs
    # first and the proxy_arp and proxy_ndp settings follow. Stopped after a
    # host or Docker restart, it blocks no other playbook.
    restart_policy: "no"
  # kind's local registry (https://kind.sigs.k8s.io/docs/user/local-registry/),
  # created by the role from images.registry on the kind network only and
  # published only on the loopback addresses.
  registry:
    container: kind-registry
    # Named, so the pushed images survive a recreation of the container.
    volume: ax-lab-registry
    host_port: 5001
    container_port: 5000
    bind_addresses: ["127.0.0.1", "::1"]
    resources:
      memory_limit_mib: 256
      memory_reservation_mib: 128
      cpu_limit_millicores: 500
      pids_limit: 256
    restart_policy: "no"
  # Agent Substrate at sources.substrate (docs/AX.md, «Substrate»).
  substrate:
    # VERSION of every image, its tag in the registry, the node label
    # ate.dev/substrate-version and the suffix of the atelet DaemonSet. It
    # is what `git describe --tags --always --dirty` printed at the pinned
    # commit for the manual lab (Makefile, line 36), passed explicitly and
    # never recomputed.
    version: "67253354"
    # ko images of ./cmd/<name>, single-platform linux/amd64, by the digest
    # of their manifest: the manual lab's registry serves exactly these.
    # The registry keeps each as <name>:<version>, ko's --base-import-paths
    # name, which `ate-setup --image-repo` looks up. The manual lab never
    # built ate-setup: its digest is the one the ax-lab-reproducibility
    # workflow built from the pinned commit on 2026-09-25 (run 36187353468),
    # where the six images above also reproduced exactly.
    images:
      ateapi: >-
        sha256:c1422c85315e87c0710ec9e22447ea68185f96cd47e10473b75966f79c2d30f3
      atecontroller: >-
        sha256:0893131c560ee326933dc06494c86d31011f48c0c60e8dbebb40aaaed4c80c14
      atelet: >-
        sha256:8e88c4e0d0289c88cb84f18f679494645700e67bea0e1a4c0bf56f461bf30f7b
      atenet: >-
        sha256:929ca468e20fc7d06e356cb844d3cd5d2d30632db68ba5360adb4850b975fcd9
      podcertcontroller: >-
        sha256:2baed2f1e88434f8d018e595c41f7117f06c6af6410b6fbd2210bb79c54c8f99
      ateom-gvisor: >-
        sha256:fdd1d0ad3b30578d86f11aaa67740448a8477ce706e70207b8b51a96646592e7
      ate-setup: >-
        sha256:43c9e2db7a2cdacedcd8515fb7abb561b4b7de60d8e5ef9df3b9d0300c7a1098
    # A root-only OCI image layout with a byte-exact copy of every pinned
    # image: the seed from the manual lab and the restore source.
    backup_directory: /var/backups/dockerswarm/ax-lab/images
    # The explicit fallback build (ax_lab_substrate_fallback_builds): one
    # image per container, only while the node is not running, inside the
    # node's own budget (cluster.resources), with no swap.
    build:
      memory_limit_mib: 3072
      memory_reservation_mib: 1536
      cpu_limit_millicores: 2000
      pids_limit: 1024
      timeout_seconds: 3600
      # memory_limit_mib plus the operational headroom of
      # config/capacity.yml, before the build starts.
      min_mem_available_mib: 3584
      # The operational headroom: below it the build is killed.
      mem_available_floor_mib: 512
    # ate-setup --kind --atenet-router envoy --image-repo localhost:5001
    # deploy ate-system, from its pinned image, only when the install
    # drifts. It runs beside the node, so its limits fit in the 224 MiB and
    # 600m of limits the active capacity plan leaves free since the web
    # forwarder joined it; the operational headroom is not spent.
    install:
      atenet_router: envoy
      rollout_timeout_seconds: 600
      # At least the sum of ate-setup's own waits with that rollout timeout,
      # 10 x 600 + 180 s, plus 300 s: the namespace (60 s) and two CRDs
      # (30 s each), the podcertificate-controller rollout and its trust
      # bundles (cmd/ate-setup/internal/steps/deploy.go, lines 55-98), the
      # same three waits again in SetupCSI, which runs with no driver too
      # (deploy.go line 99, csi.go lines 61-104), and six rollouts
      # (deploy.go lines 150-174).
      timeout_seconds: 6480
      memory_limit_mib: 224
      memory_reservation_mib: 112
      cpu_limit_millicores: 500
      pids_limit: 256
      min_mem_available_mib: 736
      mem_available_floor_mib: 512
    # What `ate-setup --kind` deploys at the pinned commit: every workload
    # of its three namespaces, sorted by namespace, kind and name, with the
    # images of its init and main containers. A pinned image is named by
    # its key above; anything else is the reference the manifest carries.
    workloads:
      # atelet.yaml:94-138 and kind/atelet
      - kind: DaemonSet
        namespace: ate-system
        name: atelet-67253354
        images: [atelet]
      # ate-api-server.yaml:58-88
      - kind: Deployment
        namespace: ate-system
        name: ate-api-server
        images: [ateapi]
      # ate-controller.yaml:86-104
      - kind: Deployment
        namespace: ate-system
        name: ate-controller
        images: [atecontroller]
      # atenet-egress.yaml:210-235, 311-312
      - kind: Deployment
        namespace: ate-system
        name: atenet-egress
        images:
          - "envoyproxy/envoy:v1.39-latest@sha256:\
            57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4"
          - atenet
      # atenet-router.yaml:116-145, 242-243
      - kind: Deployment
        namespace: ate-system
        name: atenet-router
        images:
          - atenet
          - "envoyproxy/envoy:v1.39-latest@sha256:\
            57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4"
      # kind/rustfs.yaml:45-65
      - kind: Deployment
        namespace: ate-system
        name: rustfs
        images:
          - "rustfs/rustfs:1.0.0-beta.3@sha256:\
            378642b05b7dcb4849fb77ebe6aca4ced1c3f66e7e504247df95a5c9018d3358"
      # kind/rustfs.yaml:94-105
      - kind: Job
        namespace: ate-system
        name: rustfs-bucket-init
        images:
          - "amazon/aws-cli:2.17.0@sha256:\
            643507c10ada7964ca6157b3d799f030b90577643da9955d319a77399ed80d73"
      # postgres/postgres.yaml:89-146: ate-setup applies the base file, not
      # the kind/postgres overlay the shell installer uses.
      - kind: StatefulSet
        namespace: ate-system
        name: postgres
        init_images:
          - "postgres:18-alpine@sha256:\
            9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15"
        images:
          - "postgres:18-alpine@sha256:\
            9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15"
      # kind/otel-collector.yaml:200-218
      - kind: Deployment
        namespace: otel-system
        name: jaeger
        images:
          - "jaegertracing/all-in-one:1.55@sha256:\
            f6b5d09073f14f76873d300f565a6691d815e81bea8e07e1dc3ff67e0596dd4e"
      # kind/otel-collector.yaml:131-153
      - kind: Deployment
        namespace: otel-system
        name: opentelemetry-collector
        images:
          - "otel/opentelemetry-collector-contrib:0.157.0@sha256:\
            f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6"
      # kind/prometheus.yaml:149-175
      - kind: Deployment
        namespace: otel-system
        name: prometheus
        images:
          - "prom/prometheus:v3.5.3@sha256:\
            ddc2493835a1509976d5e4e0c94199c4f843ce1f42dd6bcfc8231ba734a93ff7"
      # pod-certificate-controller.yaml:124-142
      - kind: Deployment
        namespace: podcertificate-controller-system
        name: podcertificate-controller
        images: [podcertcontroller]
  # AX at sources.ax with the #375 patch (docs/AX.md, «AX»).
  ax:
    # The tag of the four AX images in the local registry and in the backup
    # layout: the AX commit and the patch the images were built from.
    tag: f009cc8-issue375
    # Seeded byte for byte from the manual lab's registry, never compiled on
    # the host, and pinned by the digest of their single-platform manifest.
    # The two ko images are the manifests the manual lab pushed, vendored in
    # images/ax/manifests. The runner and the agents images are the linux/amd64
    # manifests of the buildx indexes the manual lab pushed
    # (ax-task-runner@sha256:5d536baa..., ax-agents@sha256:f82e9848...),
    # whose other entry is a build attestation.
    images:
      ax-controller: >-
        sha256:2a744737051c6e877213e25f49ff2408b3399e8f3176f4e203df9c515fc351d2
      ax-server: >-
        sha256:621ce24e8887a6fcbf4d4b31da1dc005e0c54210bc28275a912640b97c2667f1
      ax-task-runner: >-
        sha256:a5f9ee65df155af434ecf06cb79be4beb7d09b2621d05b38730c682925220bd4
      ax-agents: >-
        sha256:d136aebb3f8393e4c994ecd7e4dd4296d5eea7b38e2a32d8087776dae9bb2682
    # /usr/local/bin/ax-task-runner inside ax-task-runner and ax-agents, as
    # the reproducibility workflow rebuilds it (Makefile, line 49).
    task_runner_binary_sha256: >-
      0bcf4930c56d9a0b2343f8bfd493aa23bff1d4688cb2ddba6b3f0587a283faec
    # The ko base the manual lab resolved cgr.dev/chainguard/static:latest to
    # (.ko.yaml, line 15), for the reproducibility workflow only.
    ko_base_image: "cgr.dev/chainguard/static@sha256:\
      41e17ed83c594a64a9396b6ab96dd26d5ddc290dacf4c177464712ff21ad534f"
    # The ax CLI (Makefile, line 36), dynamically linked: seeded once from
    # the manual lab into this root-only file and installed from it by sha256.
    cli_sha256: acd1f36d86557a697c49956110c9f80ba260db2cefb1a6497b166fa43f52ebb7
    cli_backup: /var/backups/dockerswarm/ax-lab/binaries/ax
    # Where the controller keeps suspend snapshots: Substrate's kind rustfs
    # bucket (manifests/ate-install/kind/rustfs.yaml, lines 121-126).
    snapshots_bucket: gs://ate-snapshots/ax/
    # Redis keeps AX's Tasks on a local-path volume, as RDB snapshots only.
    redis:
      volume_mib: 1024
      save_seconds: 60
    # The lab's one WorkerPool. The workers' CPU limits together (replicas x
    # cpu_limit_millicores) leave at least 500m of the node to etcd, the API
    # server and Substrate, and their memory together leaves
    # node_platform_reserve_mib of the node's limit to everything else.
    worker_pool:
      namespace: ax-workers
      name: ax
      replicas: 1
      memory_mib: 1536
      cpu_request_millicores: 250
      cpu_limit_millicores: 1500
    node_platform_reserve_mib: 1792
    # atenet-router's --route-timeout, so that an agent's long `ax ssh`
    # stream is not cut (cmd/atenet/internal/router/cmd.go, line 73).
    router_route_timeout: 1h
  # The AX web panel behind https://ax.apptolast.com (docs/AX_WEB.md): the
  # only published part of the lab, by owner decision of 2026-09-26. ax-server
  # is still never published. Traefik (playbook edge) reaches the forwarder
  # ax-web-edge over network edge_network; the forwarder pipes TCP to the
  # panel's NodePort on the kind bridge, and the panel only accepts Traefik's
  # client certificate (mTLS). No credential is versioned: the TLS material
  # and the agent token reach Kubernetes only through the owner-run
  # scripts/ax-web-bootstrap.sh.
  web:
    namespace: ax-web
    # images/ax-web, built by ko v0.19.1 and reproduced twice with the same
    # digest by .github/workflows/ax-web.yml, which also fails when it builds
    # another one. Seeded into the backup layout from that workflow's OCI
    # layout (manage-ax-lab-substrate.py seed-layout) and restored into the
    # registry like the AX images; never built on this host.
    image:
      name: ax-web
      tag: "0.1.0"
      digest: >-
        sha256:e8128547a95a3adcbb9a488faa9b379fdb9fa132337d7404cad073b2c3d78faa
    # The panel's mTLS port, published by a NodePort Service on the kind
    # bridge only (the node's ports are not published on the host), and its
    # plain probe port, which no Service exposes.
    port: 8443
    node_port: 30843
    health_port: 8081
    # kind's default IPv4 pod subnet (kind configuration guide, «Pod
    # Subnet»; the kind-config.yaml.j2 of this role sets none): the panel
    # admits no connection from a pod, sandboxes included.
    pod_subnet: 10.244.0.0/16
    origin: https://ax.apptolast.com
    # The TLS server name and the only client certificate subject the panel
    # accepts, as the edge serversTransport presents them.
    server_name: ax-web
    client_common_name: edge-traefik
    # Root-only directory where the bootstrap keeps the panel's certificate,
    # key and client CA, to restore the Kubernetes Secret after a cluster
    # recreation without touching Traefik.
    tls_directory: /etc/dockerswarm/ax/web-tls
    # What a run may use: public https repositories of these hosts only, up
    # to max_turns turns and max_timeout_minutes minutes, never across the
    # Observatorio window (UTC); an active run is cancelled
    # watchdog_lead_minutes before it.
    repo_hosts: [github.com]
    blackout_utc: "22:30-00:40"
    watchdog_lead_minutes: 5
    max_turns: 50
    max_timeout_minutes: 45
    # The prompt goes to the agent on stdin; "argument" is the fallback if
    # the lab window shows that `claude -p` ignores it (images/ax-web).
    prompt_mode: stdin
    # A plain Docker container on the kind network and on edge_network, run
    # like the lab containers: restart policy "no" and the limits of
    # host_containers.ax-lab.ax-web-edge in config/capacity-profiles.yml.
    forwarder:
      container: ax-web-edge
      port: 8443
      # Created attachable by the edge playbook with exactly this subnet
      # (never by this role, which only inspects it). The forwarder passes
      # it as --allow-cidr: no peer outside Traefik's network, such as a
      # sandbox on the kind bridge, reaches the panel through it.
      edge_network: apptolast-edge-ax
      edge_subnet: 10.0.250.0/24
      resources:
        memory_limit_mib: 32
        memory_reservation_mib: 16
        cpu_limit_millicores: 250
        pids_limit: 64
      restart_policy: "no"
# Owner acceptance that the kind node runs root-equivalent: kind starts it
# with --privileged and seccomp and AppArmor unconfined (kind v0.33.0
# pkg/cluster/internal/providers/docker/provision.go, lines 226-228). The
# role refuses to create or touch the cluster while it is false.
#
# Accepted by the owner on 2026-09-25, who delegated the decision on every
# recommendation of the AX lab plan ("Si a todo, autorizo todo, seguiré todas
# tus recomendaciones"). It accepts a privileged node without seccomp or
# AppArmor confinement, root-equivalent on this host, bound to loopback and
# never published. See docs/AX.md, «Aceptación del nodo privilegiado».
ax_lab_privileged_node_accepted: true
# The explicit fallback: Substrate images the role may build on this host,
# one at a time and only while the lab node is not running, when neither the
# backup nor the registry holds them (docs/AX.md, «Compilación de reserva»).
# Normal applies build nothing: this list stays empty outside a reviewed lab
# window, and every build must reproduce its pinned digest exactly. For the
# first window it lists ate-setup, the one image the manual lab never built;
# the change that records that window empties it again.
ax_lab_substrate_fallback_builds: [ate-setup]
