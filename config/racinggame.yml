---
# Reviewed contract of the independent racing-game stack (stack
# `racinggame`, service `web`). scripts/validate-racinggame.py pins every
# value below and renders stacks/racinggame/stack.yml.j2.
#
# The game is a single stateless Node process: it serves the static client
# and runs the authoritative race simulation in memory. It owns no volume,
# no database and no secret, so a lost server is rebuilt from this commit
# plus the published image alone.
#
# `images.web` is the reviewed baseline, kept as restore evidence. What the
# service actually runs is the `:latest` channel in
# config/image-channels.yml, which the watcher re-pins between deploys.
racinggame:
  schema_version: 1
  stack_name: racinggame
  # Commit of bauti-py/juegos-free the baseline image was built from; the
  # image carries it as org.opencontainers.image.revision.
  release: 2ea2846624f8680df5c6b9362c463b81a38f7572
  hostname: racinggame.apptolast.com
  edge_network: apptolast-edge-racinggame
  images:
    web: "ocholoko888/racinggame@sha256:\
      a61822adc31414e236eac0220fa759569d42c982711bccb5d84050e8cb47c911"
