---
platform_environment: production
platform_release_version: 0.1.0
platform_node_id: netcup-manager-01
platform_admin_uid: 1001
platform_admin_gid: 1001
platform_public_ipv4: 159.195.156.57
platform_dns_legacy_ipv4: 138.199.157.58
# El corte de DNS ya ocurrio: las diez etiquetas resuelven a
# platform_public_ipv4 (verificado con `dig +short <etiqueta>.apptolast.com A`
# el 2026-07-28) y el servidor legado 138.199.157.58 fue eliminado por el
# propietario. Mientras estas banderas declaraban `false`, dns.tf calculaba
# `cutover ? public : legacy`, de modo que un `terraform apply` habria
# reapuntado nueve registros vivos a un servidor inexistente. Declarar aqui el
# estado real convierte ese apply en un no-op y devuelve al repositorio la
# condicion de fuente de verdad que exige la regla de oro.
platform_dns_cutover:
  edge: true
  kropia: true
  minecraft-stats: true
  minecraft: true
  n8n: true
  openclaw: true
  passbolt: true
  generadorcodigosqr: true
  pablohurtadohg: true
  albertohidalgo: true
platform_public_ipv6: "2a0a:4cc0:c2:866b:142e:fff:fef4:c4da"
platform_public_ipv6_prefix: "2a0a:4cc0:c2:866b::/64"
platform_public_interface: eth0
platform_netcup_server_id: 900782
platform_netcup_server_mac: "16:2e:0f:f4:c4:da"
platform_swarm_data_path_port: 4789
platform_swarm_default_addr_pool:
  - 10.0.0.0/8
platform_swarm_default_addr_pool_mask_length: 24
platform_install_root: /opt/dockerswarm
platform_state_root: /srv/dockerswarm
platform_edge_monitoring_network: apptolast-edge-monitoring
platform_edge_networks:
  kropia: apptolast-edge-kropia
  minecraft-stats: apptolast-edge-minecraft-stats
  n8n: apptolast-edge-n8n
  openclaw: apptolast-edge-openclaw
  passbolt: apptolast-edge-passbolt
  portfolio-alberto: apptolast-edge-portfolio-alberto
  portfolio-pablo: apptolast-edge-portfolio-pablo
  shlink: apptolast-edge-shlink
platform_public_tcp_ports:
  - 80
  - 443
  - 25565
platform_minecraft_public_enabled: true
# Aceptacion explicita, codificada y auditable del riesgo de publicar el
# servidor de Minecraft con `online_mode: false` (config/minecraft.yml). Al
# desactivarse la autenticacion de Mojang/Microsoft, cualquiera que alcance el
# 25565 puede conectarse con CUALQUIER nombre de usuario, incluido el de un
# operador. El propietario fue informado de esta consecuencia exacta y la
# acepto. La compuerta no se elimina: sigue existiendo y falla en cerrado
# mientras esta bandera valga `false`, que es su valor por defecto.
platform_minecraft_offline_public_accepted: true
# Servicios del stack `workloads` aparcados por decision del propietario
# (2026-09-25) para liberar RAM y CPU del host. Un servicio aparcado se
# renderiza con `replicas: 0`: no corre ninguna tarea ni reserva recursos en
# Swarm y libera su presupuesto en config/capacity.yml, pero conserva imagen,
# datos, secretos, redes y ruta del edge. Volver a arrancarlo es quitarlo de
# esta lista, devolver su presupuesto a config/capacity.yml y
# config/capacity-profiles.yml en el mismo cambio (hoy exige ademas una
# decision de capacidad: con los stacks externos no cabe sin mas) y aplicar
# `--playbook edge` y despues `--playbook workloads`. Lista ordenada y sin
# duplicados, `[]` si no hay ninguno (un valor vacio se rechaza); solo admite
# los servicios que ningun otro necesita para funcionar (minecraft, openclaw).
# La compuerta publica de Minecraft no cambia: el firewall sigue admitiendo el
# 25565 y el apply de workloads exige que ningun proceso del host escuche en
# el mientras esta aparcado.
platform_parked_workloads:
  - minecraft
  - openclaw
platform_public_ipv6_tcp_ports: []
edge_cloudflare_zone: apptolast.com
edge_traefik_hostname: edge.apptolast.com
