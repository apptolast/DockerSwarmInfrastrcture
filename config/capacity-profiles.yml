---
# Mutually exclusive capacity plans. `active` names the plan the host
# actually runs; every plan is still checked against the host budget
# on each run, so an inactive one can never drift out of reach.
#
# A plan is edge + workloads + its application stacks + autoupdater, plus
# every external stack below and the host container groups it lists. The
# active plan runs two applications, so `stacks` lists both; the
# observability plan stays a single-application alternative.
capacity_profiles:
  schema_version: 1
  active: organizationweb
  profiles:
    # Both totals leave out the budget of minecraft and openclaw while
    # config/platform.yml parks them (config/capacity.yml reviewed_totals),
    # and include the external stacks (50m/16 MiB reserved, 2050m/896 MiB
    # limited). Only the active plan runs the AX lab (host container group
    # ax-lab: 560m/1936 MiB reserved, 2750m/3872 MiB limited), which leaves
    # it 224 MiB under the 12397 MiB memory limit budget. The observability
    # plan requires the lab stopped.
    observability:
      stacks: [edge, workloads, observability, autoupdater]
      host_containers: []
      aggregate:
        reservations: {cpu_millicores: 2920, memory_mib: 4066}
        limits: {cpu_millicores: 16000, memory_mib: 8941}
    organizationweb:
      stacks: [edge, workloads, organizationweb, racinggame, autoupdater]
      host_containers: [ax-lab]
      aggregate:
        reservations: {cpu_millicores: 3110, memory_mib: 5682}
        limits: {cpu_millicores: 16900, memory_mib: 12173}
  organizationweb:
    expected_services: [backend, postgres, rabbitmq, web]
    aggregate:
      reservations: {cpu_millicores: 500, memory_mib: 800}
      limits: {cpu_millicores: 2250, memory_mib: 1600}
  racinggame:
    expected_services: [web]
    aggregate:
      reservations: {cpu_millicores: 200, memory_mib: 128}
      limits: {cpu_millicores: 1000, memory_mib: 256}
  # Swarm stacks deployed on this host outside this repository: no stack
  # file, image or source lives here. Each service is declared with the
  # replicas and resources measured live on 2026-09-25; every plan counts
  # them, and every apply compares them with the live services, so a change
  # on either side stops the next apply until this contract matches again.
  external_stacks:
    satisfactory-companions:
      radio:
        replicas: 1
        reservations: {cpu_millicores: 0, memory_mib: 0}
        limits: {cpu_millicores: 350, memory_mib: 192}
      web:
        replicas: 1
        reservations: {cpu_millicores: 0, memory_mib: 0}
        limits: {cpu_millicores: 350, memory_mib: 192}
      worker:
        replicas: 1
        reservations: {cpu_millicores: 0, memory_mib: 0}
        limits: {cpu_millicores: 350, memory_mib: 192}
    satisfactory-events:
      audit:
        replicas: 1
        reservations: {cpu_millicores: 0, memory_mib: 0}
        limits: {cpu_millicores: 250, memory_mib: 96}
      publisher:
        replicas: 1
        reservations: {cpu_millicores: 0, memory_mib: 0}
        limits: {cpu_millicores: 250, memory_mib: 96}
    sftp:
      downloads:
        replicas: 1
        reservations: {cpu_millicores: 50, memory_mib: 16}
        limits: {cpu_millicores: 500, memory_mib: 128}
  # Plain Docker containers run on this host outside Swarm, grouped by what
  # runs them: group -> container name -> reservations, limits (both
  # {cpu_millicores, memory_mib}) and pids_limit. A plan counts only the
  # groups its `host_containers` lists. Every apply inspects each declared
  # container. One of the active plan may be absent or stopped: it runs no
  # process and its budget stays reserved, so no playbook depends on it
  # running. One that exists, running or stopped, must carry exactly the
  # declared Memory, MemoryReservation, NanoCpus and PidsLimit; only the
  # ax-lab playbook, which creates and converges its own group, may start
  # while that group carries other limits. A container of any other group
  # must be absent or stopped.
  host_containers:
    # The AX lab's kind node, local registry and web forwarder (docs/AX.md,
    # docs/AX_WEB.md). The memory limits, reservations, CPU limits and pids
    # limits equal `resources` of config/ax-lab.yml, which the role applies
    # with `docker update` (the forwarder with `docker run`). The
    # node used 1.62-1.70 GiB steady and peaked at 3082 MiB while starting
    # (2026-09-25). The registry used 17-29 MiB without page cache (12.6 MiB
    # anonymous); its memory.peak of 376.8 MiB is mostly the reclaimable file
    # cache of the pushed blobs, with oom_kill 0 (docs/CAPACITY.md). The CPU
    # reservations only count in the budget: Docker does not reserve CPU for
    # a container.
    ax-lab:
      kind-control-plane:
        reservations: {cpu_millicores: 500, memory_mib: 1792}
        limits: {cpu_millicores: 2000, memory_mib: 3584}
        pids_limit: 4096
      kind-registry:
        reservations: {cpu_millicores: 50, memory_mib: 128}
        limits: {cpu_millicores: 500, memory_mib: 256}
        pids_limit: 256
      # The AX web panel's TCP forwarder (docs/AX_WEB.md): a Go pipe with at
      # most 64 connections, run with the limits of `web.forwarder` in
      # config/ax-lab.yml. Its CPU reservation only counts in the budget.
      ax-web-edge:
        reservations: {cpu_millicores: 10, memory_mib: 16}
        limits: {cpu_millicores: 250, memory_mib: 32}
        pids_limit: 64
