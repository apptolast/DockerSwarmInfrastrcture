---
# Mutually exclusive capacity plans. `active` names the plan the host
# actually runs; every plan is still checked against the host budget
# on each run, so an inactive one can never drift out of reach.
#
# A plan is edge + workloads + its application stacks + autoupdater, plus
# every external stack below and the host container groups it lists. The
# active plan runs two applications, so `stacks` lists both; the
# observability plan stays a single-application alternative.
capacity_profiles:
  schema_version: 1
  active: organizationweb
  profiles:
    # Both totals leave out the budget of minecraft and openclaw while
    # config/platform.yml parks them (config/capacity.yml reviewed_totals),
    # and include the external stacks (50m/16 MiB reserved, 2050m/896 MiB
    # limited). Neither plan runs a host container group yet.
    observability:
      stacks: [edge, workloads, observability, autoupdater]
      host_containers: []
      aggregate:
        reservations: {cpu_millicores: 2920, memory_mib: 4066}
        limits: {cpu_millicores: 16000, memory_mib: 8941}
    organizationweb:
      stacks: [edge, workloads, organizationweb, racinggame, autoupdater]
      host_containers: []
      aggregate:
        reservations: {cpu_millicores: 2550, memory_mib: 3746}
        limits: {cpu_millicores: 14150, memory_mib: 8301}
  organizationweb:
    expected_services: [backend, postgres, rabbitmq, web]
    aggregate:
      reservations: {cpu_millicores: 500, memory_mib: 800}
      limits: {cpu_millicores: 2250, memory_mib: 1600}
  racinggame:
    expected_services: [web]
    aggregate:
      reservations: {cpu_millicores: 200, memory_mib: 128}
      limits: {cpu_millicores: 1000, memory_mib: 256}
  # Swarm stacks deployed on this host outside this repository: no stack
  # file, image or source lives here. Each service is declared with the
  # replicas and resources measured live on 2026-09-25; every plan counts
  # them, and every apply compares them with the live services, so a change
  # on either side stops the next apply until this contract matches again.
  external_stacks:
    satisfactory-companions:
      radio:
        replicas: 1
        reservations: {cpu_millicores: 0, memory_mib: 0}
        limits: {cpu_millicores: 350, memory_mib: 192}
      web:
        replicas: 1
        reservations: {cpu_millicores: 0, memory_mib: 0}
        limits: {cpu_millicores: 350, memory_mib: 192}
      worker:
        replicas: 1
        reservations: {cpu_millicores: 0, memory_mib: 0}
        limits: {cpu_millicores: 350, memory_mib: 192}
    satisfactory-events:
      audit:
        replicas: 1
        reservations: {cpu_millicores: 0, memory_mib: 0}
        limits: {cpu_millicores: 250, memory_mib: 96}
      publisher:
        replicas: 1
        reservations: {cpu_millicores: 0, memory_mib: 0}
        limits: {cpu_millicores: 250, memory_mib: 96}
    sftp:
      downloads:
        replicas: 1
        reservations: {cpu_millicores: 50, memory_mib: 16}
        limits: {cpu_millicores: 500, memory_mib: 128}
  # Plain Docker containers run on this host outside Swarm, grouped by what
  # runs them: group -> container name -> reservations, limits (both
  # {cpu_millicores, memory_mib}) and pids_limit. A plan counts only the
  # groups its `host_containers` lists. Every apply inspects each declared
  # container: those of the active plan must run with exactly the declared
  # Memory, MemoryReservation, NanoCpus and PidsLimit, and those of any other
  # group must be absent or stopped. None is declared yet.
  host_containers: {}
