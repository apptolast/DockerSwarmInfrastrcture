---
# Single source of what every rendered Docker Swarm service runs.
#
# - `repo:tag` is a channel. The Docker CLI resolves it to a digest when the
#   stack is deployed (`resolve_image: changed`), and the watcher re-pins it
#   between deploys only when `autoupdate: true`.
# - `repo:tag@sha256:...` is a hold: never updated automatically. A
#   digest-only reference is accepted only as the byte-exact baseline hold.
# - `baseline` names the reviewed catalog entry (config/services.yml,
#   config/organizationweb.yml or the observability components). Those files
#   stay untouched as restore evidence; the repository must match.
#
# scripts/validate-image-channels.py enforces the contract, including the
# major channel table for stateful services. See docs/AUTOUPDATE.md.
image_channel_schema_version: 1
image_channel_autoupdate_label: apptolast.autoupdate

image_channel_services:
  # --- edge ---------------------------------------------------------------
  - stack: edge
    service: traefik
    baseline: {catalog: traefik-edge, component: proxy}
    reference: "traefik@sha256:\
      652929a140a32d7cafafb13c6cdfab5376cfeff800f51397b87b524501ed02a8"
    class: stateful-major
    autoupdate: false

  # --- workloads ----------------------------------------------------------
  # kropia, minecraft-stats, portfolio-pablo and minecraft already run their
  # :latest head in production; these entries adopt that drift into Git.
