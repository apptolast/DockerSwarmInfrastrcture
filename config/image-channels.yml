image_channel_exclusions:
  - stack: workloads
    service: n8n-runners
    reason: >-
      Built locally from images/n8n-runners with a content-addressed
      src-<sha256> tag; it has no registry channel and must stay in lock-step
      with the n8n version.
  - stack: autoupdater
    service: shepherd
    reason: >-
      The watcher never updates itself; its pinned digest is bumped only by a
      reviewed pull request.
