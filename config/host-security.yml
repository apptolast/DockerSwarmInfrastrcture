# These pre-existing tools remain outside the managed minimum until their
# configurations, data and retention requirements receive a separate,
# owner-approved decommission/adoption plan. The host-security role records
# their presence but never installs, removes, purges or rewrites them.
host_security_legacy_tool_policy: preserve-unmanaged
host_security_preserved_legacy_packages:
  - aide
  - aide-common
  - chkrootkit
  - clamav
  - clamav-base
  - clamav-daemon
  - clamav-freshclam
  - libpam-google-authenticator
  - logwatch
  - lynis
  - needrestart
  - rkhunter
host_security_required_active_services:
  - apparmor.service
  - chrony.service
  - crowdsec.service
  - crowdsec-firewall-bouncer.service
  - fail2ban.service
  - psad.service
  - rsyslog.service

# Ubuntu 26.04 uses Chrony with NTS by default. NTS key exchange needs
# 4460/tcp in addition to traditional NTP on 123/udp.
host_security_required_host_egress:
  - protocol: tcp
    port: 25
  - protocol: udp
    port: 25
  - protocol: tcp
    port: 43
  - protocol: tcp
    port: 53
  - protocol: udp
    port: 53
  - protocol: tcp
    port: 80
  - protocol: tcp
    port: 123
  - protocol: udp
    port: 123
  - protocol: tcp
    port: 443
  - protocol: udp
    port: 443
  - protocol: tcp
    port: 587
  - protocol: udp
    port: 587
  - protocol: tcp
    port: 4460

host_security_fail2ban_maxretry: 5
host_security_psad_log_path: /var/log/iptables.log
host_security_psad_auto_ids_danger_level: 5

# Decisión del propietario registrada el 2026-07-28: el MFA de SSH mediante
# pam_google_authenticator se retira formalmente. Estaba instalado desde el
# 2026-07-21 pero era inerte: ningún usuario tenía `~/.google_authenticator` y
# el modificador `nullok` hace que el módulo dé por buena la autenticación
# cuando no hay secreto, de modo que el acceso ya era sólo por clave pública.
# Retirarlo no cambia cómo se entra al host; lo que hace es dejar de fingir un
# segundo factor que nunca existió, y permite que la plantilla de
# endurecimiento SSH deje de tratarlo como estado a preservar.
host_security_ssh_mfa_policy: retired

# Endurecimiento de /proc. `hidepid=2` (que el nucleo representa como
# `invisible`) oculta por completo los /proc/<pid> ajenos, incluidos uid y
# gid, segun la documentacion oficial del kernel en
# https://docs.kernel.org/filesystems/proc.html. Estaba aplicado a mano en
# /etc/fstab desde el 2026-07-21 y no lo recogia ningun commit, de modo que
# una reconstruccion desde el repositorio habria devuelto el host sin esa
# proteccion. Aquella linea manual usaba ademas `defaults`, que implica
# `suid,dev,exec` y por tanto retiraba `nosuid,nodev,noexec`, las opciones con
# las que systemd monta /proc por defecto; aqui se restituyen.
host_security_proc_mount_options: nosuid,nodev,noexec,relatime,hidepid=2
host_security_proc_required_options:
  - nosuid
  - nodev
  - noexec
  - relatime
  - hidepid=invisible
