---
name: AX lab images

# Builds what config/ax-lab.yml pins of the lab's Go images, from the pinned
# commits, the patches under images/ax and the toolbox images.toolbox, with
# the same build steps ax-lab-reproducibility.yml proves them with, and keeps
# the result as run artifacts for the owner's production window: the
# Substrate images as one OCI image layout, and the ax CLI with the ko images
# of ax-controller and ax-server as OCI image layouts and manifests.
#
# Every digest and hash is printed in the log and in the run summary before
# any is compared. The Substrate digests and the sha256 of the CLI must equal
# their pins before anything is kept, and so must the ko digests once the
# config sets sources.ax.modules_patch; until then they are the manual lab's,
# which a rebuild matches but for the annotation that names the base image,
# and the other workflow proves them up to it. A pending or stale pin fails
# the job, lists what the build produced and keeps nothing. The kept files
# are then consumed in the job as the owner will: unzipped by root into a
# fresh directory and copied into a new root-only layout with
# scripts/manage-ax-lab-substrate.py seed-layout, forgotten by exact digest
# and seeded again, also from a snapshot of the layout as a rollback does
# (docs/AX.md, «Copia de seguridad»). Only pushes to main and manual runs
# keep the files; a pull request runs everything else.
#
# Nothing is pushed anywhere and no credential is used. ax-task-runner and
# ax-agents are not rebuilt: they cannot be rebuilt byte for byte and stay as
# seeded, and the runner binary they carry is proved by the other workflow
# with images.runner_toolbox.

"on":
  pull_request:
    paths:
      - config/ax-lab.yml
      - images/ax/**
      - scripts/manage-ax-lab-substrate.py
      - scripts/validate-ax-lab.py
      - .github/workflows/ax-lab-images.yml
  push:
    branches:
      - main
    paths:
      - config/ax-lab.yml
      - images/ax/**
      - scripts/manage-ax-lab-substrate.py
      - scripts/validate-ax-lab.py
      - .github/workflows/ax-lab-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ax-lab-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  substrate:
    name: Build the Substrate images and keep their OCI layout
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out this repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the locked Python runtime
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            ansible/requirements-dev.in
            ansible/requirements-dev.txt

      - name: Bootstrap locked tooling
        run: ./scripts/bootstrap-tooling.sh

      # The validator checks the whole contract first, so the plan only
      # carries reviewed values: a 40-hex commit, digest-pinned images and
      # the build limits the role applies on the host.
      - name: Read the Substrate build plan from the validated contract
        id: plan
        run: |
          set -euo pipefail
          .venv/bin/python scripts/validate-ax-lab.py --substrate-plan \
            >"${RUNNER_TEMP}/plan.json"
          commit="$(jq -r .commit "${RUNNER_TEMP}/plan.json")"
          [[ "${commit}" =~ ^[a-f0-9]{40}$ ]]
          echo "commit=${commit}" >>"${GITHUB_OUTPUT}"

      - name: Check out Agent Substrate at the pinned commit
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: agent-substrate/substrate
          ref: ${{ steps.plan.outputs.commit }}
          path: substrate
          persist-credentials: false

      - name: Require the pristine pinned Substrate checkout
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git -C substrate rev-parse HEAD)" == "${COMMIT}" ]]
          dirty="$(git -C substrate status --porcelain --untracked-files=all)"
          [[ -z "${dirty}" ]]

      # The manager mounts the checkout read-only, so the patch and go mod
      # vendor run here, in the pinned toolbox. The checkout is left staged,
      # never committed: Go stamps vcs.modified from the staged tree, and a
      # commit would add a revision no rebuild could reproduce. The trees are
      # only recorded here, so every digest is still printed when one
      # differs; the gate below compares them with the pin.
      - name: Apply the Substrate modules patch and vendor the modules
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/plan.json"
          if ! jq -e .modules_patch "${plan}" >/dev/null; then
            echo "No Substrate modules patch is configured."
            exit 0
          fi
          patch="$(jq -er .modules_patch.path "${plan}")"
          sha="$(jq -er .modules_patch.sha256 "${plan}")"
          pinned="$(jq -er .modules_patch.tree "${plan}")"
          echo "${sha}  ${patch}" | sha256sum --check --strict
          paths="$(
            git -C substrate apply --numstat "${GITHUB_WORKSPACE}/${patch}" |
              cut -f3 | sort | paste -sd' '
          )"
          [[ "${paths}" == "go.mod go.sum" ]]
          git -C substrate apply --index "${GITHUB_WORKSPACE}/${patch}"
          mkdir -p "${RUNNER_TEMP}/go/home"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}/substrate:/src/substrate" \
            --volume "${RUNNER_TEMP}/go:/go-cache" \
            --env GOTOOLCHAIN=local \
            --env GOCACHE=/go-cache/build --env GOMODCACHE=/go-cache/mod \
            --env HOME=/go-cache/home \
            --workdir /src/substrate \
            "$(jq -r .toolbox_image "${plan}")" \
            bash -c 'set -euo pipefail; go mod vendor; go mod verify'
          git -C substrate add --all
          tree="$(git -C substrate write-tree)"
          vendor="$(git -C substrate rev-parse "${tree}:vendor")"
          jq -n --arg tree "${tree}" --arg vendor "${vendor}" \
            '{tree: $tree, vendor: $vendor}' \
            >"${RUNNER_TEMP}/substrate-trees.json"
          {
            echo "## Substrate tree after the modules patch"
            echo ""
            echo "- tree: \`${tree}\`"
            echo "- vendor/ subtree: \`${vendor}\`"
            echo "- pinned tree: \`${pinned}\`"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      # Root-owned, as on the host: the manager refuses a cache or layout
      # that another user could change. /opt is writable by others on
      # GitHub's Ubuntu runners, so the work tree lives under /var/lib.
      # Every image is built in turn, even after one fails, so the summary
      # lists every digest. A digest that differs from its pin is printed and
      # its layout is not written.
      - name: Build every pinned image with the role's bounded build
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/plan.json"
          sudo install -d -o root -g root -m 0755 /var/lib/ax-lab-ci
          sudo install -d -o root -g root -m 0700 /var/lib/ax-lab-ci/cache
          status=0
          for name in $(jq -r '.images | keys[]' "${plan}"); do
            digest="$(
              jq -r --arg name "${name}" '.images[$name] // "pending"' \
                "${plan}"
            )"
            sudo -- /usr/bin/python3 scripts/manage-ax-lab-substrate.py build \
              --image "${name}=${digest}" \
              --toolbox-image "$(jq -r .toolbox_image "${plan}")" \
              --source "${GITHUB_WORKSPACE}/substrate" \
              --cache /var/lib/ax-lab-ci/cache \
              --layout /var/lib/ax-lab-ci/backup \
              --version "$(jq -r .version "${plan}")" \
              --node-container kind-control-plane \
              --memory-mib "$(jq .build.memory_limit_mib "${plan}")" \
              --memory-reservation-mib \
              "$(jq .build.memory_reservation_mib "${plan}")" \
              --cpu-millicores "$(jq .build.cpu_limit_millicores "${plan}")" \
              --pids-limit "$(jq .build.pids_limit "${plan}")" \
              --timeout-seconds "$(jq .build.timeout_seconds "${plan}")" \
              --min-mem-available-mib \
              "$(jq .build.min_mem_available_mib "${plan}")" \
              --mem-available-floor-mib \
              "$(jq .build.mem_available_floor_mib "${plan}")" \
              >>"${RUNNER_TEMP}/builds.jsonl" || status=1
          done
          cat "${RUNNER_TEMP}/builds.jsonl"
          exit "${status}"

      - name: Print every digest built
        if: always()
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/plan.json"
          builds="${RUNNER_TEMP}/builds.jsonl"
          touch "${builds}"
          {
            echo "## Substrate images built from source"
            echo ""
            echo "| Image | Pinned | Built | Seconds | Peak memory |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r --slurpfile plan "${plan}" '
              [.name, ($plan[0].images[.name] // "pending"),
               (.digest // "none"), (.seconds // "-"),
               (.memory_peak_bytes // "-")]
              | "| " + (map(tostring) | join(" | ")) + " |"
            ' "${builds}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      # The last gate before anything is kept: the tree is compared here, not
      # in the step that vendors, so a differing tree never hides a digest.
      - name: Require every image pinned and every digest reproduced
        if: always()
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/plan.json"
          builds="${RUNNER_TEMP}/builds.jsonl"
          touch "${builds}"
          status=0
          jq --exit-status --slurp --slurpfile plan "${plan}" '
            (map(.name) | sort) == ($plan[0].images | keys | sort)
            and all(.[]; .digest != null
              and $plan[0].images[.name] == .digest)
          ' "${builds}" || status=1
          if jq -e .modules_patch "${plan}" >/dev/null; then
            pinned="$(jq -er .modules_patch.tree "${plan}")"
            built="$(
              jq -r '.tree // "none"' "${RUNNER_TEMP}/substrate-trees.json" \
                2>/dev/null || echo none
            )"
            {
              echo ""
              echo "Substrate tree after the modules patch: pinned" \
                "\`${pinned}\`, built \`${built}\`"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            [[ "${built}" == "${pinned}" ]] || status=1
          fi
          exit "${status}"

      # The manager keeps its layout root-only, which the uploader cannot
      # read. The copy belongs to the runner user, with the plan's pins and
      # the recorded trees beside it.
      - name: Stage the OCI layout of the Substrate images
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/plan.json"
          keep="${RUNNER_TEMP}/keep/substrate"
          trees="${RUNNER_TEMP}/substrate-trees.json"
          [[ -f "${trees}" ]] || echo '{}' >"${trees}"
          mkdir -p "${RUNNER_TEMP}/keep"
          sudo rm -rf /var/lib/ax-lab-ci/cache
          sudo cp -R /var/lib/ax-lab-ci/backup "${keep}"
          sudo chown -R "$(id -u):$(id -g)" "${keep}"
          jq --slurpfile trees "${trees}" --arg run "${GITHUB_RUN_ID}" '
            {version, commit, toolbox_image, images,
             modules_patch: (.modules_patch // null),
             trees: $trees[0], run: $run}
          ' "${plan}" >"${keep}/pins.json"
          chmod -R u+rwX,go+rX,go-w "${keep}"

      # What the owner does in the production window (docs/AX.md, «Copia de
      # seguridad»), on the bytes that are kept: unzipped by root into a
      # fresh directory, copied into a root-only layout with seed-layout,
      # snapshotted, forgotten by exact digest and seeded again, from the
      # files and then from the snapshot, which is how a rollback restores.
      # The manager refuses sources and layouts that another user owns, so
      # none of it lives under RUNNER_TEMP. A re-pin under one tag is
      # rehearsed first in a layout of its own: a name that holds another
      # digest cannot be seeded until that exact digest is forgotten.
      - name: Prove the kept layout with seed-layout and forget
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/plan.json"
          result="${RUNNER_TEMP}/result.json"
          failure="${RUNNER_TEMP}/failure.txt"
          tag="$(jq -r .version "${plan}")"
          root=/var/lib/ax-lab-ci/seed
          manager=(sudo -- /usr/bin/python3 scripts/manage-ax-lab-substrate.py)
          mapfile -t pins < <(
            jq -r '.images | to_entries[] | select(.value != null)
              | "--image=\(.key)=\(.value)"' "${plan}"
          )
          [[ "${#pins[@]}" -eq 7 ]]
          expect() {
            jq --exit-status --argjson count "${#pins[@]}" --arg state "$1" \
              'length == $count and all(.[]; . == $state)' "${result}"
          }
          expect_status() {
            jq --exit-status --argjson count "${#pins[@]}" --arg state "$1" \
              '.backup | length == $count and all(.[]; . == $state)' \
              "${result}"
          }
          a="$(jq -r '.images | keys | .[0]' "${plan}")"
          b="$(jq -r '.images | keys | .[1]' "${plan}")"
          pin_a="$(jq -r --arg n "${a}" '.images[$n]' "${plan}")"
          pin_b="$(jq -r --arg n "${b}" '.images[$n]' "${plan}")"
          [[ "${pin_a}" != "${pin_b}" ]]
          sudo install -d -o root -g root -m 0755 /var/lib/ax-lab-ci "${root}"
          sudo install -d -o root -g root -m 0700 "${root}/in"
          (
            cd "${RUNNER_TEMP}/keep/substrate"
            /usr/bin/python3 -m zipfile -c "${RUNNER_TEMP}/substrate.zip" \
              oci-layout index.json blobs pins.json
          )
          sudo -- /usr/bin/python3 -I -m zipfile -e \
            "${RUNNER_TEMP}/substrate.zip" "${root}/in"
          # The rehearsal: a holds the digest of b, as an old pin would.
          "${manager[@]}" seed-layout --image-set substrate \
            --source "${root}/in" --layout "${root}/rehearsal" \
            --tag "${tag}" "--image=${a}=${pin_b}" | tee "${result}"
          jq --exit-status --arg n "${a}" '. == {($n): "seeded"}' "${result}"
          if "${manager[@]}" seed-layout --image-set substrate \
            --source "${root}/in" --layout "${root}/rehearsal" \
            --tag "${tag}" "--image=${a}=${pin_a}" \
            >/dev/null 2>"${failure}"; then
            echo "seed-layout named ${a}:${tag} with a second digest"
            exit 1
          fi
          cat "${failure}"
          grep -qF "with another digest" "${failure}"
          if "${manager[@]}" forget --image-set substrate \
            --layout "${root}/rehearsal" --tag "${tag}" \
            "--image=${a}=${pin_a}" >/dev/null 2>"${failure}"; then
            echo "forget dropped ${a}:${tag} by a digest it does not name"
            exit 1
          fi
          cat "${failure}"
          grep -qF ", not ${pin_a}" "${failure}"
          "${manager[@]}" forget --image-set substrate \
            --layout "${root}/rehearsal" --tag "${tag}" \
            "--image=${a}=${pin_b}" | tee "${result}"
          jq --exit-status --arg n "${a}" '. == {($n): "forgotten"}' "${result}"
          "${manager[@]}" seed-layout --image-set substrate \
            --source "${root}/in" --layout "${root}/rehearsal" \
            --tag "${tag}" "--image=${a}=${pin_a}" | tee "${result}"
          jq --exit-status --arg n "${a}" '. == {($n): "seeded"}' "${result}"
          # The window: seed, snapshot, forget, seed again, then the
          # rollback, which forgets and seeds from the snapshot.
          "${manager[@]}" seed-layout --image-set substrate \
            --source "${root}/in" --layout "${root}/images" \
            --tag "${tag}" "${pins[@]}" | tee "${result}"
          expect seeded
          "${manager[@]}" image-status --image-set substrate \
            --layout "${root}/images" --tag "${tag}" "${pins[@]}" \
            | tee "${result}"
          expect_status complete
          if "${manager[@]}" seed-layout --image-set substrate \
            --source "${root}/in" --layout "${root}/images" \
            --tag "${tag}" "--image=${a}=${pin_b}" \
            >/dev/null 2>"${failure}"; then
            echo "seed-layout gave ${a}:${tag} the digest of ${b}"
            exit 1
          fi
          cat "${failure}"
          grep -qF "with another digest" "${failure}"
          sudo cp -a "${root}/images" "${root}/snapshot"
          "${manager[@]}" forget --image-set substrate \
            --layout "${root}/images" --tag "${tag}" "${pins[@]}" \
            | tee "${result}"
          expect forgotten
          "${manager[@]}" image-status --image-set substrate \
            --layout "${root}/images" --tag "${tag}" "${pins[@]}" \
            | tee "${result}"
          expect_status missing
          "${manager[@]}" seed-layout --image-set substrate \
            --source "${root}/in" --layout "${root}/images" \
            --tag "${tag}" "${pins[@]}" | tee "${result}"
          expect seeded
          "${manager[@]}" forget --image-set substrate \
            --layout "${root}/images" --tag "${tag}" "${pins[@]}" \
            | tee "${result}"
          expect forgotten
          "${manager[@]}" seed-layout --image-set substrate \
            --source "${root}/snapshot" --layout "${root}/images" \
            --tag "${tag}" "${pins[@]}" | tee "${result}"
          expect seeded
          "${manager[@]}" image-status --image-set substrate \
            --layout "${root}/images" --tag "${tag}" "${pins[@]}" \
            | tee "${result}"
          expect_status complete

      # Only a push to main or a manual run keeps the files, and only after
      # every step above passed: a pull request proves the same and keeps
      # nothing.
      - name: Keep the OCI layout of the Substrate images
        if: github.event_name != 'pull_request'
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ax-lab-substrate-oci-layout
          path: ${{ runner.temp }}/keep/substrate
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  ax:
    name: Build the ax CLI and the ko images of AX and keep them
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out this repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the locked Python runtime
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            ansible/requirements-dev.in
            ansible/requirements-dev.txt

      - name: Bootstrap locked tooling
        run: ./scripts/bootstrap-tooling.sh

      # The validator checks the whole contract first, including the patches
      # and the vendored ko manifests against their pins.
      - name: Read the AX plan from the validated contract
        id: plan
        run: |
          set -euo pipefail
          .venv/bin/python scripts/validate-ax-lab.py --ax-plan \
            >"${RUNNER_TEMP}/ax-plan.json"
          commit="$(jq -r .commit "${RUNNER_TEMP}/ax-plan.json")"
          substrate="$(jq -r .substrate_commit "${RUNNER_TEMP}/ax-plan.json")"
          [[ "${commit}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${substrate}" =~ ^[a-f0-9]{40}$ ]]
          echo "commit=${commit}" >>"${GITHUB_OUTPUT}"
          echo "substrate=${substrate}" >>"${GITHUB_OUTPUT}"

      # With every tag: Go stamps the CLI with a pseudo-version derived from
      # the latest tag behind the commit (v0.3.0), and it is in the binary.
      - name: Check out AX at the pinned commit with its tags
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: google/ax
          ref: ${{ steps.plan.outputs.commit }}
          path: ax
          fetch-depth: 0
          persist-credentials: false

      # Only for ko v0.19.1, which Substrate pins in hack/tools/ko/go.mod.
      - name: Check out Agent Substrate at the pinned commit
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: agent-substrate/substrate
          ref: ${{ steps.plan.outputs.substrate }}
          path: substrate
          persist-credentials: false

      - name: Require the pristine pinned checkouts
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
          SUBSTRATE: ${{ steps.plan.outputs.substrate }}
        run: |
          set -euo pipefail
          [[ "$(git -C ax rev-parse HEAD)" == "${COMMIT}" ]]
          [[ -z "$(git -C ax status --porcelain --untracked-files=all)" ]]
          [[ "$(git -C ax describe --tags --abbrev=0)" == v0.3.0 ]]
          [[ "$(git -C substrate rev-parse HEAD)" == "${SUBSTRATE}" ]]
          dirty="$(git -C substrate status --porcelain --untracked-files=all)"
          [[ -z "${dirty}" ]]

      - name: Prepare the output and cache directories
        run: mkdir -p "${RUNNER_TEMP}/ax-out" "${RUNNER_TEMP}/go"

      # Staged, not committed: the manual lab's binaries carry
      # vcs.modified=true and a +dirty version, so the tree must be too.
      - name: Apply the vendored patch exactly as the manual lab staged it
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/ax-plan.json"
          patch="$(jq -r .patch.path "${plan}")"
          sha="$(jq -r .patch.sha256 "${plan}")"
          echo "${sha}  ${patch}" | sha256sum --check --strict
          git -C ax apply --index "${GITHUB_WORKSPACE}/${patch}"
          staged="$(git -C ax diff --cached | sha256sum | cut -d' ' -f1)"
          [[ "${staged}" == "${sha}" ]]

      # On top of the first patch, in the same index: only go.mod and go.sum
      # move. Nothing is pinned for the tree it writes: git apply is
      # deterministic for the pinned commit and two patches pinned by sha256.
      - name: Apply the AX modules patch on top of the vendored one
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/ax-plan.json"
          if ! jq -e .modules_patch "${plan}" >/dev/null; then
            echo "No AX modules patch is configured."
            exit 0
          fi
          modules="$(jq -er .modules_patch.path "${plan}")"
          sha="$(jq -er .modules_patch.sha256 "${plan}")"
          echo "${sha}  ${modules}" | sha256sum --check --strict
          paths="$(
            git -C ax apply --numstat "${GITHUB_WORKSPACE}/${modules}" |
              cut -f3 | sort | paste -sd' '
          )"
          [[ "${paths}" == "go.mod go.sum" ]]
          git -C ax apply --index "${GITHUB_WORKSPACE}/${modules}"
          tree="$(git -C ax write-tree)"
          {
            echo "## AX tree after both patches"
            echo ""
            echo "- tree: \`${tree}\` (not pinned)"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      # Makefile, line 36, at the pinned commit. The task runner binary is
      # not rebuilt here: the other workflow proves it with its own toolbox.
      - name: Rebuild the ax CLI
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/ax:/src/ax" \
            --volume "${RUNNER_TEMP}/ax-out:/out" \
            --volume "${RUNNER_TEMP}/go:/go-cache" \
            --env GOTOOLCHAIN=local --env GOFLAGS=-mod=readonly \
            --env GOCACHE=/go-cache/build --env GOMODCACHE=/go-cache/mod \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/src/ax \
            --workdir /src/ax \
            "$(jq -r .toolbox_image "${RUNNER_TEMP}/ax-plan.json")" \
            bash -c '
              set -euo pipefail
              go build -trimpath -ldflags="-s -w" -o /out/ax ./cmd/ax
              go version -m /out/ax | head -3
            '

      # ko's default namer and platform, as `ko resolve` ran in the manual
      # lab; the base is the digest cgr.dev/chainguard/static:latest had.
      - name: Rebuild the ko images of ax-controller and ax-server
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/ax:/src/ax" \
            --volume "${GITHUB_WORKSPACE}/substrate:/src/substrate:ro" \
            --volume "${RUNNER_TEMP}/ax-out:/out" \
            --volume "${RUNNER_TEMP}/go:/go-cache" \
            --env GOTOOLCHAIN=local --env GOFLAGS=-mod=readonly \
            --env GOCACHE=/go-cache/build --env GOMODCACHE=/go-cache/mod \
            --env HOME=/go-cache/home \
            --env GIT_CONFIG_COUNT=2 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/src/ax \
            --env GIT_CONFIG_KEY_1=safe.directory \
            --env GIT_CONFIG_VALUE_1=/src/substrate \
            --env KO_DOCKER_REPO=localhost:5001 \
            --env KO_DEFAULTBASEIMAGE="$(
              jq -r .ko_base_image "${RUNNER_TEMP}/ax-plan.json"
            )" \
            --workdir /src/ax \
            "$(jq -r .toolbox_image "${RUNNER_TEMP}/ax-plan.json")" \
            bash -c '
              set -euo pipefail
              ko="$(cd /src/substrate/hack/tools/ko && go tool -n ko)"
              for name in ax-controller ax-server; do
                "${ko}" build --push=false --sbom=none \
                  --oci-layout-path="/out/ko-${name}" "./cmd/${name}"
              done
            '

      # The log carries the bytes of each manifest as base64 beside the
      # sha256 that is its digest, so images/ax/manifests/<name>.json can be
      # written from the log of a run whose pins are not set yet.
      - name: Print every digest and hash built
        if: always()
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/ax-plan.json"
          out="${RUNNER_TEMP}/ax-out"
          sudo chmod -R a+rX "${out}" || true
          cli=none
          if [[ -f "${out}/ax" ]]; then
            cli="$(sha256sum "${out}/ax" | cut -d' ' -f1)"
          fi
          {
            echo "## AX built from source"
            echo ""
            echo "| Artifact | Pinned | Built |"
            echo "| --- | --- | --- |"
            echo "| ax CLI (sha256) | \`$(jq -r .cli_sha256 "${plan}")\` |" \
              "\`${cli}\` |"
            for name in ax-controller ax-server; do
              built=none
              index="${out}/ko-${name}/index.json"
              if [[ -f "${index}" ]]; then
                built="$(jq -r '.manifests[0].digest' "${index}")"
              fi
              pinned="$(jq -r --arg n "${name}" '.ko_images[$n]' "${plan}")"
              echo "| ${name} | \`${pinned}\` | \`${built}\` |"
            done
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          for name in ax-controller ax-server; do
            index="${out}/ko-${name}/index.json"
            [[ -f "${index}" ]] || continue
            built="$(jq -r '.manifests[0].digest' "${index}")"
            blob="${out}/ko-${name}/blobs/sha256/${built#sha256:}"
            {
              echo ""
              echo "Manifest of ${name}, sha256" \
                "$(sha256sum "${blob}" | cut -d' ' -f1), as base64 -w0:"
              base64 -w0 "${blob}"
              echo ""
            } | tee -a "${GITHUB_STEP_SUMMARY}"
          done

      # The CLI is linked against the toolbox's glibc, and the host's is the
      # constant below (docs/AX.md): a CLI that needs a newer symbol version
      # would not start there, after the backup it replaces was overwritten.
      - name: Require the ax CLI to need no newer glibc than the host has
        if: always()
        run: |
          set -euo pipefail
          host_glibc=2.43
          binary="${RUNNER_TEMP}/ax-out/ax"
          if [[ ! -f "${binary}" ]]; then
            echo "No ax CLI was built."
            exit 0
          fi
          command -v objdump >/dev/null
          readelf -h "${binary}" >/dev/null
          needed="$(
            objdump -T "${binary}" |
              grep -Eo 'GLIBC_[0-9]+(\.[0-9]+)*' | sed 's/^GLIBC_//' |
              sort -Vu | tail -n 1 || true
          )"
          echo "${needed:-none}" >"${RUNNER_TEMP}/ax-glibc.txt"
          {
            echo "## ax CLI and the host's glibc"
            echo ""
            echo "Highest GLIBC symbol version needed: ${needed:-none}" \
              "(host: ${host_glibc})"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          [[ -z "${needed}" ]] ||
            [[ "$(printf '%s\n%s\n' "${needed}" "${host_glibc}" |
              sort -V | tail -n 1)" == "${host_glibc}" ]]

      - name: Require the rebuilt CLI and ko images to match their pins
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/ax-plan.json"
          out="${RUNNER_TEMP}/ax-out"
          cli="$(sha256sum "${out}/ax" | cut -d' ' -f1)"
          [[ "${cli}" == "$(jq -r .cli_sha256 "${plan}")" ]]
          for name in ax-controller ax-server; do
            index="${out}/ko-${name}/index.json"
            jq --exit-status '.manifests | length == 1' "${index}" >/dev/null
            built="$(jq -r '.manifests[0].digest' "${index}")"
            blob="${out}/ko-${name}/blobs/sha256/${built#sha256:}"
            [[ "$(sha256sum "${blob}" | cut -d' ' -f1)" == "${built#sha256:}" ]]
            # Until the modules patch is configured these are not the pins:
            # the manual lab's images differ in the annotation that names
            # their base, which the other workflow proves up to.
            if jq -e .modules_patch "${plan}" >/dev/null; then
              pinned="$(jq -r --arg n "${name}" '.ko_images[$n]' "${plan}")"
              [[ "${built}" == "${pinned}" ]]
            fi
          done

      # The CLI, the layouts as built, the exact manifests to vendor and the
      # plan's pins, in one directory that belongs to the runner user.
      - name: Stage the ax CLI, the ko image layouts and their manifests
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/ax-plan.json"
          out="${RUNNER_TEMP}/ax-out"
          keep="${RUNNER_TEMP}/keep/ax"
          sudo chmod -R a+rX "${out}"
          mkdir -p "${keep}/manifests"
          cp "${out}/ax" "${keep}/ax"
          built='{}'
          for name in ax-controller ax-server; do
            index="${out}/ko-${name}/index.json"
            digest="$(jq -r '.manifests[0].digest' "${index}")"
            cp -R "${out}/ko-${name}" "${keep}/ko-${name}"
            cp "${out}/ko-${name}/blobs/sha256/${digest#sha256:}" \
              "${keep}/manifests/${name}.json"
            built="$(
              jq -c --arg n "${name}" --arg d "${digest}" \
                '. + {($n): $d}' <<<"${built}"
            )"
          done
          glibc=unknown
          if [[ -f "${RUNNER_TEMP}/ax-glibc.txt" ]]; then
            glibc="$(<"${RUNNER_TEMP}/ax-glibc.txt")"
          fi
          jq --argjson ko "${built}" --arg glibc "${glibc}" \
            --arg cli "$(sha256sum "${keep}/ax" | cut -d' ' -f1)" \
            --arg run "${GITHUB_RUN_ID}" '
            {tag, commit, substrate_commit, toolbox_image, patch,
             modules_patch: (.modules_patch // null), cli_sha256: $cli,
             ko_images: $ko, glibc: $glibc, run: $run}
          ' "${plan}" >"${keep}/pins.json"
          chmod -R u+rwX,go+rX,go-w "${keep}"

      # What the owner does in the production window (docs/AX.md, «Copia de
      # seguridad»), on the bytes that are kept: unzipped by root into a
      # fresh directory, each ko layout copied into a root-only layout with
      # seed-layout (one call per layout, as each holds a single manifest),
      # snapshotted, forgotten by exact digest and seeded again, from the
      # files and then from the snapshot, and the CLI installed by its
      # sha256. The digests are the ones the layouts list. A re-pin under one
      # tag is rehearsed first, as the other job does.
      - name: Prove the kept files with seed-layout and forget
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/ax-plan.json"
          keep="${RUNNER_TEMP}/keep/ax"
          results="${RUNNER_TEMP}/results.jsonl"
          failure="${RUNNER_TEMP}/failure.txt"
          tag="$(jq -er .tag "${plan}")"
          root=/var/lib/ax-lab-ci/seed
          manager=(sudo -- /usr/bin/python3 scripts/manage-ax-lab-substrate.py)
          names=(ax-controller ax-server)
          declare -A pin
          pins=()
          for name in "${names[@]}"; do
            pin[${name}]="$(jq -r '.manifests[0].digest' \
              "${keep}/ko-${name}/index.json")"
            pins+=("--image=${name}=${pin[${name}]}")
          done
          [[ "${#pins[@]}" -eq 2 ]]
          expect() {
            jq --exit-status --slurp --arg state "$1" \
              'add | length == 2 and all(.[]; . == $state)' "${results}"
          }
          expect_status() {
            jq --exit-status --arg state "$1" \
              '.backup | length == 2 and all(.[]; . == $state)' "${results}"
          }
          sudo install -d -o root -g root -m 0755 /var/lib/ax-lab-ci "${root}"
          sudo install -d -o root -g root -m 0700 "${root}/in"
          (
            cd "${keep}"
            /usr/bin/python3 -m zipfile -c "${RUNNER_TEMP}/ax.zip" \
              ax ko-ax-controller ko-ax-server manifests pins.json
          )
          sudo -- /usr/bin/python3 -I -m zipfile -e \
            "${RUNNER_TEMP}/ax.zip" "${root}/in"
          # The rehearsal: ax-controller holds the digest of ax-server, as
          # an old pin would.
          a=ax-controller
          b=ax-server
          "${manager[@]}" seed-layout --image-set ax \
            --source "${root}/in/ko-${b}" --layout "${root}/rehearsal" \
            --tag "${tag}" "--image=${a}=${pin[${b}]}" | tee "${results}"
          jq --exit-status --arg n "${a}" '. == {($n): "seeded"}' "${results}"
          if "${manager[@]}" seed-layout --image-set ax \
            --source "${root}/in/ko-${a}" --layout "${root}/rehearsal" \
            --tag "${tag}" "--image=${a}=${pin[${a}]}" \
            >/dev/null 2>"${failure}"; then
            echo "seed-layout named ${a}:${tag} with a second digest"
            exit 1
          fi
          cat "${failure}"
          grep -qF "with another digest" "${failure}"
          if "${manager[@]}" forget --image-set ax \
            --layout "${root}/rehearsal" --tag "${tag}" \
            "--image=${a}=${pin[${a}]}" >/dev/null 2>"${failure}"; then
            echo "forget dropped ${a}:${tag} by a digest it does not name"
            exit 1
          fi
          cat "${failure}"
          grep -qF ", not ${pin[${a}]}" "${failure}"
          "${manager[@]}" forget --image-set ax \
            --layout "${root}/rehearsal" --tag "${tag}" \
            "--image=${a}=${pin[${b}]}" | tee "${results}"
          jq --exit-status --arg n "${a}" '. == {($n): "forgotten"}' \
            "${results}"
          "${manager[@]}" seed-layout --image-set ax \
            --source "${root}/in/ko-${a}" --layout "${root}/rehearsal" \
            --tag "${tag}" "--image=${a}=${pin[${a}]}" | tee "${results}"
          jq --exit-status --arg n "${a}" '. == {($n): "seeded"}' "${results}"
          # The window: seed, snapshot, forget, seed again, then the
          # rollback, which forgets and seeds from the snapshot.
          : >"${results}"
          for name in "${names[@]}"; do
            "${manager[@]}" seed-layout --image-set ax \
              --source "${root}/in/ko-${name}" --layout "${root}/images" \
              --tag "${tag}" "--image=${name}=${pin[${name}]}" |
              tee -a "${results}"
          done
          expect seeded
          "${manager[@]}" image-status --image-set ax \
            --layout "${root}/images" --tag "${tag}" "${pins[@]}" \
            | tee "${results}"
          expect_status complete
          if "${manager[@]}" seed-layout --image-set ax \
            --source "${root}/in/ko-${b}" --layout "${root}/images" \
            --tag "${tag}" "--image=${a}=${pin[${b}]}" \
            >/dev/null 2>"${failure}"; then
            echo "seed-layout gave ${a}:${tag} the digest of ${b}"
            exit 1
          fi
          cat "${failure}"
          grep -qF "with another digest" "${failure}"
          sudo cp -a "${root}/images" "${root}/snapshot"
          "${manager[@]}" forget --image-set ax \
            --layout "${root}/images" --tag "${tag}" "${pins[@]}" \
            | tee "${results}"
          expect forgotten
          "${manager[@]}" image-status --image-set ax \
            --layout "${root}/images" --tag "${tag}" "${pins[@]}" \
            | tee "${results}"
          expect_status missing
          : >"${results}"
          for name in "${names[@]}"; do
            "${manager[@]}" seed-layout --image-set ax \
              --source "${root}/in/ko-${name}" --layout "${root}/images" \
              --tag "${tag}" "--image=${name}=${pin[${name}]}" |
              tee -a "${results}"
          done
          expect seeded
          "${manager[@]}" forget --image-set ax \
            --layout "${root}/images" --tag "${tag}" "${pins[@]}" \
            | tee "${results}"
          expect forgotten
          "${manager[@]}" seed-layout --image-set ax \
            --source "${root}/snapshot" --layout "${root}/images" \
            --tag "${tag}" "${pins[@]}" | tee "${results}"
          expect seeded
          "${manager[@]}" image-status --image-set ax \
            --layout "${root}/images" --tag "${tag}" "${pins[@]}" \
            | tee "${results}"
          expect_status complete
          sudo install -d -o root -g root -m 0700 "${root}/binaries"
          sudo -- /usr/bin/install -o root -g root -m 0600 \
            "${root}/in/ax" "${root}/binaries/ax"
          [[ "$(sudo sha256sum "${root}/binaries/ax" | cut -d' ' -f1)" \
            == "$(jq -r .cli_sha256 "${plan}")" ]]

      # Only a push to main or a manual run keeps the files, and only after
      # every step above passed: a pull request proves the same and keeps
      # nothing.
      - name: Keep the ax CLI, the ko image layouts and their manifests
        if: github.event_name != 'pull_request'
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ax-lab-ax-artifacts
          path: ${{ runner.temp }}/keep/ax
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
