---
name: AX lab reproducibility

# Rebuilds every Agent Substrate image that config/ax-lab.yml pins, from the
# pinned Substrate commit, with the same bounded build the ax_lab role runs
# as its explicit fallback (scripts/manage-ax-lab-substrate.py build), then
# restores them into a throwaway registry:3 on the runner's loopback and
# requires each digest to equal its pin. It proves the pins are reproducible
# from source, so the production host never has to compile them.
#
# A second job does the same for what can be proven of AX: from the pinned
# commit with the vendored #375 patch, the ax CLI and the task runner binary
# byte for byte, and the ko images of ax-controller and ax-server up to the
# one annotation that names the base image by tag. The runner and the agents
# images were built with buildx from live apt, pip and npm registries and
# cannot be rebuilt byte for byte: they are only ever seeded (docs/AX.md,
# «Lo que no se puede codificar fielmente»).
#
# It only builds. Nothing is published to any registry outside the runner,
# no credential is used, and the kind end-to-end run belongs to a later
# change (docs/AX.md, «Reproducibilidad»). A pin that is still pending, or
# that differs from what the build produces, fails the job and lists the
# digest the build produced in the run summary.

"on":
  pull_request:
    paths:
      - config/ax-lab.yml
      - images/ax/**
      - scripts/manage-ax-lab-substrate.py
      - scripts/validate-ax-lab.py
      - .github/workflows/ax-lab-reproducibility.yml
  push:
    branches:
      - main
    paths:
      - config/ax-lab.yml
      - images/ax/**
      - scripts/manage-ax-lab-substrate.py
      - scripts/validate-ax-lab.py
      - .github/workflows/ax-lab-reproducibility.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ax-lab-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Rebuild the pinned Substrate images
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out this repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the locked Python runtime
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            ansible/requirements-dev.in
            ansible/requirements-dev.txt

      - name: Bootstrap locked tooling
        run: ./scripts/bootstrap-tooling.sh

      # The validator checks the whole contract first, so the plan only
      # carries reviewed values: a 40-hex commit, digest-pinned images and
      # the build limits the role applies on the host.
      - name: Read the Substrate build plan from the validated contract
        id: plan
        run: |
          set -euo pipefail
          .venv/bin/python scripts/validate-ax-lab.py --substrate-plan \
            >"${RUNNER_TEMP}/plan.json"
          commit="$(jq -r .commit "${RUNNER_TEMP}/plan.json")"
          [[ "${commit}" =~ ^[a-f0-9]{40}$ ]]
          echo "commit=${commit}" >>"${GITHUB_OUTPUT}"

      - name: Check out Agent Substrate at the pinned commit
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: agent-substrate/substrate
          ref: ${{ steps.plan.outputs.commit }}
          path: substrate
          persist-credentials: false

      - name: Require the pristine pinned Substrate checkout
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git -C substrate rev-parse HEAD)" == "${COMMIT}" ]]
          dirty="$(git -C substrate status --porcelain --untracked-files=all)"
          [[ -z "${dirty}" ]]

      - name: Start a throwaway registry on the runner's loopback
        run: |
          set -euo pipefail
          docker run --detach --name ax-lab-ci-registry \
            --publish 127.0.0.1:5000:5000 \
            "$(jq -r .registry_image "${RUNNER_TEMP}/plan.json")"

      # Root-owned, as on the host: the manager refuses a cache or layout
      # that another user could change. /opt is writable by others on
      # GitHub's Ubuntu runners, so the work tree lives under /var/lib.
      # Every image is built in turn, even after one fails, so the summary
      # lists every digest.
      - name: Build every pinned image with the role's bounded build
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/plan.json"
          sudo install -d -o root -g root -m 0755 /var/lib/ax-lab-ci
          sudo install -d -o root -g root -m 0700 /var/lib/ax-lab-ci/cache
          status=0
          for name in $(jq -r '.images | keys[]' "${plan}"); do
            digest="$(
              jq -r --arg name "${name}" '.images[$name] // "pending"' \
                "${plan}"
            )"
            sudo -- /usr/bin/python3 scripts/manage-ax-lab-substrate.py build \
              --image "${name}=${digest}" \
              --toolbox-image "$(jq -r .toolbox_image "${plan}")" \
              --source "${GITHUB_WORKSPACE}/substrate" \
              --cache /var/lib/ax-lab-ci/cache \
              --layout /var/lib/ax-lab-ci/backup \
              --version "$(jq -r .version "${plan}")" \
              --node-container kind-control-plane \
              --memory-mib "$(jq .build.memory_limit_mib "${plan}")" \
              --memory-reservation-mib \
              "$(jq .build.memory_reservation_mib "${plan}")" \
              --cpu-millicores "$(jq .build.cpu_limit_millicores "${plan}")" \
              --pids-limit "$(jq .build.pids_limit "${plan}")" \
              --timeout-seconds "$(jq .build.timeout_seconds "${plan}")" \
              --min-mem-available-mib \
              "$(jq .build.min_mem_available_mib "${plan}")" \
              --mem-available-floor-mib \
              "$(jq .build.mem_available_floor_mib "${plan}")" \
              >>"${RUNNER_TEMP}/builds.jsonl" || status=1
          done
          cat "${RUNNER_TEMP}/builds.jsonl"
          exit "${status}"

      - name: Restore the built images into the throwaway registry
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/plan.json"
          mapfile -t pins < <(
            jq -r '.images | to_entries[] | select(.value != null)
              | "--image=\(.key)=\(.value)"' "${plan}"
          )
          sudo -- /usr/bin/python3 scripts/manage-ax-lab-substrate.py import \
            --registry 127.0.0.1:5000 \
            --layout /var/lib/ax-lab-ci/backup \
            --tag "$(jq -r .version "${plan}")" \
            "${pins[@]}"
          sudo -- /usr/bin/python3 scripts/manage-ax-lab-substrate.py \
            image-status \
            --registry 127.0.0.1:5000 \
            --layout /var/lib/ax-lab-ci/backup \
            --tag "$(jq -r .version "${plan}")" \
            "${pins[@]}" >"${RUNNER_TEMP}/status.json"
          jq --exit-status '
            (.registry | to_entries | all(.value == "pinned"))
            and (.backup | to_entries | all(.value == "complete"))
          ' "${RUNNER_TEMP}/status.json"

      - name: Require every image pinned and every digest reproduced
        if: always()
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/plan.json"
          builds="${RUNNER_TEMP}/builds.jsonl"
          touch "${builds}"
          {
            echo "## Substrate images rebuilt from source"
            echo ""
            echo "| Image | Pinned | Built | Seconds | Peak memory |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r --slurpfile plan "${plan}" '
              [.name, ($plan[0].images[.name] // "pending"),
               (.digest // "none"), (.seconds // "-"),
               (.memory_peak_bytes // "-")]
              | "| " + (map(tostring) | join(" | ")) + " |"
            ' "${builds}"
          } >>"${GITHUB_STEP_SUMMARY}"
          jq --exit-status --slurp --slurpfile plan "${plan}" '
            (map(.name) | sort) == ($plan[0].images | keys | sort)
            and all(.[]; .digest != null
              and $plan[0].images[.name] == .digest)
          ' "${builds}"

  reproduce-ax:
    name: Rebuild what can be proven of the pinned AX images
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out this repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the locked Python runtime
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            ansible/requirements-dev.in
            ansible/requirements-dev.txt

      - name: Bootstrap locked tooling
        run: ./scripts/bootstrap-tooling.sh

      # The validator checks the whole contract first, including the patch
      # and the vendored ko manifests against their pins.
      - name: Read the AX plan from the validated contract
        id: plan
        run: |
          set -euo pipefail
          .venv/bin/python scripts/validate-ax-lab.py --ax-plan \
            >"${RUNNER_TEMP}/ax-plan.json"
          commit="$(jq -r .commit "${RUNNER_TEMP}/ax-plan.json")"
          substrate="$(jq -r .substrate_commit "${RUNNER_TEMP}/ax-plan.json")"
          [[ "${commit}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${substrate}" =~ ^[a-f0-9]{40}$ ]]
          echo "commit=${commit}" >>"${GITHUB_OUTPUT}"
          echo "substrate=${substrate}" >>"${GITHUB_OUTPUT}"

      # With every tag: Go stamps the CLI with a pseudo-version derived from
      # the latest tag behind the commit (v0.3.0), and it is in the binary.
      - name: Check out AX at the pinned commit with its tags
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: google/ax
          ref: ${{ steps.plan.outputs.commit }}
          path: ax
          fetch-depth: 0
          persist-credentials: false

      # Only for ko v0.19.1, which Substrate pins in hack/tools/ko/go.mod.
      - name: Check out Agent Substrate at the pinned commit
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: agent-substrate/substrate
          ref: ${{ steps.plan.outputs.substrate }}
          path: substrate
          persist-credentials: false

      - name: Require the pristine pinned checkouts
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
          SUBSTRATE: ${{ steps.plan.outputs.substrate }}
        run: |
          set -euo pipefail
          [[ "$(git -C ax rev-parse HEAD)" == "${COMMIT}" ]]
          [[ -z "$(git -C ax status --porcelain --untracked-files=all)" ]]
          [[ "$(git -C ax describe --tags --abbrev=0)" == v0.3.0 ]]
          [[ "$(git -C substrate rev-parse HEAD)" == "${SUBSTRATE}" ]]
          dirty="$(git -C substrate status --porcelain --untracked-files=all)"
          [[ -z "${dirty}" ]]

      # Every Go step runs in the pinned golang image, as the manual lab did,
      # with the module cache and the build cache on the runner.
      - name: Record the unpatched test baseline
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ax-out" "${RUNNER_TEMP}/go"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/ax:/src/ax" \
            --volume "${RUNNER_TEMP}/ax-out:/out" \
            --volume "${RUNNER_TEMP}/go:/go-cache" \
            --env GOTOOLCHAIN=local --env GOFLAGS=-mod=readonly \
            --env GOCACHE=/go-cache/build --env GOMODCACHE=/go-cache/mod \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/src/ax \
            --workdir /src/ax \
            "$(jq -r .toolbox_image "${RUNNER_TEMP}/ax-plan.json")" \
            bash -c 'go test ./... >/out/test-baseline.log 2>&1 || true'
          awk '$1 == "FAIL" && NF >= 2 { print $2 }' \
            "${RUNNER_TEMP}/ax-out/test-baseline.log" | sort -u \
            >"${RUNNER_TEMP}/failures-baseline.txt"

      # Staged, not committed: the manual lab's binaries carry
      # vcs.modified=true and a +dirty version, so the tree must be too.
      - name: Apply the vendored patch exactly as the manual lab staged it
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/ax-plan.json"
          patch="$(jq -r .patch.path "${plan}")"
          sha="$(jq -r .patch.sha256 "${plan}")"
          echo "${sha}  ${patch}" | sha256sum --check --strict
          git -C ax apply --index "${GITHUB_WORKSPACE}/${patch}"
          staged="$(git -C ax diff --cached | sha256sum | cut -d' ' -f1)"
          [[ "${staged}" == "${sha}" ]]

      # Makefile, lines 36 and 49, at the pinned commit.
      - name: Rebuild the ax CLI and the task runner binary
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/ax:/src/ax" \
            --volume "${RUNNER_TEMP}/ax-out:/out" \
            --volume "${RUNNER_TEMP}/go:/go-cache" \
            --env GOTOOLCHAIN=local --env GOFLAGS=-mod=readonly \
            --env GOCACHE=/go-cache/build --env GOMODCACHE=/go-cache/mod \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/src/ax \
            --workdir /src/ax \
            "$(jq -r .toolbox_image "${RUNNER_TEMP}/ax-plan.json")" \
            bash -c '
              set -euo pipefail
              go build -trimpath -ldflags="-s -w" -o /out/ax ./cmd/ax
              GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
                -ldflags="-s -w" -o /out/ax-task-runner ./cmd/ax-task-runner
              go version -m /out/ax | head -3
            '

      # ko's default namer and platform, as `ko resolve` ran in the manual
      # lab; the base is the digest cgr.dev/chainguard/static:latest had.
      - name: Rebuild the ko images of ax-controller and ax-server
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/ax:/src/ax" \
            --volume "${GITHUB_WORKSPACE}/substrate:/src/substrate:ro" \
            --volume "${RUNNER_TEMP}/ax-out:/out" \
            --volume "${RUNNER_TEMP}/go:/go-cache" \
            --env GOTOOLCHAIN=local --env GOFLAGS=-mod=readonly \
            --env GOCACHE=/go-cache/build --env GOMODCACHE=/go-cache/mod \
            --env HOME=/go-cache/home \
            --env GIT_CONFIG_COUNT=2 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/src/ax \
            --env GIT_CONFIG_KEY_1=safe.directory \
            --env GIT_CONFIG_VALUE_1=/src/substrate \
            --env KO_DOCKER_REPO=localhost:5001 \
            --env KO_DEFAULTBASEIMAGE="$(
              jq -r .ko_base_image "${RUNNER_TEMP}/ax-plan.json"
            )" \
            --workdir /src/ax \
            "$(jq -r .toolbox_image "${RUNNER_TEMP}/ax-plan.json")" \
            bash -c '
              set -euo pipefail
              ko="$(cd /src/substrate/hack/tools/ko && go tool -n ko)"
              for name in ax-controller ax-server; do
                "${ko}" build --push=false --sbom=none \
                  --oci-layout-path="/out/ko-${name}" "./cmd/${name}"
              done
            '

      - name: Require the rebuilt binaries and ko images to match their pins
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/ax-plan.json"
          out="${RUNNER_TEMP}/ax-out"
          sudo chmod -R a+rX "${out}"
          [[ "$(sha256sum "${out}/ax" | cut -d' ' -f1)" \
            == "$(jq -r .cli_sha256 "${plan}")" ]]
          [[ "$(sha256sum "${out}/ax-task-runner" | cut -d' ' -f1)" \
            == "$(jq -r .task_runner_binary_sha256 "${plan}")" ]]
          python3 - "${plan}" "${out}" <<'PY'
          import json
          import pathlib
          import sys

          plan = json.loads(pathlib.Path(sys.argv[1]).read_text())
          out = pathlib.Path(sys.argv[2])
          BASE_NAME = "org.opencontainers.image.base.name"
          for name, vendored in plan["ko_manifests"].items():
              layout = out / f"ko-{name}"
              index = json.loads((layout / "index.json").read_text())
              (entry,) = index["manifests"]
              digest = entry["digest"].removeprefix("sha256:")
              built = json.loads((layout / "blobs/sha256" / digest).read_text())
              pinned = json.loads(pathlib.Path(vendored).read_text())
              for document in (built, pinned):
                  document.get("annotations", {}).pop(BASE_NAME, None)
              pin = plan["ko_images"][name]
              print(name, "rebuilt as", entry["digest"], "pinned", pin)
              if built != pinned:
                  sys.exit(f"{name}: the rebuild differs beyond {BASE_NAME}")
          PY

      # google/ax#375 comes with tests of its own; none may fail that did
      # not already fail at the pinned commit without it.
      - name: Require no new test failure with the patch
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/ax:/src/ax" \
            --volume "${RUNNER_TEMP}/ax-out:/out" \
            --volume "${RUNNER_TEMP}/go:/go-cache" \
            --env GOTOOLCHAIN=local --env GOFLAGS=-mod=readonly \
            --env GOCACHE=/go-cache/build --env GOMODCACHE=/go-cache/mod \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/src/ax \
            --workdir /src/ax \
            "$(jq -r .toolbox_image "${RUNNER_TEMP}/ax-plan.json")" \
            bash -c 'go test ./... >/out/test-patched.log 2>&1 || true'
          sudo chmod -R a+rX "${RUNNER_TEMP}/ax-out"
          awk '$1 == "FAIL" && NF >= 2 { print $2 }' \
            "${RUNNER_TEMP}/ax-out/test-patched.log" | sort -u \
            >"${RUNNER_TEMP}/failures-patched.txt"
          new="$(comm -13 "${RUNNER_TEMP}/failures-baseline.txt" \
            "${RUNNER_TEMP}/failures-patched.txt")"
          {
            echo "## AX rebuilt from the pinned commit and the #375 patch"
            echo ""
            echo "Failing packages before the patch:"
            sed 's/^/- /' "${RUNNER_TEMP}/failures-baseline.txt"
            echo ""
            echo "New failures with the patch: ${new:-none}"
          } >>"${GITHUB_STEP_SUMMARY}"
          [[ -z "${new}" ]]
