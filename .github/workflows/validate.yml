---
name: Validate infrastructure

"on":
  schedule:
    - cron: "17 5 * * *"
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform, Ansible, Traefik and security
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the locked Python runtime
        # v6
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            ansible/requirements-dev.in
            ansible/requirements-dev.txt

      - name: Bootstrap locked tooling
        run: ./scripts/bootstrap-tooling.sh

      - name: Validate infrastructure as code
        run: ./scripts/validate-iac.sh

      - name: Lint and scan the repository and Git history
        run: ./scripts/lint.sh
