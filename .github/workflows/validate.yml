---
name: Validate infrastructure

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform, Ansible, Traefik and security
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the locked Python runtime
        # v6
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            ansible/requirements-dev.in
            ansible/requirements-dev.txt

      - name: Bootstrap locked tooling
        run: ./scripts/bootstrap-tooling.sh

      - name: Validate infrastructure as code
        run: ./scripts/validate-iac.sh

      - name: Lint and scan the repository and Git history
        run: ./scripts/lint.sh
