---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /ansible
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/cloudflare/state-bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/cloudflare/apptolast-dns
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/netcup/perimeter
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /images/n8n-runners
    schedule:
      interval: weekly
    # ioredis 6 changes the default protocol to RESP3, and the n8n runner
    # allows ioredis in Code nodes (stacks/workloads/config/n8n-task-runners.json).
    # A major bump is a manual change tested against those flows.
    ignore:
      - dependency-name: ioredis
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /images/n8n-runners
    schedule:
      interval: weekly
    # n8n requires the runners image on the exact n8n version, and n8n is a
    # reviewed version hold: both move together in one reviewed change.
    # scripts/validate-workloads.py rejects a runners base off the rendered
    # n8n hold (config/image-channels.yml) or off its reviewed digest.
    ignore:
      - dependency-name: n8nio/runners
