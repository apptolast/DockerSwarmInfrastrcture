---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /ansible
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/cloudflare/state-bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/cloudflare/apptolast-dns
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/netcup/perimeter
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /images/n8n-runners
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /images/n8n-runners
    schedule:
      interval: weekly
    # n8n requires the runners image on the exact n8n version, and n8n is a
    # reviewed version hold: both move together in one reviewed change.
    # scripts/validate-workloads.py rejects any other pairing.
    ignore:
      - dependency-name: n8nio/runners
