---
name: apptolast-restore

x-database-defaults: &database-defaults
  init: true
  restart: "no"
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "5"
  security_opt:
    - no-new-privileges:true

x-health-defaults: &health-defaults
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  n8n-db:
    <<: *database-defaults
    image: "docker.io/pgvector/pgvector@sha256:\
      7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff"
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/n8n_db_password
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: >-
        --auth-local=trust --auth-host=scram-sha-256 --locale=C
    secrets:
      - n8n_db_password
    volumes:
      - type: bind
        source: ${SERVICES_ROOT:-/srv/dockerswarm/services}/n8n/postgres
        target: /var/lib/postgresql/data
    networks:
      - n8n-restore
    shm_size: 256m
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]

  n8n-maintenance:
    profiles:
      - maintenance
    init: false
    restart: "no"
    image: "docker.io/n8nio/n8n:2.31.5@sha256:\
      cda6bafc7bb4873533e7affb82d1bd47282a7614bdf83242c2293f8ff281261a"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_MIGRATE_FS_STORAGE_PATH: "true"
      N8N_PERSONALIZATION_ENABLED: "false"
    secrets:
      - n8n_db_password
      - n8n_encryption_key
    volumes:
      - type: bind
        source: ${SERVICES_ROOT:-/srv/dockerswarm/services}/n8n/home
        target: /home/node/.n8n
    networks:
      - n8n-restore
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 384

  passbolt-db:
    <<: *database-defaults
    image: "docker.io/library/postgres@sha256:\
      fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c"
    environment:
      POSTGRES_DB: passbolt
      POSTGRES_USER: passbolt
      POSTGRES_PASSWORD_FILE: /run/secrets/passbolt_db_password
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: >-
        --auth-local=trust --auth-host=scram-sha-256 --locale=C
    secrets:
      - passbolt_db_password
    volumes:
      - type: bind
        source: ${SERVICES_ROOT:-/srv/dockerswarm/services}/passbolt/postgres
        target: /var/lib/postgresql/data
    networks:
      - passbolt-restore
    shm_size: 128m
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 192
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "pg_isready -U passbolt -d passbolt"]

  shlink-db:
    <<: *database-defaults
    image: "docker.io/library/postgres@sha256:\
      66266770619a23ab310c7fa60043b6d1fa041038cb232ced59d2c509fecd297b"
    environment:
      POSTGRES_DB: shlink
      POSTGRES_USER: shlink
      POSTGRES_PASSWORD_FILE: /run/secrets/shlink_db_password
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: >-
        --auth-local=trust --auth-host=scram-sha-256 --locale=C
    secrets:
      - shlink_db_password
    volumes:
      - type: bind
        source: ${SERVICES_ROOT:-/srv/dockerswarm/services}/shlink/postgres
        target: /var/lib/postgresql/data
    networks:
      - shlink-restore
    shm_size: 128m
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 192
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "pg_isready -U shlink -d shlink"]

networks:
  n8n-restore:
    internal: true
  passbolt-restore:
    internal: true
  shlink-restore:
    internal: true

secrets:
  n8n_db_password:
    file: "${SERVICES_ROOT:-/srv/dockerswarm/services}/secrets/files/\
      n8n_db_password"
  n8n_encryption_key:
    file: "${SERVICES_ROOT:-/srv/dockerswarm/services}/secrets/files/\
      n8n_encryption_key"
  passbolt_db_password:
    file: "${SERVICES_ROOT:-/srv/dockerswarm/services}/secrets/files/\
      passbolt_db_password"
  shlink_db_password:
    file: "${SERVICES_ROOT:-/srv/dockerswarm/services}/secrets/files/\
      shlink_db_password"
