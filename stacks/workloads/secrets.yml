---
workloads_secret_catalog_version: 1
workloads_secret_version: v1

# This file contains names and consumers only. Secret values are never stored in
# Git or rendered into the Swarm service specification. Rotation is explicit:
# create a new immutable Docker Secret and increment both the external name and
# workloads_secret_version.
workloads_secrets:
  - key: n8n_db_password
    external_name: apptolast-wl-n8n-db-password-v1
    source_file: n8n_db_password
    required_nonempty: true
    consumers:
      - n8n-db
      - n8n

