---
observability_secret_catalog_version: 1
observability_secret_version: v1

# Values are generated on the server by install-observability-secrets.py and
# backed up outside Git. Secret names are immutable; rotation increments the
# shared version and every external_name.
observability_secrets:
  - key: grafana_admin_password
    external_name: apptolast-obs-grafana-admin-password-v1
    source_file: grafana_admin_password
    generated_bytes: 32
    consumers:
      - grafana

  - key: grafana_secret_key
    external_name: apptolast-obs-grafana-secret-key-v1
    source_file: grafana_secret_key
    generated_bytes: 48
    consumers:
      - grafana

  - key: postgres_exporter_n8n_password
    external_name: apptolast-obs-postgres-n8n-password-v1
    source_file: postgres_exporter_n8n_password
    generated_bytes: 32
    consumers:
      - postgres-exporter-n8n

  - key: postgres_exporter_passbolt_password
    external_name: apptolast-obs-postgres-passbolt-password-v1
    source_file: postgres_exporter_passbolt_password
    generated_bytes: 32
    consumers:
      - postgres-exporter-passbolt

  - key: postgres_exporter_shlink_password
    external_name: apptolast-obs-postgres-shlink-password-v1
    source_file: postgres_exporter_shlink_password
    generated_bytes: 32
    consumers:
      - postgres-exporter-shlink
