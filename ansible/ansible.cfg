[defaults]
inventory = inventory/production/hosts.yml
roles_path = roles
collections_path = ../.ansible/collections
interpreter_python = auto_silent
inject_facts_as_vars = False
retry_files_enabled = False
host_key_checking = True
nocows = True

[privilege_escalation]
become = True
become_method = sudo
# Ubuntu 26.04 ships sudo-rs as /usr/bin/sudo. sudo-rs rewrites the -p prompt
# into "[sudo: <prompt>] Password:", so Ansible's exact prompt match never
# fires and become times out. Classic sudo (Ubuntu package "sudo", alternatives
# priority 40) keeps the byte-exact -p contract. See docs/KNOWN_ISSUES.md.
become_exe = /usr/bin/sudo.ws
become_ask_pass = False

[ssh_connection]
pipelining = False
ssh_args = -o ControlMaster=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3
