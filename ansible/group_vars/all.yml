---

deployment_metadata_repository_slug: apptolast/DockerSwarmInfrastrcture

platform_docker_packages:
  - docker-ce=5:29.6.2-1~ubuntu.26.04~resolute
  - docker-ce-cli=5:29.6.2-1~ubuntu.26.04~resolute
  - containerd.io=2.2.6-1~ubuntu.26.04~resolute
  - docker-buildx-plugin=0.35.0-1~ubuntu.26.04~resolute
  - docker-compose-plugin=5.3.1-1~ubuntu.26.04~resolute

edge_install_root: "{{ platform_install_root }}"
edge_state_root: "{{ platform_state_root }}"
edge_monitoring_network: "{{ platform_edge_monitoring_network }}"
edge_networks: "{{ platform_edge_networks }}"
edge_application_networks:
  organizationweb: apptolast-edge-organizationweb
  racinggame: apptolast-edge-racinggame
  # The monitoring dashboard runs outside this repository; only its
  # ingress is codified here, on the network it already uses.
  observatorio: apptolast-edge-observatorio
  # Satisfactory (web, reverb, logs and companions) also runs outside
  # this repository, as plain Compose containers plus one Swarm stack.
  satisfactory: apptolast-edge-satisfactory
  # The AX web panel runs in the kind lab, outside Swarm. Traefik reaches
  # it through its TCP forwarder `ax-web-edge`, a plain container that
  # joins this network (docs/EDGE.md, «Ruta de AX»).
  ax: apptolast-edge-ax

# Edge networks allowed to be attachable, and only those. The
# monitoring dashboard is a plain container, not a Swarm service, and
# a non-Swarm container cannot join a non-attachable overlay, so its
# network has to stay attachable for its own ingress to work. Every
# other term of the edge contract still applies to it, encryption
# included; joining an attachable overlay needs the Docker socket,
# which is already root-equivalent on this host.
edge_adopted_attachable_networks:
  - apptolast-edge-observatorio
  - apptolast-edge-satisfactory
  - apptolast-edge-ax

# Fixed subnets, only for an adopted network whose other member filters its
# peers by address: the AX panel's forwarder admits only this subnet
# (--allow-cidr), so the role creates the network with it and rejects any
# other (docs/EDGE.md, «Ruta de AX»). Swarm allocates every other one.
edge_network_subnets:
  apptolast-edge-ax: 10.0.250.0/24

edge_traefik_image: >-
  traefik@sha256:652929a140a32d7cafafb13c6cdfab5376cfeff800f51397b87b524501ed02a8
edge_traefik_version: 3.7.9
edge_traefik_runtime_uid: 65532
edge_traefik_runtime_gid: 65532
edge_traefik_stack_name: edge
edge_traefik_acme_email: acme@apptolast.com
edge_traefik_cloudflare_secret_name: cloudflare_dns_api_token_v3
# Traefik basicAuth users files, one `user:bcrypt` line each, mounted at
# /run/secrets/<key>. The value is the versioned Docker Secret name. The
# secret is created by hand on the host (docs/EDGE.md, «Rutas de
# Satisfactory» and «Ruta de AX») and no hash ever enters this repository.
edge_traefik_basicauth_secrets:
  basicauth_satisfactory_logs: edge-basicauth-satisfactory-logs-v1
  basicauth_ax: edge-basicauth-ax-v1
# mTLS material of Traefik towards an upstream, mounted at
# /run/secrets/<key>: the private CA that signs the upstream's server
# certificate, and one PEM with Traefik's client certificate and its key.
# Created by hand on the host with the upstream's bootstrap; no key or
# certificate ever enters this repository.
edge_traefik_upstream_mtls_secrets:
  ax_upstream_ca: edge-ax-upstream-ca-v1
  ax_upstream_client: edge-ax-upstream-client-v1
edge_traefik_acme_ca_server: https://acme-v02.api.letsencrypt.org/directory
edge_traefik_acme_storage_filename: acme.json
