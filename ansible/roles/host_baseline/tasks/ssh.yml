---
- name: Render and inspect the OpenSSH candidate in memory
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
      - -f
      - /dev/stdin
    stdin: >-
      {{
        lookup(
          "ansible.builtin.template",
          playbook_dir + "/../templates/ssh-hardening.conf.j2"
        )
      }}
    stdin_add_newline: true
  register: host_baseline_ssh_candidate
  changed_when: false
  check_mode: false

- name: Verify the candidate KEX list is exact and hybrid-first
  ansible.builtin.assert:
    that:
      - >-
        (
          host_baseline_ssh_candidate.stdout_lines
          | select("match", "^kexalgorithms ")
          | first
        ).split(" ", 1)[1].split(",")
        ==
        (host_baseline_ssh_pq_kex_algorithms
        + host_baseline_ssh_classical_kex_algorithms)
      - >-
        (
          host_baseline_ssh_candidate.stdout_lines
          | select("match", "^ciphers ")
          | first
        ).split(" ", 1)[1].split(",") == host_baseline_ssh_ciphers
      - >-
        (
          host_baseline_ssh_candidate.stdout_lines
          | select("match", "^macs ")
          | first
        ).split(" ", 1)[1].split(",") == host_baseline_ssh_macs
      - >-
        (
          host_baseline_ssh_candidate.stdout_lines
          | select("match", "^hostkeyalgorithms ")
          | first
        ).split(" ", 1)[1].split(",")
        == host_baseline_ssh_host_key_algorithms
      - >-
        (
          host_baseline_ssh_candidate.stdout_lines
          | select("match", "^pubkeyacceptedalgorithms ")
          | first
        ).split(" ", 1)[1].split(",")
        == host_baseline_ssh_pubkey_algorithms
    fail_msg: >-
      The rendered OpenSSH candidate did not preserve the reviewed classical
      fallbacks after placing hybrid post-quantum KEX algorithms first.
    quiet: true

- name: Render the complete public-key-only OpenSSH policy
  ansible.builtin.copy:
    content: >-
      {{
        lookup(
          "ansible.builtin.template",
          playbook_dir + "/../templates/ssh-hardening.conf.j2"
        )
      }}
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  register: host_baseline_ssh_config
  notify: Host baseline validate and reload OpenSSH

- name: Validate the complete OpenSSH configuration with the drop-in
  block:
    - name: Parse all OpenSSH configuration files
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false
      check_mode: false
  rescue:
    - name: Restore the previous complete OpenSSH policy
      ansible.builtin.copy:
        src: "{{ host_baseline_ssh_config.backup_file }}"
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0600"
        remote_src: true
      when:
        - host_baseline_ssh_config.changed
        - host_baseline_ssh_config.backup_file is defined

    - name: Verify the restored OpenSSH configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false
      check_mode: false

    - name: Stop after rolling back an invalid OpenSSH candidate
      ansible.builtin.fail:
        msg: >-
          The complete OpenSSH configuration rejected the managed drop-in.
          Its prior state was restored and ssh.service was not reloaded.

- name: Apply the validated OpenSSH reload before reconnecting
  ansible.builtin.meta: flush_handlers

- name: Read the enforced OpenSSH configuration
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
  register: host_baseline_effective_sshd
  changed_when: false
  check_mode: false

- name: Verify public-key-only OpenSSH invariants
  ansible.builtin.assert:
    that:
      - '"permitrootlogin no" in host_baseline_effective_sshd.stdout_lines'
      - >-
        "pubkeyauthentication yes"
        in host_baseline_effective_sshd.stdout_lines
      - >-
        "passwordauthentication no"
        in host_baseline_effective_sshd.stdout_lines
      - >-
        "kbdinteractiveauthentication no"
        in host_baseline_effective_sshd.stdout_lines
      - >-
        "authenticationmethods publickey"
        in host_baseline_effective_sshd.stdout_lines
      - >-
        "allowusers " ~ host_baseline_admin_user
        in host_baseline_effective_sshd.stdout_lines
      - '"allowtcpforwarding no" in host_baseline_effective_sshd.stdout_lines'
      - >-
        "allowstreamlocalforwarding no"
        in host_baseline_effective_sshd.stdout_lines
      - '"allowagentforwarding no" in host_baseline_effective_sshd.stdout_lines'
      - '"x11forwarding no" in host_baseline_effective_sshd.stdout_lines'
      - >-
        (
          host_baseline_effective_sshd.stdout_lines
          | select("match", "^kexalgorithms ")
          | first
        ).split(" ", 1)[1].split(",")
        ==
        (host_baseline_ssh_pq_kex_algorithms
        + host_baseline_ssh_classical_kex_algorithms)
      - >-
        (
          host_baseline_effective_sshd.stdout_lines
          | select("match", "^ciphers ")
          | first
        ).split(" ", 1)[1].split(",") == host_baseline_ssh_ciphers
      - >-
        (
          host_baseline_effective_sshd.stdout_lines
          | select("match", "^macs ")
          | first
        ).split(" ", 1)[1].split(",") == host_baseline_ssh_macs
      - >-
        (
          host_baseline_effective_sshd.stdout_lines
          | select("match", "^hostkeyalgorithms ")
          | first
        ).split(" ", 1)[1].split(",")
        == host_baseline_ssh_host_key_algorithms
      - >-
        (
          host_baseline_effective_sshd.stdout_lines
          | select("match", "^pubkeyacceptedalgorithms ")
          | first
        ).split(" ", 1)[1].split(",")
        == host_baseline_ssh_pubkey_algorithms
      - '"disableforwarding yes" in host_baseline_effective_sshd.stdout_lines'
      - '"usedns no" in host_baseline_effective_sshd.stdout_lines'
      - '"compression no" in host_baseline_effective_sshd.stdout_lines'
      - '"tcpkeepalive no" in host_baseline_effective_sshd.stdout_lines'
      - '"permituserrc no" in host_baseline_effective_sshd.stdout_lines'
    fail_msg: "The effective OpenSSH configuration is not public-key-only."
    quiet: true
  when: not ansible_check_mode

- name: Prove remote public-key authentication after reload
  ansible.builtin.include_tasks: reconnect.yml
  when:
    - not ansible_check_mode
    - ansible_connection in ["ssh", "paramiko"]

- name: Verify local SSH is still listening
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ host_baseline_ssh_port }}"
    state: started
    timeout: 10
  when:
    - not ansible_check_mode
    - ansible_connection not in ["ssh", "paramiko"]
  check_mode: false
