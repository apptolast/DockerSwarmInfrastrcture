---
- name: Verify the promoted-snapshot update policy
  ansible.builtin.assert:
    that:
      - host_security_apt_update_policy == "promoted-snapshot-only"
      - host_security_snapshot_max_age_days | int == 14
      - host_security_ubuntu_snapshot is match("^[0-9]{8}T[0-9]{6}Z$")
      - '"unattended-upgrades" not in host_security_required_packages'
    fail_msg: >-
      Host updates must come only from the reviewed, age-bounded Ubuntu
      snapshot declared in Git.
    quiet: true

- name: Disable periodic APT mutation
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible. Packages move only with the promoted snapshot.
      APT::Periodic::Enable "0";
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";

- name: Create the immutable host-baseline backup directory
  ansible.builtin.file:
    path: /var/backups/dockerswarm
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Inspect superseded unattended-upgrade overrides
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ host_baseline_unattended_legacy_files }}"
  register: host_baseline_unattended_legacy_state

- name: Preserve each original unattended-upgrade override once
  ansible.builtin.copy:
    src: "{{ item.item }}"
    dest: >-
      /var/backups/dockerswarm/{{ item.item | basename }}.pre-ansible
    owner: root
    group: root
    mode: "0600"
    force: false
    remote_src: true
  loop: "{{ host_baseline_unattended_legacy_state.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - item.stat.exists

- name: Inspect preserved unattended-upgrade overrides
  ansible.builtin.stat:
    path: >-
      /var/backups/dockerswarm/{{ item.item | basename }}.pre-ansible
  loop: "{{ host_baseline_unattended_legacy_state.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: host_baseline_unattended_backup_state
  when:
    - not ansible_check_mode
    - item.stat.exists

- name: Verify every required legacy backup is private
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.pw_name == "root"
      - item.stat.gr_name == "root"
      - item.stat.mode == "0600"
    fail_msg: >-
      A legacy unattended-upgrade override was not safely preserved, so its
      source configuration will not be removed.
    quiet: true
  loop: "{{ host_baseline_unattended_backup_state.results }}"
  loop_control:
    label: "{{ item.item.item }}"
  when:
    - not ansible_check_mode
    - not item.skipped | default(false)

- name: Remove superseded unattended-upgrade overrides
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ host_baseline_unattended_legacy_files }}"

- name: Remove the obsolete automatic-upgrade policy
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/99-dockerswarm-unattended-upgrades
    state: absent

- name: Mask automatic APT timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Read the effective promoted-snapshot APT configuration
  ansible.builtin.command:
    argv:
      - /usr/bin/apt-config
      - dump
  register: host_baseline_apt_config
  changed_when: false
  check_mode: false

- name: Verify APT cannot mutate outside a reviewed apply
  ansible.builtin.assert:
    that:
      - >-
        ('APT::Snapshot "' ~ host_security_ubuntu_snapshot ~ '";')
        in host_baseline_apt_config.stdout_lines
      - >-
        'APT::Periodic::Enable "0";'
        in host_baseline_apt_config.stdout_lines
      - >-
        'APT::Periodic::Update-Package-Lists "0";'
        in host_baseline_apt_config.stdout_lines
      - >-
        'APT::Periodic::Unattended-Upgrade "0";'
        in host_baseline_apt_config.stdout_lines
    fail_msg: >-
      Effective APT settings do not enforce the promoted snapshot or still
      permit unattended package mutation.
    quiet: true
  when: not ansible_check_mode
