---
- name: Validate the complete OpenSSH configuration
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
  changed_when: false
  check_mode: false
  listen: Host baseline validate and reload OpenSSH

- name: Reload OpenSSH after complete validation
  ansible.builtin.systemd_service:
    name: ssh.service
    state: reloaded
  listen: Host baseline validate and reload OpenSSH

- name: Restart systemd-journald
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted
  listen: Host baseline restart systemd-journald

- name: Apply persistent sysctl settings
  ansible.builtin.command:
    argv:
      - /usr/sbin/sysctl
      - --system
  changed_when: true
  listen: Host baseline apply sysctl

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Host baseline reload systemd

- name: Restart CrowdSec firewall bouncer
  ansible.builtin.systemd_service:
    name: crowdsec-firewall-bouncer.service
    state: restarted
  listen: Host baseline restart CrowdSec firewall bouncer

# systemd da por arrancado el bouncer antes de que este haya creado sus
# ipsets, y el script de ordenacion de DOCKER-USER inserta reglas que
# referencian CROWDSEC_CHAIN, la cual usa `-m set --match-set`. Si corre en
# esa ventana, iptables falla con "Can't open socket to ipset" y
# dockerswarm-docker-firewall.service no arranca. Los handlers se ejecutan en
# el orden en que se declaran, de modo que esta espera se intercala entre el
# reinicio del bouncer y la reordenacion.
- name: Wait for the CrowdSec ipsets to exist
  ansible.builtin.command:
    argv:
      - /usr/sbin/ipset
      - list
      - -n
  register: host_baseline_crowdsec_ipsets
  changed_when: false
  retries: 24
  delay: 5
  until: "'crowdsec-blacklists' in host_baseline_crowdsec_ipsets.stdout"
  listen: Host baseline restart CrowdSec firewall bouncer

- name: Restart Docker ingress ordering
  ansible.builtin.systemd_service:
    name: "{{ host_baseline_docker_firewall_service }}"
    enabled: true
    state: restarted
  listen: Host baseline restart Docker ingress ordering
