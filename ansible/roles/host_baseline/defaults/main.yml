---
host_baseline_admin_user: "{{ host_security_admin_user }}"
host_baseline_admin_home: "{{ host_security_admin_home }}"
host_baseline_admin_uid: "{{ host_security_admin_uid }}"
host_baseline_admin_gid: "{{ host_security_admin_gid }}"
host_baseline_ssh_group: "{{ host_security_ssh_group }}"
host_baseline_ssh_port: "{{ host_security_ssh_port }}"
host_baseline_authorized_keys_path: >-
  {{ host_security_authorized_keys_path }}
host_baseline_authorized_keys_validator: >-
  {{ host_security_authorized_keys_validator }}
host_baseline_ssh_pq_kex_algorithms: >-
  {{ host_security_ssh_pq_kex_algorithms }}
host_baseline_ssh_classical_kex_algorithms: >-
  {{ host_security_ssh_classical_kex_algorithms }}
host_baseline_ssh_ciphers: "{{ host_security_ssh_ciphers }}"
host_baseline_ssh_macs: "{{ host_security_ssh_macs }}"
host_baseline_ssh_host_key_algorithms: >-
  {{ host_security_ssh_host_key_algorithms }}
host_baseline_ssh_pubkey_algorithms: >-
  {{ host_security_ssh_pubkey_algorithms }}

host_baseline_public_interface: >-
  {{ platform_public_interface | default('eth0') }}
host_baseline_public_ipv4: "{{ platform_public_ipv4 | default('') }}"
host_baseline_required_public_tcp_ports: >-
  {{
    platform_public_tcp_ports
    if platform_minecraft_public_enabled | bool
    else platform_public_tcp_ports | difference([25565])
  }}
host_baseline_required_public_ipv6_tcp_ports: []
host_baseline_required_host_egress: >-
  {{ host_security_required_host_egress }}

host_baseline_unattended_legacy_files:
  - /etc/apt/apt.conf.d/51myunattended-upgrades
  - /etc/apt/apt.conf.d/52apptolast-unattended-upgrades
host_baseline_unattended_remove_unused: true

host_baseline_journal_max_use: 1G
host_baseline_journal_keep_free: 5G
host_baseline_journal_max_retention: 14day
host_baseline_journal_rate_limit_interval: 30s
host_baseline_journal_rate_limit_burst: 10000

host_baseline_sysctl:
  fs.protected_hardlinks: "1"
  fs.protected_symlinks: "1"
  fs.protected_fifos: "2"
  fs.protected_regular: "2"
  fs.suid_dumpable: "0"
  kernel.dmesg_restrict: "1"
  kernel.kptr_restrict: "2"
  kernel.randomize_va_space: "2"
  kernel.yama.ptrace_scope: "1"
  net.ipv4.ip_forward: "1"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.default.accept_redirects: "0"
  net.ipv4.conf.all.secure_redirects: "0"
  net.ipv4.conf.default.secure_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
  net.ipv4.conf.default.send_redirects: "0"
  net.ipv4.conf.all.accept_source_route: "0"
  net.ipv4.conf.default.accept_source_route: "0"
  net.ipv4.conf.all.rp_filter: "2"
  net.ipv4.conf.default.rp_filter: "2"
  net.ipv4.tcp_syncookies: "1"
  net.ipv6.conf.all.accept_redirects: "0"
  net.ipv6.conf.default.accept_redirects: "0"
  net.ipv6.conf.all.accept_source_route: "0"
  net.ipv6.conf.default.accept_source_route: "0"

host_baseline_required_packages: >-
  {{ host_security_required_packages }}
host_baseline_required_active_services: >-
  {{ host_security_required_active_services }}

host_baseline_crowdsec_bouncer_config: >-
  /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
host_baseline_docker_firewall_service: >-
  dockerswarm-docker-firewall.service
host_baseline_docker_firewall_override_directory: >-
  /etc/systemd/system/dockerswarm-docker-firewall.service.d
host_baseline_docker_firewall_script: >-
  /usr/local/sbin/dockerswarm-docker-firewall
host_baseline_crowdsec_order_script: >-
  /usr/local/sbin/dockerswarm-crowdsec-order

host_baseline_run_expensive_validations: true
