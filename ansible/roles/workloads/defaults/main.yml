---
workloads_stack_name: workloads
workloads_install_root: "{{ platform_install_root }}/workloads"
workloads_state_root: "{{ platform_state_root }}/services"
workloads_edge_networks: "{{ platform_edge_networks }}"
workloads_render_only: false
workloads_render_root: "{{ playbook_dir }}/../../.build/workloads"
workloads_secret_source_dir: "{{ workloads_state_root }}/secrets/files"
workloads_secret_identity_key_path: >-
  {{ workloads_secret_source_dir }}/workloads_secret_identity_hmac_key
workloads_restore_marker_path: >-
  {{ workloads_state_root }}/restore-state/workloads-ready-v2.json
workloads_runtime_manifest_path: >-
  {{ workloads_state_root }}/runtime-manifest.json
workloads_recovery_manifest_path: >-
  {{ workloads_state_root }}/recovery/SHA256SUMS
workloads_catalog_source_path: >-
  {{ playbook_dir }}/../../config/services.yml
workloads_runner_context_source: >-
  {{ playbook_dir }}/../../images/n8n-runners
workloads_runner_context_files:
  - .dockerignore
  - Dockerfile
  - package.json
  - package-lock.json

workloads_runtime_service_ids:
  - atlas
  - kropia
  - minecraft
  - minecraft-stats
  - n8n
  - passbolt
  - personal-website-alberto
  - personal-website-pablo
  - shlink

workloads_expected_stack_services:
  - atlas
  - kropia
  - minecraft
  - minecraft-stats
  - n8n
  - n8n-db
  - n8n-runners
  - passbolt
  - passbolt-db
  - portfolio-alberto
  - portfolio-pablo
  - redis-coordinator
  - selenium
  - shlink
  - shlink-db

# Catalog baseline of every channel-managed workload service. n8n-runners is
# excluded from channels: it is built locally from images/n8n-runners.
workloads_image_baselines:
  atlas: {catalog: atlas, component: app}
  kropia: {catalog: kropia, component: app}
  minecraft: {catalog: minecraft, component: server}
  minecraft-stats: {catalog: minecraft-stats, component: app}
  n8n: {catalog: n8n, component: app}
  n8n-db: {catalog: n8n, component: database}
  passbolt: {catalog: passbolt, component: app}
  passbolt-db: {catalog: passbolt, component: database}
  portfolio-alberto: {catalog: personal-website-alberto, component: app}
  portfolio-pablo: {catalog: personal-website-pablo, component: app}
  redis-coordinator: {catalog: n8n, component: workflow-cache}
  selenium: {catalog: n8n, component: browser}
  shlink: {catalog: shlink, component: app}
  shlink-db: {catalog: shlink, component: database}

# Atlas declares no immutable Docker Config: it reads its gateway token from
# the path in ATLAS_TOKEN_FILE, so the openclaw-entrypoint.sh wrapper that
# only existed to export that value has no successor here.
workloads_config_specs:
  - key: n8n_entrypoint
    source: n8n-entrypoint.sh
    kind: entrypoint
  - key: n8n_runners_entrypoint
    source: n8n-runners-entrypoint.sh
    kind: entrypoint
  - key: n8n_task_runners
    source: n8n-task-runners.json
    kind: application-config
  - key: passbolt_entrypoint
    source: passbolt-entrypoint.sh
    kind: entrypoint
  - key: portfolio_pablo_entrypoint
    source: portfolio-pablo-entrypoint.sh
    kind: entrypoint
  - key: redis_config
    source: redis.conf
    kind: application-config
  - key: shlink_entrypoint
    source: shlink-entrypoint.sh
    kind: entrypoint
