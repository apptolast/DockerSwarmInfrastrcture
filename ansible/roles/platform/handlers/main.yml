---
- name: Enable Docker IPv4 forwarding
  ansible.builtin.command:
    argv:
      - /usr/sbin/sysctl
      - -w
      - net.ipv4.ip_forward=1
  changed_when: true

- name: Restart Docker
  ansible.builtin.systemd_service:
    name: docker.service
    state: restarted
  listen: Restart Docker

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Reload systemd

- name: Restart Docker ingress policy
  ansible.builtin.systemd_service:
    name: dockerswarm-docker-firewall.service
    daemon_reload: true
    enabled: true
    state: restarted
  listen: Restart Docker ingress policy
