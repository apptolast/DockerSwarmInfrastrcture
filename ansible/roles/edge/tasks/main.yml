---
- name: Verify the edge deployment inputs
  ansible.builtin.assert:
    that:
      - edge_traefik_image is match("^traefik@sha256:[a-f0-9]{64}$")
      - edge_traefik_version is match("^[0-9]+\\.[0-9]+\\.[0-9]+$")
      - edge_traefik_hostname is match("^[a-z0-9.-]+$")
      - edge_traefik_acme_email is match("^[^@ ]+@[^@ ]+$")
      - edge_traefik_cloudflare_secret_name is match("^[a-zA-Z0-9_.-]+$")
      - >-
        edge_traefik_acme_storage_filename
        is match("^[a-zA-Z0-9][a-zA-Z0-9_.-]*\\.json$")
      - edge_monitoring_network is match("^[a-zA-Z0-9_.-]+$")
      - >-
        edge_networks == {
          "kropia": "apptolast-edge-kropia",
          "minecraft-stats": "apptolast-edge-minecraft-stats",
          "n8n": "apptolast-edge-n8n",
          "openclaw": "apptolast-edge-openclaw",
          "passbolt": "apptolast-edge-passbolt",
          "portfolio-alberto": "apptolast-edge-portfolio-alberto",
          "portfolio-pablo": "apptolast-edge-portfolio-pablo",
          "shlink": "apptolast-edge-shlink"
        }
      - edge_networks.values() | list | unique | length == 8
      - edge_monitoring_network not in edge_networks.values()
      - edge_deployment_profile in ["production", "acme-staging"]
      - >-
        (
          edge_deployment_profile == "production"
          and edge_traefik_acme_ca_server
            == "https://acme-v02.api.letsencrypt.org/directory"
          and edge_traefik_acme_storage_filename == "acme.json"
        )
        or (
          edge_deployment_profile == "acme-staging"
          and edge_traefik_acme_ca_server
            == "https://acme-staging-v02.api.letsencrypt.org/directory"
          and edge_traefik_acme_storage_filename == "acme-staging.json"
        )
      - >-
        edge_letsencrypt_staging_ca_bundle_sha256
        is match("^[a-f0-9]{64}$")
    fail_msg: "Traefik image, hostname, email, secret or network is invalid."

- name: Verify the Cloudflare token secret exists
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - secret
      - inspect
      - "{{ edge_traefik_cloudflare_secret_name }}"
  register: edge_cloudflare_secret_inspect
  changed_when: false
  no_log: true
  check_mode: false

- name: Verify the Cloudflare token secret provenance labels
  ansible.builtin.assert:
    that:
      - >-
        (edge_cloudflare_secret_inspect.stdout | from_json | first).
        Spec.Name == edge_traefik_cloudflare_secret_name
      - >-
        (edge_cloudflare_secret_inspect.stdout | from_json | first).
        Spec.Labels["com.apptolast.managed-by"] == "manual-bootstrap"
      - >-
        (edge_cloudflare_secret_inspect.stdout | from_json | first).
        Spec.Labels["com.apptolast.purpose"] == "traefik-cloudflare-dns"
    fail_msg: >-
      The external Cloudflare secret exists but lacks the reviewed
      manual-bootstrap provenance.
    quiet: true
  no_log: true

- name: Reconcile edge runtime state outside dry-run
  ansible.builtin.include_tasks: deploy.yml
  when: not ansible_check_mode
