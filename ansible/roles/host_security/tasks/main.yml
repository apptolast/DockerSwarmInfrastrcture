---
- name: Verify the host-security input contract
  ansible.builtin.assert:
    that:
      - host_security_contract_version | int == 1
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version is version("26.04", "==")
      - host_security_admin_user == "admin"
      - host_security_admin_home == "/home/admin"
      - host_security_admin_uid | int == 1001
      - host_security_admin_gid | int == 1001
      - host_security_ssh_group == "sshusers"
      - host_security_ssh_port | int == 22
      - host_security_ssh_phase in ["none", "staged", "final"]
      - >-
        host_security_crowdsec_repository_key_fingerprint
        is match("^[A-F0-9]{40}$")
      - host_security_ubuntu_snapshot is match("^[0-9]{8}T[0-9]{6}Z$")
      - host_security_required_packages | unique | length
        == host_security_required_packages | length
      - >-
        host_security_package_lock
        | map("regex_replace", "=.*$", "") | sort
        == host_security_required_packages | sort
      - >-
        host_security_crowdsec_collection_lock
        | map(attribute="name") | unique | list | length
        == host_security_crowdsec_collection_lock | length
      - >-
        host_security_crowdsec_collection_lock
        | selectattr("sha256", "match", "^[a-f0-9]{64}$")
        | list | length
        == host_security_crowdsec_collection_lock | length
      - >-
        host_security_crowdsec_hub_dependency_lock
        | map(attribute="name") | unique | list | length
        == host_security_crowdsec_hub_dependency_lock | length
      - >-
        host_security_crowdsec_hub_dependency_lock
        | selectattr(
            "type",
            "in",
            ["parsers", "scenarios", "contexts", "postoverflows"]
          )
        | list | length
        == host_security_crowdsec_hub_dependency_lock | length
      - >-
        host_security_crowdsec_hub_dependency_lock
        | selectattr("sha256", "match", "^[a-f0-9]{64}$")
        | list | length
        == host_security_crowdsec_hub_dependency_lock | length
      - host_security_required_active_services | unique | length
        == host_security_required_active_services | length
      - host_security_legacy_tool_policy == "preserve-unmanaged"
      - host_security_preserved_legacy_packages | unique | length
        == host_security_preserved_legacy_packages | length
      - >-
        host_security_preserved_legacy_packages
        | intersect(host_security_required_packages) | length == 0
      - host_security_required_host_egress | selectattr("port", "eq", 4460)
        | selectattr("protocol", "eq", "tcp") | list | length == 1
    fail_msg: >-
      Host security is constrained to the reviewed Ubuntu 26.04 identity,
      authenticated CrowdSec repository and exact egress contract.
    quiet: true

- name: Read the administrator identity
  ansible.builtin.getent:
    database: passwd
    key: "{{ host_security_admin_user }}"

- name: Verify the administrator identity before security changes
  ansible.builtin.assert:
    that:
      - host_security_admin_user in ansible_facts.getent_passwd
      - >-
        ansible_facts.getent_passwd[host_security_admin_user][1] | int
        == host_security_admin_uid | int
      - >-
        ansible_facts.getent_passwd[host_security_admin_user][2] | int
        == host_security_admin_gid | int
      - >-
        ansible_facts.getent_passwd[host_security_admin_user][4]
        == host_security_admin_home
      - >-
        ansible_facts.getent_passwd[host_security_admin_user][5]
        == "/bin/bash"
    fail_msg: "The reviewed administrator identity is absent or has drifted."
    quiet: true

- name: Read administrator group membership
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - -nG
      - "{{ host_security_admin_user }}"
  register: host_security_admin_groups
  changed_when: false
  check_mode: false

- name: Verify SSH and privilege memberships
  ansible.builtin.assert:
    that:
      - host_security_ssh_group in host_security_admin_groups.stdout.split()
      - '"sudo" in host_security_admin_groups.stdout.split()'
    fail_msg: "admin must belong to sshusers and sudo before hardening."
    quiet: true

- name: Reconcile the exact administrator supplementary groups
  ansible.builtin.user:
    name: "{{ host_security_admin_user }}"
    groups:
      - sudo
      - "{{ host_security_ssh_group }}"
    append: false
  register: host_security_admin_group_reconciliation

- name: Read reconciled administrator group membership
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - -nG
      - "{{ host_security_admin_user }}"
  register: host_security_reconciled_admin_groups
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Reject every unreviewed administrator group
  ansible.builtin.assert:
    that:
      - >-
        host_security_reconciled_admin_groups.stdout.split() | sort
        == [host_security_admin_user, "sudo", host_security_ssh_group] | sort
    fail_msg: >-
      admin retains an unreviewed supplementary group, including a
      root-equivalent Docker membership.
    quiet: true
  when: not ansible_check_mode

- name: Inspect administrator authorized keys
  ansible.builtin.stat:
    path: "{{ host_security_authorized_keys_path }}"
    follow: false
  register: host_security_authorized_keys

- name: Verify administrator authorized-key ownership
  ansible.builtin.assert:
    that:
      - host_security_authorized_keys.stat.exists
      - host_security_authorized_keys.stat.isreg
      - not host_security_authorized_keys.stat.islnk
      - host_security_authorized_keys.stat.uid | int
        == host_security_admin_uid | int
      - host_security_authorized_keys.stat.gid | int
        == host_security_admin_gid | int
      - host_security_authorized_keys.stat.mode == "0600"
    fail_msg: "The administrator authorized-key allowlist is unsafe."
    quiet: true

- name: Install the exact authorized-key validator
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/validate-authorized-keys.py"
    dest: "{{ host_security_authorized_keys_validator }}"
    owner: root
    group: root
    mode: "0755"

- name: Strictly validate every administrator key
  ansible.builtin.script:
    cmd: >-
      {{
        [
          playbook_dir + "/../../scripts/validate-authorized-keys.py",
          host_security_authorized_keys_path,
          "--ssh-keygen",
          "/usr/bin/ssh-keygen",
          "--json"
        ]
        | map("quote") | join(" ")
      }}
    executable: /usr/bin/python3
  register: host_security_authorized_key_validation
  changed_when: false
  check_mode: false
  no_log: true

- name: Verify at least one administrator key exists
  ansible.builtin.assert:
    that:
      - >-
        (host_security_authorized_key_validation.stdout | from_json).count
        | int > 0
    fail_msg: "No parseable key exists for the administrator."
    quiet: true

- name: Route the declared GitHub SSH remote over reviewed HTTPS egress
  ansible.builtin.template:
    src: github-over-https.conf.j2
    dest: "{{ host_security_github_ssh_client_config }}"
    owner: root
    group: root
    mode: "0644"

- name: Resolve the system GitHub SSH client policy
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh
      - -G
      - -F
      - /dev/stdin
      - github.com
    stdin: >-
      {{
        lookup(
          "ansible.builtin.template",
          role_path + "/templates/github-over-https.conf.j2"
        )
      }}
    stdin_add_newline: true
  register: host_security_github_ssh_policy
  changed_when: false
  check_mode: false

- name: Enforce GitHub SSH maintenance over TCP 443
  ansible.builtin.assert:
    that:
      - >-
        "hostname ssh.github.com"
        in host_security_github_ssh_policy.stdout_lines
      - '"port 443" in host_security_github_ssh_policy.stdout_lines'
      - '"user git" in host_security_github_ssh_policy.stdout_lines'
    fail_msg: "The GitHub SSH client path does not use ssh.github.com:443."
    quiet: true

- name: Pin the reviewed Ubuntu archive snapshot
  ansible.builtin.copy:
    content: |
      // Managed by Ansible. Update only after validating a newer snapshot.
      APT::Snapshot "{{ host_security_ubuntu_snapshot }}";
    dest: /etc/apt/apt.conf.d/50dockerswarm-snapshot
    owner: root
    group: root
    mode: "0644"

- name: Install repository bootstrap dependencies
  ansible.builtin.apt:
    name: "{{ host_security_repository_bootstrap_package_lock }}"
    state: present
    allow_downgrade: false
    update_cache: true
    cache_valid_time: 3600

- name: Create the administrator APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# Cada apply creaba un directorio temporal en /etc/apt/keyrings, volvia a
# descargar la clave con `force: true` y borraba el directorio: tres tareas
# `changed` aunque el keyring no cambiara. Ahora se lee sin efectos el keyring
# que apt usa (`signed-by`) y la clave publicada, que se descarga solo en
# memoria con `uri` (un GET sin `dest` nunca informa `changed`). La descarga
# a disco, la autenticacion y la instalacion solo se omiten cuando el keyring
# ya es un fichero regular root:root 0644 con exactamente una clave primaria,
# la de la huella revisada, en el registro `fpr` que sigue a `pub`, y cuando
# gpg lo describe registro a registro igual que a la clave publicada: mismas
# subclaves, mismos uid y mismos campos de validez y caducidad. Asi una
# revocacion, una subclave de firma nueva o una caducidad nueva publicada bajo
# la misma clave primaria llegan al host en el siguiente apply, como antes.
# Un keyring ausente, que gpg no lee, con otra clave, con varias, con otros
# permisos o distinto de la clave publicada vuelve a la instalacion
# autenticada; nunca se da por bueno sin comprobar la huella. Si en esa ruta
# hay otra cosa (un enlace, un directorio), el apply se detiene sin tocarla.
# `gpg --show-keys` solo muestra la clave: no la importa en ningun anillo.
- name: Inspect the installed CrowdSec repository keyring
  ansible.builtin.stat:
    path: "{{ host_security_crowdsec_keyring }}"
    follow: false
  register: host_security_crowdsec_keyring_file

- name: Require the CrowdSec keyring to be absent or a regular file
  ansible.builtin.assert:
    that:
      - >-
        not host_security_crowdsec_keyring_file.stat.exists
        or host_security_crowdsec_keyring_file.stat.isreg
    fail_msg: >-
      {{ host_security_crowdsec_keyring }} exists but is not a regular file.
      The installed CrowdSec key cannot be proven, so it is left untouched.
    quiet: true

- name: Read the installed CrowdSec keyring identity
  ansible.builtin.command:
    argv:
      - /usr/bin/gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ host_security_crowdsec_keyring }}"
  register: host_security_crowdsec_installed_key_identity
  changed_when: false
  failed_when: false
  when: host_security_crowdsec_keyring_file.stat.isreg | default(false)

- name: Fetch the published CrowdSec repository key in memory
  ansible.builtin.uri:
    url: "{{ host_security_crowdsec_repository_key_url }}"
    method: GET
    return_content: true
    status_code: 200
  register: host_security_crowdsec_published_key
  when: not ansible_check_mode

- name: Read the published CrowdSec key identity
  ansible.builtin.command:
    argv:
      - /usr/bin/gpg
      - --batch
      - --show-keys
      - --with-colons
    stdin: "{{ host_security_crowdsec_published_key.content }}"
  register: host_security_crowdsec_published_key_identity
  changed_when: false
  when: not ansible_check_mode

- name: Authenticate the published CrowdSec key
  ansible.builtin.assert:
    that:
      - >-
        host_security_crowdsec_published_key_identity.stdout_lines
        | select("match", "^pub:")
        | list | length == 1
      - >-
        (
          host_security_crowdsec_published_key_identity.stdout_lines
          | select("match", "^fpr:")
          | first
        ).split(":")[9]
        == host_security_crowdsec_repository_key_fingerprint
    fail_msg: >-
      The published CrowdSec key differs from the reviewed fingerprint.
      The installed keyring was not modified.
    quiet: true
  when: not ansible_check_mode

- name: Recognize an already authenticated CrowdSec keyring
  ansible.builtin.set_fact:
    host_security_crowdsec_keyring_current: >-
      {{
        host_security_crowdsec_keyring_file.stat.isreg | default(false)
        and host_security_crowdsec_keyring_file.stat.uid | default(-1) == 0
        and host_security_crowdsec_keyring_file.stat.gid | default(-1) == 0
        and host_security_crowdsec_keyring_file.stat.mode | default("")
        == "0644"
        and host_security_crowdsec_installed_key_identity.rc | default(1) == 0
        and host_security_crowdsec_installed_key_identity.stdout
        | default("")
        | regex_findall("^pub:", multiline=true)
        | length == 1
        and host_security_crowdsec_installed_key_identity.stdout
        | default("")
        is search(
          "^pub:[^\n]*\nfpr:(?:[^:]*:){8}"
          ~ host_security_crowdsec_repository_key_fingerprint ~ ":",
          multiline=true
        )
        and host_security_crowdsec_installed_key_identity.stdout_lines
        | default([])
        == host_security_crowdsec_published_key_identity.stdout_lines
        | default(none)
      }}

- name: Authenticate and install the CrowdSec repository key
  when:
    - not ansible_check_mode
    - not host_security_crowdsec_keyring_current
  block:
    - name: Allocate private CrowdSec key staging
      ansible.builtin.tempfile:
        state: directory
        path: /etc/apt/keyrings
        prefix: .crowdsec-key.
      register: host_security_crowdsec_key_staging

    - name: Download the official CrowdSec repository key
      ansible.builtin.get_url:
        url: "{{ host_security_crowdsec_repository_key_url }}"
        dest: "{{ host_security_crowdsec_key_staging.path }}/key.asc"
        owner: root
        group: root
        mode: "0600"
        force: true

    - name: Read the staged CrowdSec key identity
      ansible.builtin.command:
        argv:
          - /usr/bin/gpg
          - --batch
          - --show-keys
          - --with-colons
          - "{{ host_security_crowdsec_key_staging.path }}/key.asc"
      register: host_security_crowdsec_key_identity
      changed_when: false

    - name: Authenticate the staged CrowdSec key
      ansible.builtin.assert:
        that:
          - >-
            host_security_crowdsec_key_identity.stdout_lines
            | select("match", "^pub:")
            | list | length == 1
          - >-
            (
              host_security_crowdsec_key_identity.stdout_lines
              | select("match", "^fpr:")
              | first
            ).split(":")[9]
            == host_security_crowdsec_repository_key_fingerprint
        fail_msg: >-
          The downloaded CrowdSec key differs from the reviewed fingerprint.
          The installed keyring was not modified.
        quiet: true

    - name: Dearmor the authenticated CrowdSec key
      ansible.builtin.command:
        argv:
          - /usr/bin/gpg
          - --batch
          - --yes
          - --dearmor
          - --output
          - "{{ host_security_crowdsec_key_staging.path }}/key.gpg"
          - "{{ host_security_crowdsec_key_staging.path }}/key.asc"
      changed_when: false

    - name: Atomically install the authenticated CrowdSec key
      ansible.builtin.copy:
        src: "{{ host_security_crowdsec_key_staging.path }}/key.gpg"
        dest: "{{ host_security_crowdsec_keyring }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
        unsafe_writes: false

  always:
    - name: Remove private CrowdSec key staging
      ansible.builtin.file:
        path: "{{ host_security_crowdsec_key_staging.path | default('') }}"
        state: absent
      when:
        - host_security_crowdsec_key_staging.path | default("") | length > 0

- name: Configure the official CrowdSec repository
  ansible.builtin.deb822_repository:
    name: crowdsec
    types:
      - deb
    uris:
      - "{{ host_security_crowdsec_repository_url }}"
    suites:
      - any
    components:
      - main
    signed_by: "{{ host_security_crowdsec_keyring }}"
    enabled: true
    state: present
  register: host_security_crowdsec_repository
  when: not ansible_check_mode

- name: Install the reviewed host-security packages
  ansible.builtin.apt:
    name: "{{ host_security_package_lock }}"
    state: present
    allow_downgrade: false
    update_cache: >-
      {{ host_security_crowdsec_repository.changed | default(false) }}
  register: host_security_package_install
  when: not ansible_check_mode

- name: Read exact installed host-security package versions
  ansible.builtin.command:
    argv:
      - /usr/bin/dpkg-query
      - -W
      - "-f=${Version}"
      - "{{ item.split('=', 1)[0] }}"
  loop: >-
    {{
      host_security_repository_bootstrap_package_lock
      + host_security_package_lock
    }}
  register: host_security_installed_package_versions
  changed_when: false
  check_mode: false

- name: Enforce every locked host-security package version
  ansible.builtin.assert:
    that:
      - item.stdout == item.item.split("=", 1)[1]
    fail_msg: >-
      {{ item.item.split("=", 1)[0] }} differs from the reviewed package lock.
    quiet: true
  loop: "{{ host_security_installed_package_versions.results }}"
  loop_control:
    label: "{{ item.item.split('=', 1)[0] }}"

- name: Inventory the preserved OpenSSH PAM policy
  ansible.builtin.stat:
    path: /etc/pam.d/sshd
    checksum_algorithm: sha256
  register: host_security_pam_sshd

- name: Preserve the existing OpenSSH PAM integration
  ansible.builtin.assert:
    that:
      - host_security_pam_sshd.stat.exists
      - host_security_pam_sshd.stat.isreg
      - not host_security_pam_sshd.stat.islnk
      - host_security_pam_sshd.stat.pw_name == "root"
      - host_security_pam_sshd.stat.gr_name == "root"
      - host_security_pam_sshd.stat.mode == "0644"
    fail_msg: >-
      The existing OpenSSH PAM file is structurally unsafe.
    quiet: true

- name: Retire the inert OpenSSH MFA hook
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sshd
    regexp: '^\s*auth\s+\S+\s+pam_google_authenticator\.so'
    state: absent
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: host_security_ssh_mfa_policy == "retired"

- name: Inventory preserved legacy host-security packages
  ansible.builtin.package_facts:
    manager: apt

- name: Record preserved legacy host-security package presence
  ansible.builtin.set_fact:
    host_security_observed_legacy_packages: >-
      {{
        host_security_preserved_legacy_packages
        | intersect(ansible_facts.packages.keys() | list)
        | sort
      }}

- name: Disable autonomous CrowdSec Hub updates
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
    daemon_reload: true
  loop:
    - crowdsec-hubupdate.timer
    - crowdsec-hubupdate.service

# Masking crowdsec-hubupdate.service makes the unit its timer triggers vanish,
# so systemd leaves the timer at ActiveState=failed (Result=resources) even
# though it is masked and can no longer run. Clear that residual state so the
# promotion gate below reads a deterministic ActiveState. A non-zero exit is
# tolerated here (systemd reports "not loaded" for an already-masked, unloaded
# unit); the assert that follows is the real gate and is not relaxed.
- name: Clear the residual failure that masking leaves on the Hub units
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - reset-failed
      - "{{ item }}"
  loop:
    - crowdsec-hubupdate.timer
    - crowdsec-hubupdate.service
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Read the CrowdSec Hub update unit states
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - "{{ item }}"
      - --property=ActiveState
      - --property=UnitFileState
  loop:
    - crowdsec-hubupdate.timer
    - crowdsec-hubupdate.service
  register: host_security_crowdsec_hubupdate_states
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Enforce versioned-only CrowdSec Hub promotion
  ansible.builtin.assert:
    that:
      - '"ActiveState=inactive" in item.stdout_lines'
      - '"UnitFileState=masked" in item.stdout_lines'
    fail_msg: "{{ item.item }} can still mutate the locked CrowdSec Hub."
    quiet: true
  loop: "{{ host_security_crowdsec_hubupdate_states.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Verify CrowdSec resolves from its official repository
  ansible.builtin.command:
    argv:
      - /usr/bin/apt-cache
      - policy
      - crowdsec
  register: host_security_crowdsec_policy
  changed_when: false
  check_mode: false

- name: Enforce the CrowdSec package origin
  ansible.builtin.assert:
    that:
      - >-
        host_security_crowdsec_repository_url
        in host_security_crowdsec_policy.stdout
    fail_msg: "CrowdSec is not sourced from the authenticated official repo."
    quiet: true

- name: Inspect locked CrowdSec Hub candidates before installation
  ansible.builtin.command:
    argv:
      - /usr/bin/cscli
      - "{{ item.type }}"
      - inspect
      - "{{ item.name }}"
      - --output
      - json
  loop: >-
    {{
      (
        host_security_crowdsec_collection_lock
        | map("combine", {"type": "collections"})
        | list
      )
      + host_security_crowdsec_hub_dependency_lock
    }}
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  register: host_security_crowdsec_hub_candidates
  changed_when: false
  check_mode: false

- name: Reject unreviewed CrowdSec Hub candidates before mutation
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json).name == item.item.name
      - (item.stdout | from_json).version == item.item.version
      - >-
        (item.stdout | from_json).versions[item.item.version].digest
        == item.item.sha256
    fail_msg: >-
      CrowdSec {{ item.item.type }}/{{ item.item.name }} is not the reviewed
      Hub artifact. No collection was installed.
    quiet: true
  loop: "{{ host_security_crowdsec_hub_candidates.results }}"
  loop_control:
    label: "{{ item.item.type }}/{{ item.item.name }}"

- name: Install the reviewed CrowdSec collections
  when: not ansible_check_mode
  ansible.builtin.command:
    argv: >-
      {{
        ["/usr/bin/cscli", "collections", "install"]
        + (
          host_security_crowdsec_collection_lock
          | map(attribute="name") | list
        )
        + ["--error", "--color", "no"]
      }}
  register: host_security_crowdsec_collection_install
  changed_when: >-
    "Nothing to install or remove."
    not in host_security_crowdsec_collection_install.stdout
  check_mode: false

- name: Inspect every available locked CrowdSec Hub item
  ansible.builtin.command:
    argv:
      - /usr/bin/cscli
      - "{{ item.type }}"
      - inspect
      - "{{ item.name }}"
      - --output
      - json
  loop: >-
    {{
      (
        host_security_crowdsec_collection_lock
        | map("combine", {"type": "collections"})
        | list
      )
      + host_security_crowdsec_hub_dependency_lock
    }}
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  register: host_security_crowdsec_hub_inspections
  changed_when: false
  check_mode: false

- name: Enforce installed CrowdSec Hub versions and content digests
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json).name == item.item.name
      - (item.stdout | from_json).version == item.item.version
      - >-
        (item.stdout | from_json).versions[item.item.version].digest
        == item.item.sha256
      - (item.stdout | from_json).installed | bool
      - (item.stdout | from_json).local_version == item.item.version
      - (item.stdout | from_json).local_hash == item.item.sha256
      - not ((item.stdout | from_json).tainted | bool)
    fail_msg: >-
      CrowdSec {{ item.item.type }}/{{ item.item.name }} differs from its
      reviewed version or content digest. Review the new artifact first.
    quiet: true
  loop: "{{ host_security_crowdsec_hub_inspections.results }}"
  loop_control:
    label: "{{ item.item.type }}/{{ item.item.name }}"

- name: Read the complete installed CrowdSec Hub inventory
  ansible.builtin.command:
    argv:
      - /usr/bin/cscli
      - hub
      - list
      - --output
      - json
      - --error
      - --color
      - "no"
  register: host_security_crowdsec_hub_inventory_raw
  changed_when: false
  check_mode: false

- name: Decode the installed CrowdSec Hub inventory
  ansible.builtin.set_fact:
    host_security_crowdsec_hub_inventory: >-
      {{ host_security_crowdsec_hub_inventory_raw.stdout | from_json }}

- name: Reject every unreviewed installed CrowdSec Hub item
  ansible.builtin.assert:
    that:
      - >-
        host_security_crowdsec_hub_inventory.keys() | sort
        == [
          "appsec-configs",
          "appsec-rules",
          "collections",
          "contexts",
          "parsers",
          "postoverflows",
          "scenarios"
        ]
      - >-
        host_security_crowdsec_hub_inventory["appsec-configs"] | length == 0
      - host_security_crowdsec_hub_inventory["appsec-rules"] | length == 0
      - >-
        host_security_crowdsec_hub_inventory.collections
        | map(attribute="name") | sort
        == host_security_crowdsec_collection_lock
        | map(attribute="name") | sort
      - >-
        host_security_crowdsec_hub_inventory.contexts
        | map(attribute="name") | sort
        == host_security_crowdsec_hub_dependency_lock
        | selectattr("type", "equalto", "contexts")
        | map(attribute="name") | sort
      - >-
        host_security_crowdsec_hub_inventory.parsers
        | map(attribute="name") | sort
        == host_security_crowdsec_hub_dependency_lock
        | selectattr("type", "equalto", "parsers")
        | map(attribute="name") | sort
      - >-
        host_security_crowdsec_hub_inventory.postoverflows
        | map(attribute="name") | sort
        == host_security_crowdsec_hub_dependency_lock
        | selectattr("type", "equalto", "postoverflows")
        | map(attribute="name") | sort
      - >-
        host_security_crowdsec_hub_inventory.scenarios
        | map(attribute="name") | sort
        == host_security_crowdsec_hub_dependency_lock
        | selectattr("type", "equalto", "scenarios")
        | map(attribute="name") | sort
    fail_msg: >-
      Installed CrowdSec Hub content contains an unreviewed or missing item.
      Review drift before removing or enabling security content.
    quiet: true

- name: Create the CrowdSec acquisition directory
  ansible.builtin.file:
    path: /etc/crowdsec/acquis.d
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install exact CrowdSec acquisition sources
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/crowdsec/acquis.d/{{ item }}"
    owner: root
    group: root
    mode: "0640"
  loop: "{{ host_security_managed_acquisition_files }}"
  notify: Restart CrowdSec

- name: Remove known generated duplicate acquisitions
  ansible.builtin.file:
    path: "/etc/crowdsec/acquis.d/{{ item }}"
    state: absent
  loop:
    - setup.linux.yaml
    - setup.sshd.yaml
  notify: Restart CrowdSec

- name: Remove the legacy monolithic CrowdSec acquisition file
  ansible.builtin.file:
    path: /etc/crowdsec/acquis.yaml
    state: absent
  notify: Restart CrowdSec

- name: Enumerate CrowdSec acquisition files
  ansible.builtin.find:
    paths: /etc/crowdsec/acquis.d
    file_type: file
    recurse: false
  register: host_security_crowdsec_acquisitions
  when: not ansible_check_mode

- name: Enforce the exact CrowdSec acquisition set
  ansible.builtin.assert:
    that:
      - >-
        host_security_crowdsec_acquisitions.files
        | map(attribute="path") | map("basename") | sort
        == host_security_managed_acquisition_files | sort
    fail_msg: >-
      An unmanaged CrowdSec acquisition source would duplicate or expand the
      reviewed log scope.
    quiet: true
  when: not ansible_check_mode

- name: Install the exact Fail2ban SSH jail
  ansible.builtin.template:
    src: fail2ban-sshd.local.j2
    dest: "{{ host_security_fail2ban_jail }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Install the exact Fail2ban global policy
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Remove the superseded unmanaged Fail2ban SSH override
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/ssh.local
    state: absent
  notify: Restart Fail2ban

- name: Validate the complete Fail2ban configuration
  ansible.builtin.command:
    argv:
      - /usr/bin/fail2ban-client
      - --test
  changed_when: false
  check_mode: false

- name: Configure the reviewed PSAD settings
  ansible.builtin.lineinfile:
    path: /etc/psad/psad.conf
    regexp: "^{{ item.key }}[ \t]+"
    line: "{{ item.key }}                    {{ item.value }};"
    state: present
  loop:
    - key: EMAIL_ADDRESSES
      value: root@localhost
    - key: HOSTNAME
      value: "{{ ansible_facts.fqdn }}"
    - key: IPT_WRITE_FWDATA
      value: "Y"
    - key: IPT_SYSLOG_FILE
      value: "{{ host_security_psad_log_path }}"
    - key: ENABLE_AUTO_IDS
      value: "Y"
    - key: AUTO_IDS_DANGER_LEVEL
      value: "{{ host_security_psad_auto_ids_danger_level }}"
    - key: ENABLE_AUTO_IDS_EMAILS
      value: "N"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart PSAD

# Las lineas PSAD antiguas son identicas a las reglas del bloque gestionado,
# asi que un `lineinfile` por linea borraba tambien las del bloque; la tarea
# siguiente las volvia a escribir y cada apply notificaba `Reload UFW`. Ese
# reload es un stop/start: deja INPUT/OUTPUT/FORWARD en ACCEPT un instante y,
# al arrancar, vuelve a anadir las reglas LOG del bloque a INPUT y FORWARD. La
# primera alternativa casa el bloque gestionado entero y lo devuelve tal cual
# (\1), de modo que la segunda solo puede casar lineas antiguas fuera de el.
# `replace` compila con re.MULTILINE y solo informa de cambio si el contenido
# resultante difiere.
- name: Remove unmarked legacy PSAD UFW lines
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: |-
      (?x)
      ( ^[#][ ]BEGIN[ ]DOCKERSWARM[ ]PSAD\n
        (?:.*\n)*?
        [#][ ]END[ ]DOCKERSWARM[ ]PSAD$ )
      | ^(?: [#][ ]log[ ]all[ ]traffic[ ]so[ ]psad[ ]can[ ]analyze
          | -A[ ](?:INPUT|FORWARD)[ ]-j[ ]LOG[ ]--log-tcp-options
            [ ]--log-prefix[ ]"\[IPTABLES\][ ]" )$\n?
    replace: '\1'
    validate: "{{ item.validator }} --test %s"
  loop:
    - path: /etc/ufw/before.rules
      validator: /usr/sbin/iptables-restore
    - path: /etc/ufw/before6.rules
      validator: /usr/sbin/ip6tables-restore
  loop_control:
    label: "{{ item.path }} PSAD legacy rules"
  notify: Reload UFW

- name: Install managed PSAD logging in UFW
  ansible.builtin.blockinfile:
    path: "{{ item.path }}"
    insertbefore: "^COMMIT$"
    marker: "# {mark} DOCKERSWARM PSAD"
    block: |
      # Log otherwise unmatched traffic for PSAD analysis.
      -A INPUT -j LOG --log-tcp-options --log-prefix "[IPTABLES] "
      -A FORWARD -j LOG --log-tcp-options --log-prefix "[IPTABLES] "
    owner: root
    group: root
    mode: "0640"
    validate: "{{ item.validator }} --test %s"
  loop:
    - path: /etc/ufw/before.rules
      validator: /usr/sbin/iptables-restore
    - path: /etc/ufw/before6.rules
      validator: /usr/sbin/ip6tables-restore
  loop_control:
    label: "{{ item.path }}"
  notify: Reload UFW

- name: Route PSAD firewall events to their bounded log
  ansible.builtin.template:
    src: rsyslog-iptables.conf.j2
    dest: "{{ host_security_rsyslog_iptables_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Install the PSAD log rotation policy
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../config/logrotate/iptables"
    dest: /etc/logrotate.d/iptables
    owner: root
    group: root
    mode: "0644"

- name: Validate the complete rsyslog configuration
  ansible.builtin.command:
    argv:
      - /usr/sbin/rsyslogd
      - -N1
  changed_when: false
  check_mode: false

- name: Keep IPv6 under the same UFW policy
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: "^IPV6="
    line: IPV6=yes
    state: present
  notify: Reload UFW

# Con UFW activo, `ufw default` hace siempre un stop/start completo aunque la
# politica no cambie (ufw/frontend.py, set_default_policy) e informa siempre
# de un cambio. Cada stop pone INPUT/OUTPUT/FORWARD en ACCEPT y vacia las
# cadenas de UFW (ufw-init-functions, ufw_stop con MANAGE_BUILTINS=no): cada
# apply abria un instante a Internet 2377, 7946, 4789 y el 22 sin limite de
# tasa. Se lee sin efectos lo que `ufw default` escribe, DEFAULT_*_POLICY de
# /etc/default/ufw, y solo se ejecuta para la direccion que difiere. Si el
# fichero no se puede leer sin ambiguedad, el apply se detiene antes de tocar
# UFW. La politica efectiva la vuelve a exigir "Verify the fail-closed UFW
# base".
- name: Read the persisted UFW default policies without touching UFW
  ansible.builtin.slurp:
    src: /etc/default/ufw
  register: host_security_ufw_defaults_file

- name: Parse the persisted UFW default policies
  ansible.builtin.set_fact:
    host_security_ufw_default_policy_lines: >-
      {{
        host_security_ufw_defaults_file.content
        | b64decode
        | regex_findall(
            "^DEFAULT_(INPUT|OUTPUT|FORWARD)_POLICY=(.*)$",
            multiline=true
          )
      }}

- name: Require exactly one readable policy per UFW direction
  ansible.builtin.assert:
    that:
      - >-
        host_security_ufw_default_policy_lines | map("first") | sort
        == ["FORWARD", "INPUT", "OUTPUT"]
      - >-
        host_security_ufw_default_policy_lines | map("last")
        | reject("match", '^"?(ACCEPT|DROP|REJECT)"?$') | list | length == 0
    fail_msg: >-
      /etc/default/ufw must set DEFAULT_INPUT_POLICY, DEFAULT_OUTPUT_POLICY and
      DEFAULT_FORWARD_POLICY exactly once each to ACCEPT, DROP or REJECT. The
      current UFW policy cannot be proven, so UFW is left untouched.
    quiet: true

# `ufw logging` reescribe LOGLEVEL en /etc/ufw/ufw.conf, regenera
# user.rules/user6.rules y vacia y rellena las cadenas de logging de UFW
# aunque el nivel no cambie, y siempre responde "Logging enabled"
# (ufw/backend.py, set_loglevel): la tarea informaba `changed` en cada apply.
# No toca las politicas ni para el firewall. Se lee sin efectos el LOGLEVEL
# persistido, el que UFW vuelve a aplicar a sus cadenas en cada arranque, y
# `ufw logging low` solo se omite cuando el fichero declara LOGLEVEL al menos
# una vez y todas valen `low` o `"low"`. En cualquier otro caso (ausente,
# otro nivel, `LOW`, comillas simples, un comentario detras, vacio) se
# ejecuta, porque `set_default` reescribe cada linea `^LOGLEVEL=` y anade una
# si no hay ninguna (ufw/backend.py). No elimina duplicados, de ahi que varias
# lineas `LOGLEVEL=low` cuenten como convergidas. UFW lee la clave sin
# distinguir mayusculas y se queda con la ultima, pero `set_default` solo
# reescribe `LOGLEVEL=` en mayusculas: una clave escrita de otra forma
# (`loglevel=`) no se puede converger y el apply se detiene antes de tocar UFW.
- name: Read the persisted UFW log level without touching UFW
  ansible.builtin.slurp:
    src: /etc/ufw/ufw.conf
  register: host_security_ufw_conf_file

- name: Parse the persisted UFW log level
  ansible.builtin.set_fact:
    host_security_ufw_loglevel_lines: >-
      {{
        host_security_ufw_conf_file.content
        | b64decode
        | regex_findall(
            "^(loglevel)=(.*)$",
            multiline=true,
            ignorecase=true
          )
      }}

- name: Require a UFW log-level key that ufw logging can rewrite
  ansible.builtin.assert:
    that:
      - >-
        host_security_ufw_loglevel_lines | map("first")
        | reject("equalto", "LOGLEVEL") | list | length == 0
    fail_msg: >-
      /etc/ufw/ufw.conf sets the log level with a key spelled other than
      LOGLEVEL. ufw reads that key too, but `ufw logging` only rewrites
      LOGLEVEL= lines, so the UFW log level cannot be proven or converged.
      UFW is left untouched.
    quiet: true

- name: Set fail-closed UFW defaults
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - --force
      - default
      - deny
      - "{{ item.direction }}"
  loop:
    - direction: incoming
      chain: INPUT
    - direction: outgoing
      chain: OUTPUT
    - direction: routed
      chain: FORWARD
  loop_control:
    label: "{{ item.direction }}"
  when: >-
    dict(host_security_ufw_default_policy_lines)[item.chain] | trim('"')
    != "DROP"
  changed_when: true

- name: Rate-limit the sole administrative ingress
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - limit
      - in
      - "{{ host_security_ssh_port }}/tcp"
      - comment
      - allow SSH connections in
  environment:
    LC_ALL: C
  register: host_security_ufw_ssh
  changed_when: "'Rule added' in host_security_ufw_ssh.stdout"

- name: Remove protocol-agnostic legacy egress rules from UFW
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - --force
      - delete
      - allow
      - out
      - "{{ item | string }}"
  environment:
    LC_ALL: C
  loop: >-
    {{
      host_security_required_host_egress
      | map(attribute="port")
      | unique
      | sort
    }}
  register: host_security_ufw_legacy_egress
  changed_when: "'Rule deleted' in host_security_ufw_legacy_egress.stdout"
  failed_when:
    - host_security_ufw_legacy_egress.rc != 0
    - >-
      "Could not delete non-existent rule"
      not in
      (
        host_security_ufw_legacy_egress.stdout
        ~ host_security_ufw_legacy_egress.stderr
      )
  when:
    - not ansible_check_mode

- name: Allow only reviewed host egress classes
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - allow
      - out
      - proto
      - "{{ item.protocol }}"
      - to
      - any
      - port
      - "{{ item.port | string }}"
      - comment
      - dockerswarm-host-egress
  environment:
    LC_ALL: C
  loop: "{{ host_security_required_host_egress }}"
  loop_control:
    label: "{{ item.protocol }}/{{ item.port }}"
  register: host_security_ufw_egress
  changed_when: "'Rule added' in host_security_ufw_egress.stdout"

- name: Enable bounded UFW logging
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - logging
      - low
  when: >-
    host_security_ufw_loglevel_lines | length == 0
    or host_security_ufw_loglevel_lines | map("last")
    | reject("in", ["low", '"low"']) | list | length > 0
  changed_when: true

- name: Enable the fail-closed firewall
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - --force
      - enable
  register: host_security_ufw_enable
  changed_when: >-
    "Firewall is active and enabled on system startup"
    not in host_security_ufw_enable.stdout

- name: Apply service and firewall handlers before validation
  ansible.builtin.meta: flush_handlers

- name: Enable and start required host-security services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ host_security_required_active_services }}"

- name: Install the exact UFW contract validator
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/validate-ufw-contract.py"
    dest: "{{ host_security_ufw_validator }}"
    owner: root
    group: root
    mode: "0755"

- name: Reject every unreviewed UFW user-chain rule
  ansible.builtin.script:
    cmd: >-
      {{
        (
          [
            playbook_dir + "/../../scripts/validate-ufw-contract.py",
            "--ssh-port",
            host_security_ssh_port | string,
            "--public-interface",
            platform_public_interface,
            "--public-ipv4",
            platform_public_ipv4
          ]
          + (
            platform_public_tcp_ports
            | map("string")
            | map("regex_replace", "^(.*)$", "--public-port=\g<1>")
            | list
          )
          + (
            host_security_required_host_egress
            | map(attribute="protocol")
            | zip(
                host_security_required_host_egress
                | map(attribute="port")
              )
            | map("join", ":")
            | map("regex_replace", "^(.*)$", "--egress=\g<1>")
            | list
          )
        )
        | map("quote") | join(" ")
      }}
    executable: /usr/bin/python3
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Read the active UFW policy
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - status
      - verbose
  environment:
    LC_ALL: C
  register: host_security_ufw_status
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Verify the fail-closed UFW base
  ansible.builtin.assert:
    that:
      - '"Status: active" in host_security_ufw_status.stdout'
      - >-
        host_security_ufw_status.stdout is search(
          "Default:[ ]+deny \\(incoming\\),[ ]+deny \\(outgoing\\),"
          ~ "[ ]+deny \\(routed\\)"
        )
      - >-
        host_security_ufw_status.stdout
        is search((host_security_ssh_port | string) ~ "/tcp[ ]+LIMIT IN")
    fail_msg: "The UFW base is not active and fail-closed."
    quiet: true
  when: not ansible_check_mode

- name: Validate the CrowdSec engine
  ansible.builtin.command:
    argv:
      - /usr/bin/crowdsec
      - -c
      - /etc/crowdsec/config.yaml
      - -t
      - -error
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

# `-t` esta documentado como "test config and exit", pero el bouncer
# inicializa el backend real, borra los ipsets de bloqueo y al salir retira
# las cadenas (cmd/root.go y pkg/iptables de cs-firewall-bouncer v0.0.34).
# Las cadenas de iptables son globales, no por proceso, de modo que la
# instancia de prueba desmonta las de la instancia viva y nadie las vuelve a
# poner: el servicio sigue `active` mientras CROWDSEC_CHAIN ha desaparecido de
# ambas familias y el host deja de filtrar sin que nada lo señale. Ocurrio el
# 2026-07-28 y dejo la maquina ~20 h sin bloqueo alguno de CrowdSec. Por eso
# la prueba solo corre cuando hay algo que la instancia viva no ha validado:
# - este apply ha instalado o actualizado paquetes (el postinst del paquete
#   puede reescribir la configuracion), o
# - la configuracion, su `.local` (el bouncer fusiona ambas,
#   pkg/cfg/config.go), su directorio o el binario tienen un ctime igual o
#   posterior al arranque de la instancia viva, falta alguno de los
#   obligatorios, no son del tipo esperado (fichero regular o directorio), o
#   ese arranque no se puede leer.
# El daemon no relee su configuracion (HandleSignals solo atiende SIGTERM y
# SIGINT) y systemd la valida con `-t` antes de cada arranque (ExecStartPre),
# asi que lo que no ha cambiado desde el arranque ya esta validado. Un fichero
# tocado despues, aunque solo cambien su dueño o sus permisos, se prueba aqui
# antes de que un reinicio posterior de este apply (la restauracion de mas
# abajo o el handler de host_baseline) lo cargue. El directorio cubre un
# `.local` borrado, que ya no deja fichero que comparar: crear, borrar o
# renombrar una entrada cambia el ctime del directorio. No cubre los
# certificados que la configuracion nombre en cert_path, key_path o
# ca_cert_path, ni un reloj que retroceda por debajo de ese arranque. En un
# host convergido no se ejecuta y no desmonta nada.
- name: Inspect the CrowdSec bouncer files the running instance loaded
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: false
  loop:
    - path: "{{ host_security_crowdsec_bouncer_config }}"
      type: file
      required: true
    - path: "{{ host_security_crowdsec_bouncer_config }}.local"
      type: file
      required: false
    - path: "{{ host_security_crowdsec_bouncer_config | dirname }}"
      type: directory
      required: true
    - path: /usr/bin/crowdsec-firewall-bouncer
      type: file
      required: true
  loop_control:
    label: "{{ item.path }}"
  register: host_security_crowdsec_bouncer_files

- name: Read when the running CrowdSec bouncer started
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - --timestamp=us+utc
      - --property=ExecMainStartTimestamp
      - --value
      - crowdsec-firewall-bouncer.service
  environment:
    LC_ALL: C
  register: host_security_crowdsec_bouncer_start
  changed_when: false
  check_mode: false

- name: Detect CrowdSec bouncer files the running instance never validated
  ansible.builtin.set_fact:
    host_security_crowdsec_bouncer_unvalidated: >-
      {{
        host_security_crowdsec_bouncer_start.stdout
        is not match(host_security_crowdsec_bouncer_start_format)
        or host_security_crowdsec_bouncer_files.results
        | selectattr("item.required")
        | rejectattr("stat.exists")
        | list | length > 0
        or host_security_crowdsec_bouncer_files.results
        | selectattr("stat.exists")
        | selectattr("item.type", "equalto", "file")
        | rejectattr("stat.isreg")
        | list | length > 0
        or host_security_crowdsec_bouncer_files.results
        | selectattr("stat.exists")
        | selectattr("item.type", "equalto", "directory")
        | rejectattr("stat.isdir")
        | list | length > 0
        or host_security_crowdsec_bouncer_files.results
        | selectattr("stat.exists")
        | map(attribute="stat.ctime")
        | select("ge", host_security_crowdsec_bouncer_started_at)
        | list | length > 0
      }}
  vars:
    host_security_crowdsec_bouncer_start_format: >-
      ^\w{3} \d{4}-\d\d-\d\d \d\d:\d\d:\d\d[.]\d{6} UTC$
    host_security_crowdsec_bouncer_started_at: >-
      {{
        (
          (
            host_security_crowdsec_bouncer_start.stdout[4:-4]
            | to_datetime("%Y-%m-%d %H:%M:%S.%f")
          )
          - ("1970-01-01 00:00:00" | to_datetime)
        ).total_seconds()
      }}

# `failed_when: false`: un `-t` que falla despues de arrancar el backend ya ha
# retirado las cadenas (cmd/root.go ejecuta backend.Init y aplaza su limpieza
# antes de ConfigReader y bouncer.Init, que rechazan por ejemplo un api_key
# vacio), y parar aqui las dejaria retiradas sin intentar reponerlas. Las
# tareas siguientes reinician el bouncer si falta su gancho de INPUT, y el
# resultado se exige al final, en "Require a passing CrowdSec bouncer test".
# Ese reinicio no siempre repone las cadenas: systemd ejecuta el mismo `-t`
# sobre este mismo fichero antes de cada arranque (ExecStartPre), de modo que
# si el fichero fallo despues de arrancar el backend el reinicio falla igual,
# CrowdSec queda sin filtrar hasta que se corrija y el apply se detiene en
# "Require the restored CrowdSec bouncer to start". Una configuracion que se
# rechaza antes de arrancar el backend (YAML invalido, sin `mode`) deja las
# cadenas intactas.
- name: Validate the credential-bearing CrowdSec bouncer
  ansible.builtin.command:
    argv:
      - /usr/bin/crowdsec-firewall-bouncer
      - -c
      - "{{ host_security_crowdsec_bouncer_config }}"
      - -t
  register: host_security_crowdsec_bouncer_test
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - not ansible_check_mode
    - >-
      host_security_package_install is changed
      or host_security_crowdsec_bouncer_unvalidated

# Red de seguridad, haya corrido o no la prueba anterior y haya pasado o no:
# si INPUT no salta a CROWDSEC_CHAIN en alguna de las dos familias, por la
# prueba o por cualquier otra causa, se reinicia el bouncer y se espera a que
# vuelva. Se exige la regla exacta que inserta el bouncer (setupChain en
# pkg/iptables/iptables_context.go), no solo el nombre de la cadena: una
# `-N CROWDSEC_CHAIN` vaciada que no se pudo borrar, o el salto de
# DOCKER-USER que repone el script de ordenacion de host_baseline, contienen
# el nombre aunque INPUT ya no filtre. En un host convergido la regla esta en
# ambas familias y el reinicio se omite.
- name: Read the live CrowdSec IPv4 firewall enforcement
  ansible.builtin.command:
    argv:
      - /usr/sbin/iptables
      - -w
      - -S
  register: host_security_crowdsec_chain_ipv4
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Read the live CrowdSec IPv6 firewall enforcement
  ansible.builtin.command:
    argv:
      - /usr/sbin/ip6tables
      - -w
      - -S
  register: host_security_crowdsec_chain_ipv6
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

# `ignore_errors` con `register` solo para que un reinicio fallido se explique
# en la tarea siguiente, que detiene el apply igual que antes.
- name: Restore CrowdSec enforcement when its INPUT hook is missing
  ansible.builtin.systemd_service:
    name: crowdsec-firewall-bouncer
    state: restarted
  register: host_security_crowdsec_bouncer_restore
  ignore_errors: true
  when:
    - not ansible_check_mode
    - >-
      "-A INPUT -j CROWDSEC_CHAIN"
      not in host_security_crowdsec_chain_ipv4.stdout_lines
      or "-A INPUT -j CROWDSEC_CHAIN"
      not in host_security_crowdsec_chain_ipv6.stdout_lines

- name: Require the restored CrowdSec bouncer to start
  ansible.builtin.assert:
    that:
      - host_security_crowdsec_bouncer_restore is not failed
    fail_msg: >-
      Restarting crowdsec-firewall-bouncer to restore its INPUT hook failed,
      so CrowdSec is not filtering. systemd runs crowdsec-firewall-bouncer -t
      on the on-disk configuration before every start (ExecStartPre). If that
      configuration failed the bouncer test of this apply after the backend
      started, the test removed CROWDSEC_CHAIN and every start fails the same
      way: CrowdSec stays down until the configuration is fixed, and the
      packaged unit keeps retrying the start (Restart=always).
    quiet: true

- name: Re-read the live CrowdSec IPv4 firewall enforcement
  ansible.builtin.command:
    argv:
      - /usr/sbin/iptables
      - -w
      - -S
  register: host_security_crowdsec_chain_ipv4_final
  changed_when: false
  check_mode: false
  retries: 12
  delay: 5
  until: >-
    "-A INPUT -j CROWDSEC_CHAIN"
    in host_security_crowdsec_chain_ipv4_final.stdout_lines
  when: not ansible_check_mode

- name: Re-read the live CrowdSec IPv6 firewall enforcement
  ansible.builtin.command:
    argv:
      - /usr/sbin/ip6tables
      - -w
      - -S
  register: host_security_crowdsec_chain_ipv6_final
  changed_when: false
  check_mode: false
  retries: 12
  delay: 5
  until: >-
    "-A INPUT -j CROWDSEC_CHAIN"
    in host_security_crowdsec_chain_ipv6_final.stdout_lines
  when: not ansible_check_mode

- name: Verify CrowdSec is enforcing on both address families
  ansible.builtin.assert:
    that:
      - >-
        "-A INPUT -j CROWDSEC_CHAIN"
        in host_security_crowdsec_chain_ipv4_final.stdout_lines
      - >-
        "-A INPUT -j CROWDSEC_CHAIN"
        in host_security_crowdsec_chain_ipv6_final.stdout_lines
    fail_msg: >-
      CrowdSec is not filtering: INPUT does not jump to CROWDSEC_CHAIN in the
      live iptables or ip6tables ruleset even after restarting the bouncer.
    quiet: true
  when: not ansible_check_mode

- name: Require a passing CrowdSec bouncer test
  ansible.builtin.assert:
    that:
      - >-
        host_security_crowdsec_bouncer_test is skipped
        or host_security_crowdsec_bouncer_test.rc == 0
    fail_msg: >-
      crowdsec-firewall-bouncer -t rejected the bouncer configuration or
      binary. INPUT jumps to CROWDSEC_CHAIN in both families (checked
      above), but the bouncer's next start runs the same test and would fail:
      fix the configuration before it.
    quiet: true

- name: Verify Fail2ban and its SSH jail
  ansible.builtin.command:
    argv:
      - /usr/bin/fail2ban-client
      - status
      - sshd
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Verify PSAD runtime
  ansible.builtin.command:
    argv:
      - /usr/sbin/psad
      - --Status
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Wait for Chrony synchronization
  ansible.builtin.command:
    argv:
      - /usr/bin/timedatectl
      - show
      - --property=NTPSynchronized
      - --value
  register: host_security_time_synchronized
  changed_when: false
  check_mode: false
  until: host_security_time_synchronized.stdout in ["yes", "true"]
  retries: 18
  delay: 10
  when: not ansible_check_mode

- name: Pin the reviewed /proc mount options in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*proc\s+/proc\s+proc\s'
    line: "proc /proc proc {{ host_security_proc_mount_options }} 0 0"
    owner: root
    group: root
    mode: "0644"
    backup: true

- name: Read the effective /proc mount options
  ansible.builtin.command:
    argv:
      - /usr/bin/awk
      - '$2 == "/proc" { print $4 }'
      - /proc/mounts
  register: host_security_proc_observed
  changed_when: false
  check_mode: false

- name: Restore the reviewed /proc hardening when it drifts
  ansible.builtin.command:
    argv:
      - /usr/bin/mount
      - -o
      - "remount,{{ host_security_proc_mount_options }}"
      - /proc
  when:
    - not ansible_check_mode
    - >-
      host_security_proc_required_options
      | difference(host_security_proc_observed.stdout | trim | split(","))
      | length > 0
  register: host_security_proc_remounted
  changed_when: host_security_proc_remounted.rc == 0

- name: Re-read the effective /proc mount options
  ansible.builtin.command:
    argv:
      - /usr/bin/awk
      - '$2 == "/proc" { print $4 }'
      - /proc/mounts
  register: host_security_proc_verified
  changed_when: false
  check_mode: false

- name: Verify the effective /proc hardening
  ansible.builtin.assert:
    that:
      - >-
        host_security_proc_required_options
        | difference(
          host_security_proc_verified.stdout | trim | split(",")
        )
        | length == 0
    fail_msg: >-
      /proc is mounted as
      "{{ host_security_proc_verified.stdout | trim }}", which lacks
      {{
        host_security_proc_required_options
        | difference(host_security_proc_verified.stdout | trim | split(","))
        | join(", ")
      }}.
    quiet: true
  when: not ansible_check_mode

- name: Apply the requested lockout-safe SSH bootstrap phase
  ansible.builtin.import_tasks: ssh.yml
  when: host_security_ssh_phase != "none"
