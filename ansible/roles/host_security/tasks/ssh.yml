---
- name: Verify the requested SSH bootstrap phase
  ansible.builtin.assert:
    that:
      - host_security_ssh_phase in ["staged", "final"]
      - >-
        host_security_ssh_phase != "final"
        or host_security_ssh_confirmation_nonce
        is match("^[a-f0-9]{40}$")
    fail_msg: "SSH bootstrap requires a valid staged or final phase."
    quiet: true

- name: Select the canonical SSH bootstrap template
  ansible.builtin.set_fact:
    host_security_ssh_template: >-
      {{
        "ssh-bootstrap-staged.conf.j2"
        if host_security_ssh_phase == "staged"
        else "ssh-hardening.conf.j2"
      }}

- name: Read supported OpenSSH key exchanges
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh
      - -Q
      - KexAlgorithms
  register: host_security_supported_kex
  changed_when: false
  check_mode: false

- name: Verify every managed key exchange is available
  ansible.builtin.assert:
    that:
      - >-
        (
          host_security_ssh_pq_kex_algorithms
          + host_security_ssh_classical_kex_algorithms
        )
        | difference(host_security_supported_kex.stdout_lines)
        | length == 0
      - >-
        host_security_ssh_pq_kex_algorithms[0]
        == "mlkem768x25519-sha256"
    fail_msg: "The OpenSSH build lacks a reviewed key exchange."
    quiet: true

- name: Read supported OpenSSH algorithm classes
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh
      - -Q
      - "{{ item.query }}"
  loop:
    - query: cipher
      expected: "{{ host_security_ssh_ciphers }}"
    - query: mac
      expected: "{{ host_security_ssh_macs }}"
    - query: HostKeyAlgorithms
      expected: "{{ host_security_ssh_host_key_algorithms }}"
    - query: PubkeyAcceptedAlgorithms
      expected: "{{ host_security_ssh_pubkey_algorithms }}"
  loop_control:
    label: "{{ item.query }}"
  register: host_security_supported_algorithm_classes
  changed_when: false
  check_mode: false

- name: Verify every deterministic SSH algorithm is available
  ansible.builtin.assert:
    that:
      - item.item.expected | difference(item.stdout_lines) | length == 0
    fail_msg: >-
      OpenSSH does not implement the complete reviewed
      {{ item.item.query }} policy.
    quiet: true
  loop: "{{ host_security_supported_algorithm_classes.results }}"
  loop_control:
    label: "{{ item.item.query }}"

- name: Render and validate the OpenSSH candidate in memory
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
      - -f
      - /dev/stdin
    stdin: >-
      {{
        lookup(
          "ansible.builtin.template",
          playbook_dir + "/../templates/" + host_security_ssh_template
        )
      }}
    stdin_add_newline: true
  changed_when: false
  check_mode: false

- name: Derive the exact staged SSH rollback identity
  ansible.builtin.set_fact:
    host_security_expected_staged_ssh_sha256: >-
      {{
        lookup(
          "ansible.builtin.template",
          playbook_dir + "/../templates/ssh-bootstrap-staged.conf.j2"
        ) | hash("sha256")
      }}

- name: Prepare automatic rollback before disabling root SSH
  when: host_security_ssh_phase == "final"
  block:
    - name: Inspect the proven staged SSH policy
      ansible.builtin.stat:
        path: "{{ host_security_ssh_staged_config }}"
        follow: false
        checksum_algorithm: sha256
      register: host_security_staged_ssh_state

    - name: Verify the proven staged SSH policy is recoverable
      ansible.builtin.assert:
        that:
          - host_security_staged_ssh_state.stat.exists
          - host_security_staged_ssh_state.stat.isreg
          - not host_security_staged_ssh_state.stat.islnk
          - host_security_staged_ssh_state.stat.pw_name == "root"
          - host_security_staged_ssh_state.stat.gr_name == "root"
          - host_security_staged_ssh_state.stat.mode == "0600"
          - host_security_staged_ssh_state.stat.nlink | int == 1
          - >-
            host_security_staged_ssh_state.stat.checksum
            == host_security_expected_staged_ssh_sha256
        fail_msg: "The independently proven staged SSH policy is absent."
        quiet: true

    - name: Parse the exact staged SSH rollback policy before arming it
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
          - -f
          - "{{ host_security_ssh_staged_config }}"
      changed_when: false
      check_mode: false

    - name: Create the one-shot admin confirmation directory
      ansible.builtin.file:
        path: "{{ host_security_ssh_confirmation_directory }}"
        state: directory
        owner: "{{ host_security_admin_user }}"
        group: "{{ host_security_admin_user }}"
        mode: "0700"

    - name: Remove any stale SSH confirmation
      ansible.builtin.file:
        path: "{{ host_security_ssh_confirmation_directory }}/confirmed"
        state: absent

    - name: Install the SSH rollback helper
      ansible.builtin.template:
        src: bootstrap-ssh-rollback.sh.j2
        dest: "{{ host_security_ssh_rollback_helper }}"
        owner: root
        group: root
        mode: "0700"

    - name: Install the SSH rollback service
      ansible.builtin.template:
        src: bootstrap-ssh-rollback.service.j2
        dest: >-
          /etc/systemd/system/dockerswarm-bootstrap-ssh-rollback.service
        owner: root
        group: root
        mode: "0644"

    - name: Install the SSH rollback timer
      ansible.builtin.template:
        src: bootstrap-ssh-rollback.timer.j2
        dest: >-
          /etc/systemd/system/dockerswarm-bootstrap-ssh-rollback.timer
        owner: root
        group: root
        mode: "0644"

    - name: Install the immediate SSH confirmation watcher
      ansible.builtin.template:
        src: bootstrap-ssh-rollback.path.j2
        dest: >-
          /etc/systemd/system/dockerswarm-bootstrap-ssh-rollback.path
        owner: root
        group: root
        mode: "0644"

    - name: Verify the SSH rollback units
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-analyze
          - --recursive-errors=no
          - verify
          - >-
            /etc/systemd/system/dockerswarm-bootstrap-ssh-rollback.service
          - >-
            /etc/systemd/system/dockerswarm-bootstrap-ssh-rollback.timer
          - >-
            /etc/systemd/system/dockerswarm-bootstrap-ssh-rollback.path
      changed_when: false
      check_mode: false

    - name: Arm the immediate SSH confirmation watcher
      ansible.builtin.systemd_service:
        name: dockerswarm-bootstrap-ssh-rollback.path
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Arm the persistent SSH rollback timer
      ansible.builtin.systemd_service:
        name: dockerswarm-bootstrap-ssh-rollback.timer
        enabled: true
        state: restarted
        daemon_reload: true

- name: Install the validated complete SSH bootstrap policy
  ansible.builtin.copy:
    content: >-
      {{
        lookup(
          "ansible.builtin.template",
          playbook_dir + "/../templates/" + host_security_ssh_template
        )
      }}
    dest: "{{ host_security_sshd_config }}"
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload bootstrap OpenSSH

- name: Remove the superseded managed SSH drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/00-dockerswarm-hardening.conf
    state: absent

- name: Preserve the independently testable staged SSH policy
  ansible.builtin.copy:
    content: >-
      {{
        lookup(
          "ansible.builtin.template",
          playbook_dir + "/../templates/ssh-bootstrap-staged.conf.j2"
        )
      }}
    dest: "{{ host_security_ssh_staged_config }}"
    owner: root
    group: root
    mode: "0600"
  when: host_security_ssh_phase == "staged"

- name: Validate the complete OpenSSH configuration
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
      - -f
      - "{{ host_security_sshd_config }}"
  changed_when: false
  check_mode: false

- name: Apply the validated OpenSSH reload
  ansible.builtin.meta: flush_handlers

- name: Read the effective complete OpenSSH policy
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
      - -f
      - "{{ host_security_sshd_config }}"
  register: host_security_effective_sshd
  changed_when: false
  check_mode: false

- name: Enforce deterministic OpenSSH security invariants
  ansible.builtin.assert:
    that:
      - >-
        (
          host_security_effective_sshd.stdout_lines
          | select("match", "^kexalgorithms ")
          | first
        ).split(" ", 1)[1].split(",")
        == (
          host_security_ssh_pq_kex_algorithms
          + host_security_ssh_classical_kex_algorithms
        )
      - >-
        (
          host_security_effective_sshd.stdout_lines
          | select("match", "^ciphers ")
          | first
        ).split(" ", 1)[1].split(",") == host_security_ssh_ciphers
      - >-
        (
          host_security_effective_sshd.stdout_lines
          | select("match", "^macs ")
          | first
        ).split(" ", 1)[1].split(",") == host_security_ssh_macs
      - >-
        (
          host_security_effective_sshd.stdout_lines
          | select("match", "^hostkeyalgorithms ")
          | first
        ).split(" ", 1)[1].split(",")
        == host_security_ssh_host_key_algorithms
      - >-
        (
          host_security_effective_sshd.stdout_lines
          | select("match", "^pubkeyacceptedalgorithms ")
          | first
        ).split(" ", 1)[1].split(",")
        == host_security_ssh_pubkey_algorithms
      - >-
        "passwordauthentication no"
        in host_security_effective_sshd.stdout_lines
      - >-
        "kbdinteractiveauthentication no"
        in host_security_effective_sshd.stdout_lines
      - >-
        "authenticationmethods publickey"
        in host_security_effective_sshd.stdout_lines
      - '"disableforwarding yes" in host_security_effective_sshd.stdout_lines'
      - '"usedns no" in host_security_effective_sshd.stdout_lines'
      - '"compression no" in host_security_effective_sshd.stdout_lines'
      - '"tcpkeepalive no" in host_security_effective_sshd.stdout_lines'
      - '"permituserrc no" in host_security_effective_sshd.stdout_lines'
      - >-
        (
          host_security_ssh_phase == "staged"
          and "permitrootlogin without-password"
            in host_security_effective_sshd.stdout_lines
          and "allowusers root " ~ host_security_admin_user
            in host_security_effective_sshd.stdout_lines
        )
        or (
          host_security_ssh_phase == "final"
          and "permitrootlogin no"
            in host_security_effective_sshd.stdout_lines
          and "allowusers " ~ host_security_admin_user
            in host_security_effective_sshd.stdout_lines
        )
    fail_msg: "The effective complete OpenSSH policy differs from Git."
    quiet: true
