---
# Apply only, after images.yml: a stopped node starts only once the local
# registry serves every pinned image. One that `kind create cluster` has just
# created already runs, but nothing in it pulls a Substrate image before
# ate-setup. With restart policy "no" nothing else starts it after a host or
# Docker restart. Then, only where they differ,
# the settings inside the node, which a restart resets or which kind's local
# registry guide adds.
- name: Start the lab node when it is stopped
  ansible.builtin.command:
    argv: [/usr/bin/docker, start, "{{ ax_lab.cluster.node_container }}"]
  when: ax_lab_node.status in ["created", "exited"]
  changed_when: true

- name: Read the lab registry and node after starting the node
  ansible.builtin.import_tasks: read.yml

- name: Verify the lab node runs with its reviewed limits
  ansible.builtin.assert:
    that:
      - ax_lab_node is not none
      - ax_lab_node.status == "running"
      - ax_lab_limits_drift == []
    fail_msg: >-
      {{ ax_lab.cluster.node_container }} does not run with its reviewed
      limits and restart policy after the apply.

- name: Inspect the lab kubeconfig without following links
  ansible.builtin.stat:
    path: "{{ ax_lab_kubeconfig_path }}"
    follow: false
    get_checksum: false
  register: ax_lab_kubeconfig_before

- name: Export the lab kubeconfig only when it is missing
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kind"
      - export
      - kubeconfig
      - --name
      - "{{ ax_lab.cluster.name }}"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
  environment:
    HOME: "{{ ax_lab_home_directory }}"
    KUBECONFIG: "{{ ax_lab_kubeconfig_path }}"
  when: not ax_lab_kubeconfig_before.stat.exists
  changed_when: true

- name: Inspect the lab kubeconfig after the export
  ansible.builtin.stat:
    path: "{{ ax_lab_kubeconfig_path }}"
    follow: false
    get_checksum: false
  register: ax_lab_kubeconfig

- name: Require a root-only regular lab kubeconfig
  ansible.builtin.assert:
    that:
      - ax_lab_kubeconfig.stat.exists
      - ax_lab_kubeconfig.stat.isreg
      - not ax_lab_kubeconfig.stat.islnk
      - ax_lab_kubeconfig.stat.uid == 0
      - ax_lab_kubeconfig.stat.gid == 0
      - ax_lab_kubeconfig.stat.mode == "0600"
    fail_msg: >-
      {{ ax_lab_kubeconfig_path }} is not a root:root 0600 regular file.

# Every kubectl call runs with the lab's HOME, so its discovery and HTTP
# cache stay in /opt/dockerswarm/ax-lab/home/.kube/cache and never in /root,
# and gives up on a request after 10 seconds instead of kubectl's default of
# never, so that the retries bound each wait.
- name: Wait for the lab API server on its loopback endpoint
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kubectl"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
      - --context
      - "kind-{{ ax_lab.cluster.name }}"
      - --request-timeout
      - 10s
      - get
      - --raw
      - /readyz
  environment:
    HOME: "{{ ax_lab_home_directory }}"
  register: ax_lab_readyz
  until: ax_lab_readyz.rc == 0 and ax_lab_readyz.stdout == "ok"
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for the lab node to report Ready
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kubectl"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
      - --context
      - "kind-{{ ax_lab.cluster.name }}"
      - --request-timeout
      - 10s
      - get
      - node
      - "{{ ax_lab.cluster.node_container }}"
      - --output
      - jsonpath={.status.conditions[?(@.type=="Ready")].status}
  environment:
    HOME: "{{ ax_lab_home_directory }}"
  register: ax_lab_node_ready
  until: ax_lab_node_ready.rc == 0 and ax_lab_node_ready.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false

# Substrate enables proxy ARP and proxy NDP on every kind node for gVisor's
# loopback pod-to-pod networking (hack/create-kind-cluster.sh, lines 174-182
# at the pinned commit), unconditionally: "nodes of either family carry the
# other's addresses on the Docker bridge", and the kind network is
# dual-stack. Both live in the node's network namespace, so every node
# restart resets them. proxy_ndp is set with `-e`, as Substrate does, and
# read with it too: on a kernel without IPv6 the run then stops at its
# verification, which requires 1, with a clear message.
- name: Read proxy_arp inside the lab node
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/sbin/sysctl
      - -n
      - net.ipv4.conf.all.proxy_arp
  register: ax_lab_proxy_arp_before
  changed_when: false

- name: Enable proxy_arp inside the lab node only when it is off
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/sbin/sysctl
      - -w
      - net.ipv4.conf.all.proxy_arp=1
  when: ax_lab_proxy_arp_before.stdout != "1"
  changed_when: true

- name: Read proxy_arp inside the lab node after convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/sbin/sysctl
      - -n
      - net.ipv4.conf.all.proxy_arp
  register: ax_lab_proxy_arp
  changed_when: false

- name: Verify proxy_arp inside the lab node
  ansible.builtin.assert:
    that:
      - ax_lab_proxy_arp.stdout == "1"
    fail_msg: >-
      net.ipv4.conf.all.proxy_arp is {{ ax_lab_proxy_arp.stdout }} inside
      {{ ax_lab.cluster.node_container }}, expected 1.

- name: Read proxy_ndp inside the lab node
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/sbin/sysctl
      - -n
      - -e
      - net.ipv6.conf.all.proxy_ndp
  register: ax_lab_proxy_ndp_before
  changed_when: false

- name: Enable proxy_ndp inside the lab node only when it is off
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/sbin/sysctl
      - -e
      - -w
      - net.ipv6.conf.all.proxy_ndp=1
  when: ax_lab_proxy_ndp_before.stdout != "1"
  changed_when: true

- name: Read proxy_ndp inside the lab node after convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/sbin/sysctl
      - -n
      - -e
      - net.ipv6.conf.all.proxy_ndp
  register: ax_lab_proxy_ndp
  changed_when: false

- name: Verify proxy_ndp inside the lab node
  ansible.builtin.assert:
    that:
      - ax_lab_proxy_ndp.stdout == "1"
    fail_msg: >-
      net.ipv6.conf.all.proxy_ndp is {{ ax_lab_proxy_ndp.stdout }} inside
      {{ ax_lab.cluster.node_container }}, expected 1.

# kind's local registry guide, step 3: containerd resolves
# localhost:<host port> to the registry container through this hosts.toml
# (kind-with-registry.sh, lines 46-60 at v0.33.0). The file lives in the
# node's writable layer and survives restarts.
- name: Read the registry mirror configuration inside the lab node
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/bin/cat
      - "{{ ax_lab_registry_hosts_directory }}/hosts.toml"
  register: ax_lab_registry_mirror_before
  changed_when: false
  failed_when:
    - ax_lab_registry_mirror_before.rc != 0
    - >-
      "No such file or directory" not in ax_lab_registry_mirror_before.stderr

- name: Create the registry mirror directory inside the lab node
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/bin/mkdir
      - -p
      - "{{ ax_lab_registry_hosts_directory }}"
  when: ax_lab_registry_mirror_before.stdout != ax_lab_registry_mirror
  changed_when: true

- name: Write the registry mirror configuration inside the lab node
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - --interactive
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/bin/cp
      - /dev/stdin
      - "{{ ax_lab_registry_hosts_directory }}/hosts.toml"
    stdin: "{{ ax_lab_registry_mirror }}"
  when: ax_lab_registry_mirror_before.stdout != ax_lab_registry_mirror
  changed_when: true

- name: Read the registry mirror configuration after convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/bin/cat
      - "{{ ax_lab_registry_hosts_directory }}/hosts.toml"
  register: ax_lab_registry_mirror_file
  changed_when: false

- name: Verify the registry mirror configuration inside the lab node
  ansible.builtin.assert:
    that:
      - ax_lab_registry_mirror_file.stdout == ax_lab_registry_mirror
    fail_msg: >-
      {{ ax_lab_registry_hosts_directory }}/hosts.toml inside the node does
      not point localhost:{{ ax_lab.registry.host_port }} at the registry.

# kind's local registry guide, step 5: the ConfigMap of KEP-1755 that tells
# tools where the local registry is. Applied server-side, only when it
# differs.
- name: Read the local registry hosting ConfigMap
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kubectl"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
      - --context
      - "kind-{{ ax_lab.cluster.name }}"
      - --request-timeout
      - 10s
      - get
      - configmap
      - local-registry-hosting
      - --namespace
      - kube-public
      - --ignore-not-found
      - --output
      - json
  environment:
    HOME: "{{ ax_lab_home_directory }}"
  register: ax_lab_registry_hosting_before
  changed_when: false

- name: Apply the local registry hosting ConfigMap only when it differs
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kubectl"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
      - --context
      - "kind-{{ ax_lab.cluster.name }}"
      - --request-timeout
      - 10s
      - apply
      - --server-side
      - --field-manager
      - ax-lab
      - --filename
      - "-"
    stdin: >-
      {{
        {
          "apiVersion": "v1",
          "kind": "ConfigMap",
          "metadata": {
            "name": "local-registry-hosting",
            "namespace": "kube-public"
          },
          "data": ax_lab_registry_hosting_data
        } | to_json
      }}
  environment:
    HOME: "{{ ax_lab_home_directory }}"
  when: >-
    ax_lab_registry_hosting_before.stdout | length == 0
    or (ax_lab_registry_hosting_before.stdout | from_json).data
    | default({}, true) != ax_lab_registry_hosting_data
  changed_when: true

- name: Read the local registry hosting ConfigMap after convergence
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kubectl"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
      - --context
      - "kind-{{ ax_lab.cluster.name }}"
      - --request-timeout
      - 10s
      - get
      - configmap
      - local-registry-hosting
      - --namespace
      - kube-public
      - --output
      - json
  environment:
    HOME: "{{ ax_lab_home_directory }}"
  register: ax_lab_registry_hosting
  changed_when: false

- name: Verify the local registry hosting ConfigMap
  ansible.builtin.assert:
    that:
      - >-
        (ax_lab_registry_hosting.stdout | from_json).data
        == ax_lab_registry_hosting_data
    fail_msg: >-
      kube-public/local-registry-hosting does not document
      localhost:{{ ax_lab.registry.host_port }}.
