---
- name: Reject overrides of the reviewed AX lab contract
  ansible.builtin.assert:
    that:
      - >-
        ax_lab == (
          lookup('ansible.builtin.file',
            role_path + '/../../../config/ax-lab.yml')
          | from_yaml
        ).ax_lab
      - ax_lab_privileged_node_accepted is boolean
      - >-
        ax_lab_privileged_node_accepted == (
          lookup('ansible.builtin.file',
            role_path + '/../../../config/ax-lab.yml')
          | from_yaml
        ).ax_lab_privileged_node_accepted
      - ax_lab_sysctl_path == "/etc/sysctl.d/99-z-dockerswarm-ax-lab.conf"
      - ax_lab_bin_directory == ax_lab.install_root ~ "/bin"
      - ax_lab_architecture == "x86_64"
      - ax_lab_kind_config_path == ax_lab.install_root ~ "/kind-config.yaml"
      - ax_lab_state_directory == ax_lab.install_root ~ "/state"
      - ax_lab_cluster_state_path == ax_lab_state_directory ~ "/cluster.json"
      - ax_lab_home_directory == ax_lab.install_root ~ "/home"
      - ax_lab_kubeconfig_path == ax_lab_home_directory ~ "/.kube/config"
      - >-
        ax_lab_substrate_fallback_builds == (
          lookup('ansible.builtin.file',
            role_path + '/../../../config/ax-lab.yml')
          | from_yaml
        ).ax_lab_substrate_fallback_builds
      - >-
        ax_lab_substrate_source_path == ax_lab.install_root ~ "/src/substrate"
      - ax_lab_cache_directory == ax_lab.install_root ~ "/cache"
      - >-
        ax_lab_substrate_state_path
        == ax_lab_state_directory ~ "/substrate.json"
      - >-
        ax_lab_substrate_manager
        == ax_lab_bin_directory ~ "/manage-ax-lab-substrate.py"
      - ax_lab_ax_cli == ax_lab_bin_directory ~ "/ax"
      - ax_lab_ax_state_path == ax_lab_state_directory ~ "/ax.json"
      - ax_lab_ax_helper_directory == "/usr/local/sbin"
      - ax_lab_ax_runtime_directory == "/run"
      - ax_lab_ax_lock_directory == "/run/lock"
      - ax_lab_web_state_path == ax_lab_state_directory ~ "/web.json"
      - ax_lab_examples_directory == ax_lab.install_root ~ "/ejemplos"
    fail_msg: AX lab inputs differ from the versioned contract.

- name: Validate the AX lab contract and its sysctl render locally
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../../scripts/validate-ax-lab.py"
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false

# The validator renders the role's kind-config.yaml.j2 exactly as the
# template module does. Its digest is what the ownership proof records, and
# the file rendered on the host must hash to it.
- name: Compute the digest of the reviewed kind configuration locally
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../../scripts/validate-ax-lab.py"
      - --kind-config-sha256
  register: ax_lab_kind_config_digest
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false

- name: Require a sha256 digest of the reviewed kind configuration
  ansible.builtin.assert:
    that:
      - ax_lab_kind_config_digest.stdout is match("^[a-f0-9]{64}$")
    fail_msg: The validator did not print the kind configuration digest.

# The same for the AX manifests: what the role applies must be what the
# validator rendered and checked.
- name: Compute the digests of the reviewed AX manifests locally
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../../scripts/validate-ax-lab.py"
      - --ax-manifests-sha256
  register: ax_lab_ax_manifests_digest
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false

- name: Render the AX manifests the role applies
  ansible.builtin.set_fact:
    ax_lab_ax_manifests:
      ax-system.yaml: >-
        {{
          lookup(
            "ansible.builtin.template",
            role_path ~ "/templates/ax/ax-system.yaml.j2"
          )
        }}
      ax-workers.yaml: >-
        {{
          lookup(
            "ansible.builtin.template",
            role_path ~ "/templates/ax/ax-workers.yaml.j2"
          )
        }}

- name: Require the AX manifests the validator checked
  ansible.builtin.assert:
    that:
      - >-
        dict(
          ax_lab_ax_manifests | dict2items | map(attribute="key")
          | zip(
            ax_lab_ax_manifests | dict2items | map(attribute="value")
            | map("hash", "sha256")
          )
        )
        == ax_lab_ax_manifests_digest.stdout | from_json
    fail_msg: >-
      The AX manifests Ansible renders differ from those the validator
      checked.

# The same for the web panel manifest (docs/AX_WEB.md).
- name: Compute the digest of the reviewed web panel manifest locally
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../../scripts/validate-ax-lab.py"
      - --web-manifest-sha256
  register: ax_lab_web_manifest_digest
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false

- name: Render the web panel manifest the role applies
  ansible.builtin.set_fact:
    ax_lab_web_manifest: >-
      {{
        lookup(
          "ansible.builtin.template",
          role_path ~ "/templates/ax-web.yaml.j2"
        )
      }}

- name: Require the web panel manifest the validator checked
  ansible.builtin.assert:
    that:
      - ax_lab_web_manifest_digest.stdout is match("^[a-f0-9]{64}$")
      - >-
        ax_lab_web_manifest | hash("sha256")
        == ax_lab_web_manifest_digest.stdout
    fail_msg: >-
      The web panel manifest Ansible renders differs from the one the
      validator checked.

# What the web state file records and the forwarder runs: the image by its
# pinned digest, and the argv the panel's forward subcommand takes.
- name: Derive the pinned web panel image and install identity
  ansible.builtin.set_fact:
    ax_lab_web_image_args:
      - "--image={{ ax_lab.web.image.name }}={{ ax_lab.web.image.digest }}"
    ax_lab_web_forwarder_image: >-
      localhost:{{ ax_lab.registry.host_port }}/{{ ax_lab.web.image.name
      }}@{{ ax_lab.web.image.digest }}
    ax_lab_web_forwarder_command:
      - forward
      - --listen
      - ":{{ ax_lab.web.forwarder.port }}"
      - --target
      - "{{ ax_lab.cluster.node_container }}:{{ ax_lab.web.node_port }}"
      - --allow-cidr
      - "{{ ax_lab.web.forwarder.edge_subnet }}"
    ax_lab_web_identity:
      schema_version: 1
      image: "{{ ax_lab.web.image.digest }}"
      manifest_sha256: "{{ ax_lab_web_manifest_digest.stdout }}"

# What the AX state file records and compares: any difference reapplies.
- name: Derive the pinned AX image arguments and install identity
  ansible.builtin.set_fact:
    ax_lab_ax_image_args: >-
      {{
        ax_lab.ax.images | dict2items | map(attribute="key")
        | zip(ax_lab.ax.images | dict2items | map(attribute="value"))
        | map("join", "=") | map("regex_replace", "^", "--image=") | list
      }}
    ax_lab_ax_identity:
      schema_version: 1
      tag: "{{ ax_lab.ax.tag }}"
      images: "{{ ax_lab.ax.images }}"
      manifests_sha256: "{{ ax_lab_ax_manifests_digest.stdout | from_json }}"

# The validator accepts ate-setup's digest as pending until the
# reproducibility workflow prints it; nothing runs until it is pinned.
- name: Refuse to run while a Substrate image pin is pending
  ansible.builtin.assert:
    that:
      - >-
        ax_lab.substrate.images | dict2items
        | selectattr("value", "none") | list == []
    fail_msg: >-
      A Substrate image of config/ax-lab.yml has no pinned digest yet. Pin it
      from the ax-lab-reproducibility workflow in a reviewed change before
      any check or apply (docs/AX.md, «Reproducibilidad»).

# The installed images are those the reviewed workloads run; ate-setup is
# the installer. The identity is what the Substrate state file records, and
# any difference in it reinstalls.
- name: Derive the pinned Substrate arguments and install identity
  ansible.builtin.set_fact:
    ax_lab_substrate_installed: >-
      {{
        ax_lab.substrate.workloads | map(attribute="images") | flatten
        | select("in", ax_lab.substrate.images) | unique | sort
      }}
    ax_lab_substrate_image_args: >-
      {{
        ax_lab.substrate.images | dict2items | map(attribute="key")
        | zip(ax_lab.substrate.images | dict2items | map(attribute="value"))
        | map("join", "=") | map("regex_replace", "^", "--image=") | list
      }}

- name: Derive the installed Substrate image arguments and identity
  ansible.builtin.set_fact:
    ax_lab_substrate_installed_args: >-
      {{
        ax_lab_substrate_installed
        | zip(
          ax_lab_substrate_installed
          | map("extract", ax_lab.substrate.images)
        )
        | map("join", "=") | map("regex_replace", "^", "--image=") | list
      }}
    ax_lab_substrate_identity:
      schema_version: 1
      version: "{{ ax_lab.substrate.version }}"
      images: >-
        {{
          dict(
            ax_lab_substrate_installed
            | zip(
              ax_lab_substrate_installed
              | map("extract", ax_lab.substrate.images)
            )
          )
          | combine({"ate-setup": ax_lab.substrate.images["ate-setup"]})
        }}
      install:
        atenet_router: "{{ ax_lab.substrate.install.atenet_router }}"
        rollout_timeout_seconds: >-
          {{ ax_lab.substrate.install.rollout_timeout_seconds }}

- name: Require the lab install root directly under the platform root
  ansible.builtin.assert:
    that:
      - ax_lab.install_root | dirname == platform_install_root
    fail_msg: The lab must install under platform_install_root.

- name: Read the host machine architecture
  ansible.builtin.command:
    argv: [/usr/bin/uname, --machine]
  register: ax_lab_machine
  changed_when: false
  check_mode: false

- name: Require the architecture of the pinned binaries
  ansible.builtin.assert:
    that:
      - ax_lab_machine.stdout == ax_lab_architecture
    fail_msg: The pinned kind and kubectl release assets are linux-amd64.

- name: Inspect the lab install and sysctl paths without following links
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: false
  loop:
    - {path: /opt, directory: true}
    - {path: "{{ platform_install_root }}", directory: true}
    - {path: "{{ ax_lab.install_root }}", directory: true}
    - {path: "{{ ax_lab_bin_directory }}", directory: true}
    - {path: "{{ ax_lab_bin_directory }}/kind", directory: false}
    - {path: "{{ ax_lab_bin_directory }}/kubectl", directory: false}
    - {path: "{{ ax_lab_kind_config_path }}", directory: false}
    - {path: "{{ ax_lab_state_directory }}", directory: true}
    - {path: "{{ ax_lab_cluster_state_path }}", directory: false}
    - {path: "{{ ax_lab_home_directory }}", directory: true}
    - {path: "{{ ax_lab_home_directory }}/.kube", directory: true}
    - {path: "{{ ax_lab_kubeconfig_path }}", directory: false}
    - {path: "{{ ax_lab.install_root }}/src", directory: true}
    - {path: "{{ ax_lab_substrate_source_path }}", directory: true}
    - {path: "{{ ax_lab_cache_directory }}", directory: true}
    - {path: "{{ ax_lab_substrate_state_path }}", directory: false}
    - {path: "{{ ax_lab_substrate_manager }}", directory: false}
    - path: "{{ ax_lab_bin_directory }}/host_global_operation_lock.py"
      directory: false
    - path: "{{ ax_lab_bin_directory }}/ansible-operation-lock.py"
      directory: false
    - path: "{{ ax_lab_bin_directory }}/run-locked-command.py"
      directory: false
    - {path: /var/backups, directory: true}
    - {path: /var/backups/dockerswarm, directory: true}
    - path: "{{ ax_lab.substrate.backup_directory | dirname }}"
      directory: true
    - {path: "{{ ax_lab.substrate.backup_directory }}", directory: true}
    - {path: /etc, directory: true}
    - {path: /etc/sysctl.d, directory: true}
    - {path: "{{ ax_lab_sysctl_path }}", directory: false}
    - {path: "{{ ax_lab_ax_cli }}", directory: false}
    - {path: "{{ ax_lab_ax_state_path }}", directory: false}
    - {path: "{{ ax_lab.ax.cli_backup | dirname }}", directory: true}
    - {path: "{{ ax_lab.ax.cli_backup }}", directory: false}
    - {path: /usr, directory: true}
    - {path: /usr/local, directory: true}
    - {path: "{{ ax_lab_ax_helper_directory }}", directory: true}
    - {path: "{{ ax_lab_ax_helper_directory }}/ax", directory: false}
    - path: "{{ ax_lab_ax_helper_directory }}/ax-tarea"
      directory: false
  loop_control:
    label: "{{ item.path }}"
  register: ax_lab_install_paths

- name: Reject unsafe types ownership and permissions in lab paths
  ansible.builtin.assert:
    that:
      - not item.stat.exists or not item.stat.islnk
      - >-
        not item.stat.exists or (
          item.stat.isdir if item.item.directory else item.stat.isreg
        )
      - not item.stat.exists or item.stat.uid == 0
      - not item.stat.exists or item.stat.gid == 0
      - not item.stat.exists or item.stat.mode[-1] | int not in [2, 3, 6, 7]
      - not item.stat.exists or item.stat.mode[-2] | int not in [2, 3, 6, 7]
    fail_msg: Refusing to write the lab prerequisites through an unsafe path.
  loop: "{{ ax_lab_install_paths.results }}"
  loop_control:
    label: "{{ item.item.path }}"

# Read-only in both modes, before anything is written: it refuses to go on
# without the owner acceptance or with a lab container this role cannot
# prove it created, such as the manual lab.
- name: Read the lab cluster and registry and prove their ownership
  ansible.builtin.import_tasks: inspect.yml

# Unlike an application deploy, these tasks also run under --check: every
# read is check-safe, every write only reports, and the runtime checks wait
# for a real apply. Nothing here starts a container or touches Swarm.
- name: Reconcile the lab host prerequisites
  ansible.builtin.import_tasks: host.yml

# Like host.yml, in both modes: check mode reports what would be written.
- name: Install the AX CLI and the operator helpers
  ansible.builtin.import_tasks: ax_host.yml

# The same: the owner's AX examples and remote clients (docs/AX.md,
# «Ejemplos»), with this lab's paths and pins.
- name: Install the AX examples
  ansible.builtin.import_tasks: examples.yml

- name: Report what an apply would change in the lab cluster
  ansible.builtin.debug:
    msg: "{{ ax_lab_cluster_plan }}"
  when: ansible_check_mode

# Check mode reads Substrate as the host is now; an apply reads it again
# after each step that changes it. Both only read, and both stop on objects
# this role cannot prove it installed.
- name: Read the pinned Substrate images in the registry and the backup
  ansible.builtin.import_tasks: images_read.yml
  when: ansible_check_mode

- name: Read Substrate in the lab cluster and prove its ownership
  ansible.builtin.import_tasks: substrate_read.yml
  when: ansible_check_mode

- name: Describe what an apply would change in Substrate
  ansible.builtin.set_fact:
    ax_lab_substrate_plan: >-
      {{
        (
          [] if ax_lab_install_paths.results
          | selectattr("item.path", "equalto", ax_lab_substrate_source_path)
          | map(attribute="stat.exists") | first
          else [
            "clone " ~ ax_lab.sources.substrate.repository ~ " at "
            ~ ax_lab.sources.substrate.commit
          ]
        )
        + (
          [] if ax_lab_substrate_builds == [] else
          (
            ax_lab_substrate_builds
            | map("regex_replace", "^", "build with the fallback toolbox: ")
            | list
          )
          if ax_lab_node is none or ax_lab_node.status != "running" else
          [
            "the apply stops before building "
            ~ ax_lab_substrate_builds | join(", ") ~ ": "
            ~ ax_lab.cluster.node_container ~ " runs, so delete the"
            ~ " remaining AX Tasks (sudo ax delete task <name> -a default),"
            ~ " stop it under the host-global lock and apply again"
            ~ " (docs/AX.md, «Compilación de reserva»)"
          ]
        )
        + (
          (
            ax_lab_substrate_exports
            | map("regex_replace", "^", "back up from the registry: ") | list
          )
          + (
            ax_lab_substrate_imports
            | map("regex_replace", "^", "restore into the registry: ") | list
          )
          + (
            ax_lab_substrate_lost | difference(ax_lab_substrate_builds)
            | map("regex_replace", "^", "in neither backup nor registry: ")
            | list
          )
          if ax_lab_image_status.registry is not none else
          ["the local registry is read once the apply starts it"]
        )
        + (
          ["Substrate is read after the apply starts the lab node"]
          if ax_lab_substrate_cluster is none else
          ["install Substrate with ate-setup: " ~ ax_lab_substrate_drift
          | join(", ")]
          if ax_lab_substrate_drift else
          ["Substrate matches its pinned install"]
        )
      }}
  when: ansible_check_mode

- name: Report what an apply would change in Substrate
  ansible.builtin.debug:
    msg: "{{ ax_lab_substrate_plan }}"
  when: ansible_check_mode

- name: Read the pinned AX images in the registry and the backup
  ansible.builtin.import_tasks: ax_images_read.yml
  when: ansible_check_mode

- name: Read AX in the lab cluster and prove its ownership
  ansible.builtin.import_tasks: ax_read.yml
  when: ansible_check_mode

- name: Describe what an apply would change in AX
  ansible.builtin.set_fact:
    ax_lab_ax_plan: >-
      {{
        (
          (
            ax_lab_ax_exports
            | map("regex_replace", "^", "back up from the registry: ") | list
          )
          + (
            ax_lab_ax_imports
            | map("regex_replace", "^", "restore into the registry: ") | list
          )
          + (
            ax_lab_ax_lost
            | map("regex_replace", "^", "in neither backup nor registry: ")
            | list
          )
          if ax_lab_ax_image_status.registry is not none else
          ["the local registry is read once the apply starts it"]
        )
        + (
          [
            "AX is read once the lab node runs and Substrate matches its"
            ~ " pinned install"
          ]
          if not ax_lab_ax_readable else
          (
            (
              ["apply AX server-side: " ~ ax_lab_ax_drift | join(", ")]
              if ax_lab_ax_drift else ["AX matches its pinned install"]
            )
            + (
              ["set " ~ ax_lab_ax_router_arg ~ " on ate-system/atenet-router"]
              if ax_lab_ax_router_drift else []
            )
            + (
              [
                "recreate " ~ ax_lab_ax_stale_workers | length
                ~ " worker pods created before the lab node started"
              ]
              if ax_lab_ax_stale_workers else []
            )
          )
        )
        + (
          ["the apply stops: an ax-tarea or the ax CLI is running"]
          if ax_lab_ax_helper_scopes.stdout_lines | select | list
          and (
            ax_lab_substrate_drift or ax_lab_ax_drift
            or ax_lab_ax_router_drift or ax_lab_ax_stale_workers
          )
          else []
        )
      }}
  when: ansible_check_mode

- name: Report what an apply would change in AX
  ansible.builtin.debug:
    msg: "{{ ax_lab_ax_plan }}"
  when: ansible_check_mode

- name: Read the web panel and its forwarder and prove their ownership
  ansible.builtin.import_tasks: web_read.yml
  when: ansible_check_mode

- name: Report what an apply would change in the web panel
  ansible.builtin.debug:
    msg: "{{ ax_lab_web_plan }}"
  when: ansible_check_mode

# The fallback build runs before cluster.yml can create or start the node
# whose budget it borrows.
- name: Keep the Substrate checkout and fallback builds outside check mode
  ansible.builtin.import_tasks: artifacts.yml
  when: not ansible_check_mode

- name: Reconcile the lab cluster and its local registry outside check mode
  ansible.builtin.import_tasks: cluster.yml
  when: not ansible_check_mode

# A stopped node starts in node.yml only once the registry serves every
# pinned image; a node that `kind create cluster` has just created already
# runs, but nothing pulls a Substrate image before ate-setup.
- name: Seed and verify the pinned Substrate images outside check mode
  ansible.builtin.import_tasks: images.yml
  when: not ansible_check_mode

- name: Seed and verify the pinned AX images outside check mode
  ansible.builtin.import_tasks: ax_images.yml
  when: not ansible_check_mode

- name: Start and prepare the lab node outside check mode
  ansible.builtin.import_tasks: node.yml
  when: not ansible_check_mode

- name: Install Substrate only on drift outside check mode
  ansible.builtin.import_tasks: substrate.yml
  when: not ansible_check_mode

- name: Install AX only on drift and repair its workers outside check mode
  ansible.builtin.import_tasks: ax.yml
  when: not ansible_check_mode

- name: Deploy the web panel and its forwarder outside check mode
  ansible.builtin.import_tasks: web.yml
  when: not ansible_check_mode
