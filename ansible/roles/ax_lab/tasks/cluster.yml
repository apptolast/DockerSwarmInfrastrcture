---
# Apply only: main.yml imports this file outside --check, after inspect.yml
# has proven that every existing lab container is this role's. Each step
# changes only what differs from the contract and verifies it afterwards.
# Substrate's hack/create-kind-cluster.sh is never run: it deletes the
# existing cluster before creating one (lines 128-129 at the pinned commit).
- name: Create the lab state and kubeconfig directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ ax_lab_state_directory }}"
    - "{{ ax_lab_home_directory }}"
    - "{{ ax_lab_home_directory }}/.kube"

- name: Render the reviewed kind configuration
  ansible.builtin.template:
    src: kind-config.yaml.j2
    dest: "{{ ax_lab_kind_config_path }}"
    owner: root
    group: root
    mode: "0640"

- name: Hash the rendered kind configuration without following links
  ansible.builtin.stat:
    path: "{{ ax_lab_kind_config_path }}"
    follow: false
    checksum_algorithm: sha256
  register: ax_lab_kind_config_file

# The digest the ownership proof records is the validator's, computed on the
# controller; the file kind reads must be byte for byte that render.
- name: Require the rendered file to be the reviewed kind configuration
  ansible.builtin.assert:
    that:
      - ax_lab_kind_config_file.stat.isreg
      - not ax_lab_kind_config_file.stat.islnk
      - >-
        ax_lab_kind_config_file.stat.checksum
        == ax_lab_kind_config_digest.stdout
    fail_msg: >-
      {{ ax_lab_kind_config_path }} differs from the kind configuration the
      validator renders and hashes.

- name: Record which lab containers this apply creates
  ansible.builtin.set_fact:
    ax_lab_node_created: "{{ ax_lab_node is none }}"
    ax_lab_registry_created: "{{ ax_lab_registry is none }}"

# kind pulls the node image by the pinned digest, creates the `kind` network
# if it is missing, runs kubeadm init and writes an admin kubeconfig (0600,
# kind v0.33.0 pkg/cluster/internal/kubeconfig/internal/kubeconfig/write.go
# line 40) only to the lab's own path. When provisioning or one of its
# actions fails it deletes the node again, because --retain is not set
# (pkg/cluster/internal/create/create.go lines 102-108 and 135-141); when
# only the kubeconfig export fails (lines 149-161), or kind is interrupted,
# the node stays, without proof (docs/AX.md, «Recrear el clúster»). Without
# --wait (default 0s, pkg/cmd/kind/create/cluster/createcluster.go lines
# 82-87) it skips its node Ready wait (pkg/cluster/internal/create/actions/
# waitforready/waitforready.go lines 47-49): `docker update` below follows
# the read and the proof, and this role's own waits for the API and the
# node run under the limits.
- name: Create the lab cluster with the pinned kind and node image
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kind"
      - create
      - cluster
      - --name
      - "{{ ax_lab.cluster.name }}"
      - --config
      - "{{ ax_lab_kind_config_path }}"
      - --image
      - "{{ ax_lab.images.kind_node }}"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
  environment:
    HOME: "{{ ax_lab_home_directory }}"
    KUBECONFIG: "{{ ax_lab_kubeconfig_path }}"
  when: ax_lab_node_created
  changed_when: true

# The proof is written right after the creation, so that only a read stands
# between them. A run interrupted during `kind create cluster` or in between
# leaves a node without proof, which the next run refuses (docs/AX.md,
# «Recrear el clúster»).
- name: Read the lab node kind created
  ansible.builtin.import_tasks: read.yml

- name: Require the node after its creation
  ansible.builtin.assert:
    that:
      - ax_lab_node is not none
    fail_msg: The lab node is missing after `kind create cluster`.

- name: Record the proof that this role created the lab node
  ansible.builtin.copy:
    content: >-
      {{
        ax_lab_expected_cluster_state
        | combine({"node_container_id": ax_lab_node.id})
        | to_nice_json
      }}
    dest: "{{ ax_lab_cluster_state_path }}"
    owner: root
    group: root
    mode: "0600"
  when: ax_lab_node_created

- name: Prove that the lab node is this role's before converging its limits
  ansible.builtin.import_tasks: ownership.yml

# docker update applies memory, swap, reservation, CPU, PIDs and restart
# policy together, and only to a container whose values differ. The swap
# limit equals the memory limit: no swap. See
# https://docs.docker.com/reference/cli/docker/container/update/. kind
# creates the node without limits and with --restart=on-failure:1 (kind
# v0.33.0 pkg/cluster/internal/providers/docker/provision.go line 167), so
# they are converged right after the proof and before the registry is
# created or its image pulled: the node runs uncapped only while kind
# itself runs and the proof is written. The read above already lists a new
# node, and a drifted existing registry, in ax_lab_limits_drift; a registry
# created below starts with its limits.
- name: Converge the limits and restart policy of drifted lab containers
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - update
      - --memory
      - "{{ item.limits.memory }}"
      - --memory-swap
      - "{{ item.limits.memory_swap }}"
      - --memory-reservation
      - "{{ item.limits.memory_reservation }}"
      - --cpus
      - >-
        {{
          "%d.%03d" | format(
            item.resources.cpu_limit_millicores // 1000,
            item.resources.cpu_limit_millicores % 1000
          )
        }}
      - --pids-limit
      - "{{ item.limits.pids_limit }}"
      - --restart
      - "{{ item.limits.restart_policy.Name }}"
      - "{{ item.name }}"
  loop: "{{ ax_lab_containers }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in ax_lab_limits_drift
  changed_when: true

# kind's local registry guide, adapted to a cluster that already exists: the
# registry joins only the kind network (the guide starts it on the default
# bridge because it creates it before the cluster), keeps its images in a
# named volume and is published only on the loopback addresses. It is
# created with its reviewed limits and restart policy.
- name: Create the local registry from its pinned digest
  ansible.builtin.command:
    argv: >-
      {{
        [
          "/usr/bin/docker", "run", "--detach",
          "--name", ax_lab.registry.container,
          "--restart", ax_lab.registry.restart_policy,
          "--memory", ax_lab_containers[0].limits.memory | string,
          "--memory-swap", ax_lab_containers[0].limits.memory_swap | string,
          "--memory-reservation",
          ax_lab_containers[0].limits.memory_reservation | string,
          "--cpus",
          "%d.%03d" | format(
            ax_lab.registry.resources.cpu_limit_millicores // 1000,
            ax_lab.registry.resources.cpu_limit_millicores % 1000
          ),
          "--pids-limit", ax_lab.registry.resources.pids_limit | string,
          "--label", "com.apptolast.managed-by=ansible",
          "--label", "com.apptolast.ax-lab=registry",
          "--network", ax_lab.cluster.network,
          "--mount",
          "type=volume,source=" ~ ax_lab.registry.volume
          ~ ",target=/var/lib/registry",
        ]
        + (
          ax_lab.registry.bind_addresses
          | map("regex_replace", "^(.*:.*)$", "[\1]")
          | map(
            "regex_replace", "^(.*)$",
            "--publish=\1:" ~ ax_lab.registry.host_port
            ~ ":" ~ ax_lab.registry.container_port
          )
          | list
        )
        + [ax_lab.images.registry]
      }}
  when: ax_lab_registry_created
  changed_when: true

- name: Read the lab registry and node after creating them
  ansible.builtin.import_tasks: read.yml

- name: Require both lab containers after their creation
  ansible.builtin.assert:
    that:
      - ax_lab_registry is not none
      - ax_lab_node is not none
    fail_msg: The lab registry or node is missing after its creation.

- name: Prove again that both lab containers are this role's
  ansible.builtin.import_tasks: ownership.yml

- name: Connect the local registry to the kind network when it is not on it
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - network
      - connect
      - "{{ ax_lab.cluster.network }}"
      - "{{ ax_lab.registry.container }}"
  when: >-
    ax_lab.cluster.network
    not in (ax_lab_registry.networks | default({}, true))
  changed_when: true

# With restart policy "no" nothing starts them after a host or Docker
# restart: this playbook does. Here only the registry: the node starts in
# node.yml, once the registry serves every image it pulls (images.yml).
- name: Start the local registry when it is stopped
  ansible.builtin.command:
    argv: [/usr/bin/docker, start, "{{ ax_lab.registry.container }}"]
  when: ax_lab_registry.status in ["created", "exited"]
  changed_when: true

- name: Read the lab registry and node after converging them
  ansible.builtin.import_tasks: read.yml

# What capacity_preflight requires of the active plan's host containers on
# every later run, plus the restart policy and the registry network. The
# node may still be stopped here; node.yml starts it and checks it runs.
- name: Verify the lab containers carry their reviewed limits
  ansible.builtin.assert:
    that:
      - ax_lab_registry is not none
      - ax_lab_node is not none
      - ax_lab_registry.status == "running"
      - ax_lab_node.status in ["running", "created", "exited"]
      - ax_lab_limits_drift == []
      - >-
        ax_lab_registry.networks | default({}, true) | list
        == [ax_lab.cluster.network]
    fail_msg: >-
      The lab containers do not carry their reviewed limits, restart policy
      and network, or the registry does not run, after the apply.
