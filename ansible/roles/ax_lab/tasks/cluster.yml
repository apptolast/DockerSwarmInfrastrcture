---
# Apply only: main.yml imports this file outside --check, after inspect.yml
# has proven that every existing lab container is this role's. Each step
# changes only what differs from the contract and verifies it afterwards.
# Substrate's hack/create-kind-cluster.sh is never run: it deletes the
# existing cluster before creating one (lines 128-129 at the pinned commit).
- name: Create the lab state and kubeconfig directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ ax_lab_state_directory }}"
    - "{{ ax_lab_home_directory }}"
    - "{{ ax_lab_home_directory }}/.kube"

- name: Render the reviewed kind configuration
  ansible.builtin.template:
    src: kind-config.yaml.j2
    dest: "{{ ax_lab_kind_config_path }}"
    owner: root
    group: root
    mode: "0640"

- name: Hash the rendered kind configuration without following links
  ansible.builtin.stat:
    path: "{{ ax_lab_kind_config_path }}"
    follow: false
    checksum_algorithm: sha256
  register: ax_lab_kind_config_file

# The digest the ownership proof records is the validator's, computed on the
# controller; the file kind reads must be byte for byte that render.
- name: Require the rendered file to be the reviewed kind configuration
  ansible.builtin.assert:
    that:
      - ax_lab_kind_config_file.stat.isreg
      - not ax_lab_kind_config_file.stat.islnk
      - >-
        ax_lab_kind_config_file.stat.checksum
        == ax_lab_kind_config_digest.stdout
    fail_msg: >-
      {{ ax_lab_kind_config_path }} differs from the kind configuration the
      validator renders and hashes.

- name: Record which lab containers this apply creates
  ansible.builtin.set_fact:
    ax_lab_node_created: "{{ ax_lab_node is none }}"
    ax_lab_registry_created: "{{ ax_lab_registry is none }}"

# kind pulls the node image by the pinned digest, creates the `kind` network
# if it is missing, runs kubeadm init and writes an admin kubeconfig (0600,
# kind v0.33.0 pkg/cluster/internal/kubeconfig/internal/kubeconfig/write.go
# line 40) only to the lab's own path. When provisioning or one of its
# actions fails it deletes the node again, because --retain is not set
# (pkg/cluster/internal/create/create.go lines 102-108 and 135-141); when
# only the kubeconfig export fails (lines 149-161), or kind is interrupted,
# the node stays, without proof (docs/AX.md, «Recrear el clúster»). Without
# --wait (default 0s, pkg/cmd/kind/create/cluster/createcluster.go lines
# 82-87) it skips its node Ready wait (pkg/cluster/internal/create/actions/
# waitforready/waitforready.go lines 47-49): `docker update` below follows
# the read and the proof, and this role's own waits for the API and the
# node run under the limits.
- name: Create the lab cluster with the pinned kind and node image
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kind"
      - create
      - cluster
      - --name
      - "{{ ax_lab.cluster.name }}"
      - --config
      - "{{ ax_lab_kind_config_path }}"
      - --image
      - "{{ ax_lab.images.kind_node }}"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
  environment:
    HOME: "{{ ax_lab_home_directory }}"
    KUBECONFIG: "{{ ax_lab_kubeconfig_path }}"
  when: ax_lab_node_created
  changed_when: true

# The proof is written right after the creation, so that only a read stands
# between them. A run interrupted during `kind create cluster` or in between
# leaves a node without proof, which the next run refuses (docs/AX.md,
# «Recrear el clúster»).
- name: Read the lab node kind created
  ansible.builtin.import_tasks: read.yml

- name: Require the node after its creation
  ansible.builtin.assert:
    that:
      - ax_lab_node is not none
    fail_msg: The lab node is missing after `kind create cluster`.

- name: Record the proof that this role created the lab node
  ansible.builtin.copy:
    content: >-
      {{
        ax_lab_expected_cluster_state
        | combine({"node_container_id": ax_lab_node.id})
        | to_nice_json
      }}
    dest: "{{ ax_lab_cluster_state_path }}"
    owner: root
    group: root
    mode: "0600"
  when: ax_lab_node_created

- name: Prove that the lab node is this role's before converging its limits
  ansible.builtin.import_tasks: ownership.yml

# docker update applies memory, swap, reservation, CPU, PIDs and restart
# policy together, and only to a container whose values differ. The swap
# limit equals the memory limit: no swap. See
# https://docs.docker.com/reference/cli/docker/container/update/. kind
# creates the node without limits and with --restart=on-failure:1 (kind
# v0.33.0 pkg/cluster/internal/providers/docker/provision.go line 167), so
# they are converged right after the proof and before the registry is
# created or its image pulled: the node runs uncapped only while kind
# itself runs and the proof is written. The read above already lists a new
# node, and a drifted existing registry, in ax_lab_limits_drift; a registry
# created below starts with its limits.
- name: Converge the limits and restart policy of drifted lab containers
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - update
      - --memory
      - "{{ item.limits.memory }}"
      - --memory-swap
      - "{{ item.limits.memory_swap }}"
      - --memory-reservation
      - "{{ item.limits.memory_reservation }}"
      - --cpus
      - >-
        {{
          "%d.%03d" | format(
            item.resources.cpu_limit_millicores // 1000,
            item.resources.cpu_limit_millicores % 1000
          )
        }}
      - --pids-limit
      - "{{ item.limits.pids_limit }}"
      - --restart
      - "{{ item.limits.restart_policy.Name }}"
      - "{{ item.name }}"
  loop: "{{ ax_lab_containers }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in ax_lab_limits_drift
  changed_when: true

# kind's local registry guide, adapted to a cluster that already exists: the
# registry joins only the kind network (the guide starts it on the default
# bridge because it creates it before the cluster), keeps its images in a
# named volume and is published only on the loopback addresses. It is
# created with its reviewed limits and restart policy.
- name: Create the local registry from its pinned digest
  ansible.builtin.command:
    argv: >-
      {{
        [
          "/usr/bin/docker", "run", "--detach",
          "--name", ax_lab.registry.container,
          "--restart", ax_lab.registry.restart_policy,
          "--memory", ax_lab_containers[0].limits.memory | string,
          "--memory-swap", ax_lab_containers[0].limits.memory_swap | string,
          "--memory-reservation",
          ax_lab_containers[0].limits.memory_reservation | string,
          "--cpus",
          "%d.%03d" | format(
            ax_lab.registry.resources.cpu_limit_millicores // 1000,
            ax_lab.registry.resources.cpu_limit_millicores % 1000
          ),
          "--pids-limit", ax_lab.registry.resources.pids_limit | string,
          "--label", "com.apptolast.managed-by=ansible",
          "--label", "com.apptolast.ax-lab=registry",
          "--network", ax_lab.cluster.network,
          "--mount",
          "type=volume,source=" ~ ax_lab.registry.volume
          ~ ",target=/var/lib/registry",
        ]
        + (
          ax_lab.registry.bind_addresses
          | map("regex_replace", "^(.*:.*)$", "[\1]")
          | map(
            "regex_replace", "^(.*)$",
            "--publish=\1:" ~ ax_lab.registry.host_port
            ~ ":" ~ ax_lab.registry.container_port
          )
          | list
        )
        + [ax_lab.images.registry]
      }}
  when: ax_lab_registry_created
  changed_when: true

- name: Read the lab registry and node after creating them
  ansible.builtin.import_tasks: read.yml

- name: Require both lab containers after their creation
  ansible.builtin.assert:
    that:
      - ax_lab_registry is not none
      - ax_lab_node is not none
    fail_msg: The lab registry or node is missing after its creation.

- name: Prove again that both lab containers are this role's
  ansible.builtin.import_tasks: ownership.yml

- name: Connect the local registry to the kind network when it is not on it
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - network
      - connect
      - "{{ ax_lab.cluster.network }}"
      - "{{ ax_lab.registry.container }}"
  when: >-
    ax_lab.cluster.network
    not in (ax_lab_registry.networks | default({}, true))
  changed_when: true

# With restart policy "no" nothing starts them after a host or Docker
# restart: this playbook does, the registry first.
- name: Start each stopped lab container
  ansible.builtin.command:
    argv: [/usr/bin/docker, start, "{{ item.item.name }}"]
  loop: "{{ ax_lab_container_reads.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: (item.stdout | from_json).status in ["created", "exited"]
  changed_when: true

- name: Read the lab registry and node after converging them
  ansible.builtin.import_tasks: read.yml

# What capacity_preflight requires of the active plan's host containers on
# every later run, plus the restart policy and the registry network.
- name: Verify the lab containers run with their reviewed limits
  ansible.builtin.assert:
    that:
      - ax_lab_registry is not none
      - ax_lab_node is not none
      - ax_lab_registry.status == "running"
      - ax_lab_node.status == "running"
      - ax_lab_limits_drift == []
      - >-
        ax_lab_registry.networks | default({}, true) | list
        == [ax_lab.cluster.network]
    fail_msg: >-
      The lab containers do not run with their reviewed limits, restart
      policy and network after the apply.

- name: Inspect the lab kubeconfig without following links
  ansible.builtin.stat:
    path: "{{ ax_lab_kubeconfig_path }}"
    follow: false
    get_checksum: false
  register: ax_lab_kubeconfig_before

- name: Export the lab kubeconfig only when it is missing
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kind"
      - export
      - kubeconfig
      - --name
      - "{{ ax_lab.cluster.name }}"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
  environment:
    HOME: "{{ ax_lab_home_directory }}"
    KUBECONFIG: "{{ ax_lab_kubeconfig_path }}"
  when: not ax_lab_kubeconfig_before.stat.exists
  changed_when: true

- name: Inspect the lab kubeconfig after the export
  ansible.builtin.stat:
    path: "{{ ax_lab_kubeconfig_path }}"
    follow: false
    get_checksum: false
  register: ax_lab_kubeconfig

- name: Require a root-only regular lab kubeconfig
  ansible.builtin.assert:
    that:
      - ax_lab_kubeconfig.stat.exists
      - ax_lab_kubeconfig.stat.isreg
      - not ax_lab_kubeconfig.stat.islnk
      - ax_lab_kubeconfig.stat.uid == 0
      - ax_lab_kubeconfig.stat.gid == 0
      - ax_lab_kubeconfig.stat.mode == "0600"
    fail_msg: >-
      {{ ax_lab_kubeconfig_path }} is not a root:root 0600 regular file.

# Every kubectl call runs with the lab's HOME, so its discovery and HTTP
# cache stay in /opt/dockerswarm/ax-lab/home/.kube/cache and never in /root,
# and gives up on a request after 10 seconds instead of kubectl's default of
# never, so that the retries bound each wait.
- name: Wait for the lab API server on its loopback endpoint
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kubectl"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
      - --context
      - "kind-{{ ax_lab.cluster.name }}"
      - --request-timeout
      - 10s
      - get
      - --raw
      - /readyz
  environment:
    HOME: "{{ ax_lab_home_directory }}"
  register: ax_lab_readyz
  until: ax_lab_readyz.rc == 0 and ax_lab_readyz.stdout == "ok"
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for the lab node to report Ready
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kubectl"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
      - --context
      - "kind-{{ ax_lab.cluster.name }}"
      - --request-timeout
      - 10s
      - get
      - node
      - "{{ ax_lab.cluster.node_container }}"
      - --output
      - jsonpath={.status.conditions[?(@.type=="Ready")].status}
  environment:
    HOME: "{{ ax_lab_home_directory }}"
  register: ax_lab_node_ready
  until: ax_lab_node_ready.rc == 0 and ax_lab_node_ready.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false

# Substrate enables proxy ARP and proxy NDP on every kind node for gVisor's
# loopback pod-to-pod networking (hack/create-kind-cluster.sh, lines 174-182
# at the pinned commit), unconditionally: "nodes of either family carry the
# other's addresses on the Docker bridge", and the kind network is
# dual-stack. Both live in the node's network namespace, so every node
# restart resets them. proxy_ndp is set with `-e`, as Substrate does, and
# read with it too: on a kernel without IPv6 the run then stops at its
# verification, which requires 1, with a clear message.
- name: Read proxy_arp inside the lab node
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/sbin/sysctl
      - -n
      - net.ipv4.conf.all.proxy_arp
  register: ax_lab_proxy_arp_before
  changed_when: false

- name: Enable proxy_arp inside the lab node only when it is off
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/sbin/sysctl
      - -w
      - net.ipv4.conf.all.proxy_arp=1
  when: ax_lab_proxy_arp_before.stdout != "1"
  changed_when: true

- name: Read proxy_arp inside the lab node after convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/sbin/sysctl
      - -n
      - net.ipv4.conf.all.proxy_arp
  register: ax_lab_proxy_arp
  changed_when: false

- name: Verify proxy_arp inside the lab node
  ansible.builtin.assert:
    that:
      - ax_lab_proxy_arp.stdout == "1"
    fail_msg: >-
      net.ipv4.conf.all.proxy_arp is {{ ax_lab_proxy_arp.stdout }} inside
      {{ ax_lab.cluster.node_container }}, expected 1.

- name: Read proxy_ndp inside the lab node
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/sbin/sysctl
      - -n
      - -e
      - net.ipv6.conf.all.proxy_ndp
  register: ax_lab_proxy_ndp_before
  changed_when: false

- name: Enable proxy_ndp inside the lab node only when it is off
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/sbin/sysctl
      - -e
      - -w
      - net.ipv6.conf.all.proxy_ndp=1
  when: ax_lab_proxy_ndp_before.stdout != "1"
  changed_when: true

- name: Read proxy_ndp inside the lab node after convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/sbin/sysctl
      - -n
      - -e
      - net.ipv6.conf.all.proxy_ndp
  register: ax_lab_proxy_ndp
  changed_when: false

- name: Verify proxy_ndp inside the lab node
  ansible.builtin.assert:
    that:
      - ax_lab_proxy_ndp.stdout == "1"
    fail_msg: >-
      net.ipv6.conf.all.proxy_ndp is {{ ax_lab_proxy_ndp.stdout }} inside
      {{ ax_lab.cluster.node_container }}, expected 1.

# kind's local registry guide, step 3: containerd resolves
# localhost:<host port> to the registry container through this hosts.toml
# (kind-with-registry.sh, lines 46-60 at v0.33.0). The file lives in the
# node's writable layer and survives restarts.
- name: Read the registry mirror configuration inside the lab node
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/bin/cat
      - "{{ ax_lab_registry_hosts_directory }}/hosts.toml"
  register: ax_lab_registry_mirror_before
  changed_when: false
  failed_when:
    - ax_lab_registry_mirror_before.rc != 0
    - >-
      "No such file or directory" not in ax_lab_registry_mirror_before.stderr

- name: Create the registry mirror directory inside the lab node
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/bin/mkdir
      - -p
      - "{{ ax_lab_registry_hosts_directory }}"
  when: ax_lab_registry_mirror_before.stdout != ax_lab_registry_mirror
  changed_when: true

- name: Write the registry mirror configuration inside the lab node
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - --interactive
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/bin/cp
      - /dev/stdin
      - "{{ ax_lab_registry_hosts_directory }}/hosts.toml"
    stdin: "{{ ax_lab_registry_mirror }}"
  when: ax_lab_registry_mirror_before.stdout != ax_lab_registry_mirror
  changed_when: true

- name: Read the registry mirror configuration after convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - exec
      - "{{ ax_lab.cluster.node_container }}"
      - /usr/bin/cat
      - "{{ ax_lab_registry_hosts_directory }}/hosts.toml"
  register: ax_lab_registry_mirror_file
  changed_when: false

- name: Verify the registry mirror configuration inside the lab node
  ansible.builtin.assert:
    that:
      - ax_lab_registry_mirror_file.stdout == ax_lab_registry_mirror
    fail_msg: >-
      {{ ax_lab_registry_hosts_directory }}/hosts.toml inside the node does
      not point localhost:{{ ax_lab.registry.host_port }} at the registry.

# kind's local registry guide, step 5: the ConfigMap of KEP-1755 that tells
# tools where the local registry is. Applied server-side, only when it
# differs.
- name: Read the local registry hosting ConfigMap
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kubectl"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
      - --context
      - "kind-{{ ax_lab.cluster.name }}"
      - --request-timeout
      - 10s
      - get
      - configmap
      - local-registry-hosting
      - --namespace
      - kube-public
      - --ignore-not-found
      - --output
      - json
  environment:
    HOME: "{{ ax_lab_home_directory }}"
  register: ax_lab_registry_hosting_before
  changed_when: false

- name: Apply the local registry hosting ConfigMap only when it differs
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kubectl"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
      - --context
      - "kind-{{ ax_lab.cluster.name }}"
      - --request-timeout
      - 10s
      - apply
      - --server-side
      - --field-manager
      - ax-lab
      - --filename
      - "-"
    stdin: >-
      {{
        {
          "apiVersion": "v1",
          "kind": "ConfigMap",
          "metadata": {
            "name": "local-registry-hosting",
            "namespace": "kube-public"
          },
          "data": ax_lab_registry_hosting_data
        } | to_json
      }}
  environment:
    HOME: "{{ ax_lab_home_directory }}"
  when: >-
    ax_lab_registry_hosting_before.stdout | length == 0
    or (ax_lab_registry_hosting_before.stdout | from_json).data
    | default({}, true) != ax_lab_registry_hosting_data
  changed_when: true

- name: Read the local registry hosting ConfigMap after convergence
  ansible.builtin.command:
    argv:
      - "{{ ax_lab_bin_directory }}/kubectl"
      - --kubeconfig
      - "{{ ax_lab_kubeconfig_path }}"
      - --context
      - "kind-{{ ax_lab.cluster.name }}"
      - --request-timeout
      - 10s
      - get
      - configmap
      - local-registry-hosting
      - --namespace
      - kube-public
      - --output
      - json
  environment:
    HOME: "{{ ax_lab_home_directory }}"
  register: ax_lab_registry_hosting
  changed_when: false

- name: Verify the local registry hosting ConfigMap
  ansible.builtin.assert:
    that:
      - >-
        (ax_lab_registry_hosting.stdout | from_json).data
        == ax_lab_registry_hosting_data
    fail_msg: >-
      kube-public/local-registry-hosting does not document
      localhost:{{ ax_lab.registry.host_port }}.
