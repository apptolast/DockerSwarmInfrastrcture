---
- name: Verify the image catalog is available
  ansible.builtin.assert:
    that:
      - approved_services is sequence
      - approved_services is not string
      - internal_platform.observability.components is sequence
      - image_preflight_expected_os == "linux"
      - image_preflight_expected_architecture == "amd64"
      - image_preflight_include_tracked_updates is boolean
      - workload_image_update_schema_version is integer
      - workload_image_update_schema_version == 1
      - workload_image_updates is sequence
      - workload_image_updates is not string
      - >-
        workload_image_updates | length == 1
      - (workload_image_updates | first) is mapping
      - >-
        (workload_image_updates | first).keys() | list | sort
        == [
          "approved_runtime_reference",
          "catalog_reference",
          "catalog_service",
          "component",
          "swarm_service",
          "tracked_reference",
          "update_policy"
        ]
      - >-
        (workload_image_updates | first).catalog_service
        == "personal-website-alberto"
      - (workload_image_updates | first).component == "app"
      - (workload_image_updates | first).swarm_service == "portfolio-alberto"
      - >-
        (workload_image_updates | first).catalog_reference
        == "docker.io/hgarciaalberto/personal-website@sha256:"
        ~ "b0ce681920843501df35793def9fedd1"
        ~ "011b44626c5e8b543ef76209f911e2c3"
      - >-
        (workload_image_updates | first).tracked_reference
        == "docker.io/hgarciaalberto/personal-website:latest"
      - >-
        (workload_image_updates | first).approved_runtime_reference
        is match(
          "^docker[.]io/hgarciaalberto/personal-website:latest"
          ~ "@sha256:[a-f0-9]{64}$"
        )
      - (workload_image_updates | first).update_policy == "tracked-tag"
    fail_msg: "The reviewed image catalog is missing or unsupported."
    quiet: true

- name: Bind the tracked image policy to its immutable catalog baseline
  ansible.builtin.assert:
    that:
      - >-
        (approved_services
        | selectattr("id", "equalto", item.catalog_service)
        | first).images
        | selectattr("component", "equalto", item.component)
        | map(attribute="reference")
        | list
        == [item.catalog_reference]
    fail_msg: >-
      {{ item.catalog_service }}/{{ item.component }} does not match the
      immutable catalog baseline reviewed for tracked updates.
    quiet: true
  loop: "{{ workload_image_updates }}"
  loop_control:
    label: "{{ item.catalog_service }}/{{ item.component }}"

- name: Start the reviewed runtime image inventories
  ansible.builtin.set_fact:
    image_preflight_catalog_references: []
    image_preflight_tracked_runtime_references: {}

- name: Collect approved immutable remote runtime images
  ansible.builtin.set_fact:
    image_preflight_catalog_references: >-
      {{
        image_preflight_catalog_references
        + [item.1.reference]
      }}
  loop: "{{ approved_services | subelements('images') }}"
  loop_control:
    label: "{{ item.0.id }}/{{ item.1.component }}"
  when:
    - >-
      {
        "service": item.0.id,
        "component": item.1.component
      } not in image_preflight_excluded_catalog_images
    - >-
      not
      (
        image_preflight_include_tracked_updates | bool
        and
        workload_image_updates
        | selectattr("catalog_service", "equalto", item.0.id)
        | selectattr("component", "equalto", item.1.component)
        | list | length == 1
      )

- name: Derive the exact tracked runtime image references
  ansible.builtin.set_fact:
    image_preflight_tracked_references: >-
      {{
        (
          workload_image_updates
          | map(attribute="tracked_reference")
          | list
        )
        if image_preflight_include_tracked_updates | bool
        else []
      }}

- name: Collect internal observability runtime images
  ansible.builtin.set_fact:
    image_preflight_catalog_references: >-
      {{
        image_preflight_catalog_references
        + [item.image]
      }}
  loop: "{{ internal_platform.observability.components }}"
  loop_control:
    label: "observability/{{ item.id }}"

- name: Normalize references to immutable repository digests
  ansible.builtin.set_fact:
    image_preflight_references: >-
      {{
        image_preflight_catalog_references
        | map(
          "regex_replace",
          image_preflight_tag_digest_pattern,
          image_preflight_digest_replacement
        )
        | unique
        | sort
      }}

- name: Verify every preflight reference is immutable
  ansible.builtin.assert:
    that:
      - item is match(
          "^[a-z0-9][a-z0-9._:/-]*@sha256:[a-f0-9]{64}$"
        )
      - item !=
        "ghcr.io/apptolast/migracionnetcup-n8n-runners@sha256:" ~
        "4d8f879e9f70df8173c3b9b40406582fc9b460e4f8afcf5dcf51d3bce0e5e1b5"
    fail_msg: "A mutable or private source image reached the remote preflight."
    quiet: true
  loop: "{{ image_preflight_references }}"
  loop_control:
    label: "{{ item }}"

- name: Inspect the immutable runtime image cache
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - image
      - inspect
      - "{{ item }}"
  loop: "{{ image_preflight_references }}"
  loop_control:
    label: "{{ item }}"
  register: image_preflight_initial_inspect
  changed_when: false
  failed_when: false
  check_mode: false

- name: Pull every missing image before any stack mutation
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - image
      - pull
      - --platform
      - >-
        {{ image_preflight_expected_os
           }}/{{ image_preflight_expected_architecture }}
      - "{{ item.item }}"
  loop: "{{ image_preflight_initial_inspect.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - item.rc != 0
  changed_when: true

- name: Read the exact tracked tag descriptor from its registry
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - buildx
      - imagetools
      - inspect
      - --format
      - "{{ '{{json .Manifest}}' }}"
      - "{{ item }}"
  loop: "{{ image_preflight_tracked_references }}"
  loop_control:
    label: "{{ item }}"
  register: image_preflight_tracked_descriptors
  changed_when: false
  check_mode: false
  when:
    - image_preflight_include_tracked_updates | bool

- name: Resolve the tracked registry descriptor to an immutable reference
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/../../scripts/resolve-tracked-image.py"
      - resolve
      - --reference
      - "{{ item.item }}"
      - --approved-reference
      - >-
        {{
          (workload_image_updates
          | selectattr("tracked_reference", "equalto", item.item)
          | first).approved_runtime_reference
        }}
    stdin: "{{ item.stdout }}"
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  register: image_preflight_tracked_resolution
  changed_when: false
  check_mode: false
  loop: "{{ image_preflight_tracked_descriptors.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.item in image_preflight_tracked_references

- name: Record the immutable runtime reference for the tracked image
  ansible.builtin.set_fact:
    image_preflight_tracked_runtime_references: >-
      {{
        image_preflight_tracked_runtime_references
        | combine({item.item.item: item.stdout | trim})
      }}
  loop: "{{ image_preflight_tracked_resolution.results }}"
  loop_control:
    label: "{{ item.item.item }}"
  when:
    - item.item.item in image_preflight_tracked_references

- name: Enforce the complete tracked runtime reference map
  ansible.builtin.assert:
    that:
      - >-
        image_preflight_tracked_runtime_references.keys() | list | sort
        == image_preflight_tracked_references | sort
      - >-
        image_preflight_tracked_runtime_references[
          "docker.io/hgarciaalberto/personal-website:latest"]
        == (workload_image_updates | first).approved_runtime_reference
    fail_msg: "The tracked runtime image did not resolve fail-closed."
    quiet: true
  when:
    - image_preflight_include_tracked_updates | bool

- name: Report the reviewed tracked runtime reference
  ansible.builtin.debug:
    msg: >-
      Alberto runtime image approved for this operation:
      {{ image_preflight_tracked_runtime_references[
        "docker.io/hgarciaalberto/personal-website:latest"] }}
  changed_when: false
  when: image_preflight_include_tracked_updates | bool

- name: Keep the tracked runtime map empty outside workload operations
  ansible.builtin.assert:
    that:
      - image_preflight_tracked_runtime_references == {}
    fail_msg: "A tracked runtime image escaped its workload operation scope."
    quiet: true
  when: not (image_preflight_include_tracked_updates | bool)

- name: Derive immutable tracked image references for the current operation
  ansible.builtin.set_fact:
    image_preflight_tracked_resolved_references: >-
      {{
        image_preflight_tracked_runtime_references.values()
        | list
        | sort
      }}

- name: Combine immutable and tracked runtime references
  ansible.builtin.set_fact:
    image_preflight_runtime_references: >-
      {{
        (
          image_preflight_references
          + image_preflight_tracked_resolved_references
        )
        | unique
        | sort
      }}

- name: Pull the resolved tracked image before any stack mutation
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - image
      - pull
      - --platform
      - >-
        {{ image_preflight_expected_os
           }}/{{ image_preflight_expected_architecture }}
      - "{{ item }}"
  loop: "{{ image_preflight_tracked_resolved_references }}"
  loop_control:
    label: "{{ item }}"
  register: image_preflight_tracked_pull
  changed_when: >-
    'Downloaded newer image' in image_preflight_tracked_pull.stdout
  when:
    - not ansible_check_mode
    - image_preflight_include_tracked_updates | bool

- name: Read the complete reviewed runtime image cache
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - image
      - inspect
      - "{{ item }}"
  loop: "{{ image_preflight_runtime_references }}"
  loop_control:
    label: "{{ item }}"
  register: image_preflight_final_inspect
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Enforce runtime image platform and content identity
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json | first).Os
        == image_preflight_expected_os
      - (item.stdout | from_json | first).Architecture
        == image_preflight_expected_architecture
      - >-
        (item.stdout | from_json | first).Id
        is match("^sha256:[a-f0-9]{64}$")
    fail_msg: >-
      The cached image {{ item.item }} does not match the reviewed
      linux/amd64 contract.
    quiet: true
  loop: "{{ image_preflight_final_inspect.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Verify the tracked local image against its resolved registry digest
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/../../scripts/resolve-tracked-image.py"
      - verify
      - --resolved-reference
      - "{{ item.item }}"
    stdin: "{{ item.stdout }}"
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  changed_when: false
  loop: "{{ image_preflight_final_inspect.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - item.item in image_preflight_tracked_resolved_references
