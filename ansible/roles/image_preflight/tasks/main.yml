---
- name: Load the reviewed image channel map
  ansible.builtin.import_role:
    name: image_channels

- name: Verify the image preflight scope
  ansible.builtin.assert:
    that:
      - image_preflight_expected_os == "linux"
      - image_preflight_expected_architecture == "amd64"
      - image_channels_map is mapping
      - image_preflight_stacks is sequence
      - image_preflight_stacks is not string
      - >-
        image_preflight_stacks | sort
        == ["edge", "observability", "workloads"]
      - image_preflight_channel_stacks is sequence
      - image_preflight_channel_stacks is not string
      - >-
        image_preflight_channel_stacks
        | difference(image_preflight_stacks) | length == 0
      - >-
        image_preflight_stacks
        | difference(image_channels_map.keys() | list) | length == 0
    fail_msg: "The reviewed image catalog is missing or unsupported."
    quiet: true

- name: Start the reviewed runtime image inventories
  ansible.builtin.set_fact:
    image_preflight_channel_resolutions: {}
    image_preflight_references: >-
      {{
        image_preflight_stacks
        | map("extract", image_channels_map)
        | map("dict2items") | flatten
        | map(attribute="value")
        | selectattr("mode", "equalto", "hold")
        | map(attribute="preflight_reference")
        | unique | sort
      }}
    image_preflight_channel_references: >-
      {{
        image_preflight_channel_stacks
        | map("extract", image_channels_map)
        | map("dict2items") | flatten
        | map(attribute="value")
        | selectattr("mode", "equalto", "channel")
        | map(attribute="reference")
        | unique | sort
      }}

- name: Verify every held preflight reference is immutable
  ansible.builtin.assert:
    that:
      - item is match(
          "^[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$"
        )
      - item !=
        "ghcr.io/apptolast/migracionnetcup-n8n-runners@sha256:" ~
        "4d8f879e9f70df8173c3b9b40406582fc9b460e4f8afcf5dcf51d3bce0e5e1b5"
    fail_msg: "A mutable or private source image reached the remote preflight."
    quiet: true
  loop: "{{ image_preflight_references }}"
  loop_control:
    label: "{{ item }}"

- name: Verify every channel reference is a reviewed repository tag
  ansible.builtin.assert:
    that:
      - item is match(
          "^[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$"
        )
    fail_msg: >-
      A channel outside config/image-channels.yml reached the preflight.
    quiet: true
  loop: "{{ image_preflight_channel_references }}"
  loop_control:
    label: "{{ item }}"

- name: Inspect the immutable runtime image cache
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - image
      - inspect
      - "{{ item }}"
  loop: "{{ image_preflight_references }}"
  loop_control:
    label: "{{ item }}"
  register: image_preflight_initial_inspect
  changed_when: false
  failed_when: false
  check_mode: false

- name: Pull every missing image before any stack mutation
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - image
      - pull
      - --platform
      - >-
        {{ image_preflight_expected_os
           }}/{{ image_preflight_expected_architecture }}
      - "{{ item.item }}"
  loop: "{{ image_preflight_initial_inspect.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - item.rc != 0
  changed_when: true

- name: Read the channel head descriptor from its registry
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - buildx
      - imagetools
      - inspect
      - --format
      - "{{ '{{json .Manifest}}' }}"
      - "{{ item }}"
  loop: "{{ image_preflight_channel_references }}"
  loop_control:
    label: "{{ item }}"
  register: image_preflight_channel_descriptors
  changed_when: false
  check_mode: false

- name: Resolve every channel head to an immutable reference
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../../scripts/resolve-image-channel.py"
      - resolve
      - --reference
      - "{{ item.item }}"
    stdin: "{{ item.stdout }}"
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  register: image_preflight_channel_resolution
  changed_when: false
  check_mode: false
  loop: "{{ image_preflight_channel_descriptors.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.item in image_preflight_channel_references

- name: Record the immutable runtime reference of every channel
  ansible.builtin.set_fact:
    image_preflight_channel_resolutions: >-
      {{
        image_preflight_channel_resolutions
        | combine({item.item.item: item.stdout | trim})
      }}
  loop: "{{ image_preflight_channel_resolution.results }}"
  loop_control:
    label: "{{ item.item.item }}"
  when:
    - item.item.item in image_preflight_channel_references

- name: Enforce the complete channel resolution map
  ansible.builtin.assert:
    that:
      - >-
        image_preflight_channel_resolutions.keys() | list | sort
        == image_preflight_channel_references
    fail_msg: "A channel head did not resolve fail-closed to one digest."
    quiet: true

- name: Enforce that every channel resolved to its own repository digest
  ansible.builtin.assert:
    that:
      - >-
        item.value is match(
          "^" ~ (item.key | regex_escape) ~ "@sha256:[a-f0-9]{64}$"
        )
    fail_msg: "A channel head did not resolve fail-closed to one digest."
    quiet: true
  loop: "{{ image_preflight_channel_resolutions | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Report the channel heads resolved for this operation
  ansible.builtin.debug:
    msg: >-
      Channel heads resolved for this operation:
      {{ image_preflight_channel_resolutions | to_json }}
  changed_when: false
  when: image_preflight_channel_references | length > 0

- name: Keep the channel map empty outside channel operations
  ansible.builtin.assert:
    that:
      - image_preflight_channel_resolutions == {}
    fail_msg: "A channel resolution escaped its operation scope."
    quiet: true
  when: image_preflight_channel_stacks | length == 0

- name: Derive immutable channel references for the current operation
  ansible.builtin.set_fact:
    image_preflight_channel_resolved_references: >-
      {{
        image_preflight_channel_resolutions.values()
        | list
        | sort
      }}

- name: Combine held and resolved channel runtime references
  ansible.builtin.set_fact:
    image_preflight_runtime_references: >-
      {{
        (
          image_preflight_references
          + image_preflight_channel_resolved_references
        )
        | unique
        | sort
      }}

- name: Pull the resolved channel heads before any stack mutation
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - image
      - pull
      - --platform
      - >-
        {{ image_preflight_expected_os
           }}/{{ image_preflight_expected_architecture }}
      - "{{ item }}"
  loop: "{{ image_preflight_channel_resolved_references }}"
  loop_control:
    label: "{{ item }}"
  register: image_preflight_channel_pull
  changed_when: >-
    'Downloaded newer image' in image_preflight_channel_pull.stdout
  when:
    - not ansible_check_mode

- name: Read the complete reviewed runtime image cache
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - image
      - inspect
      - "{{ item }}"
  loop: "{{ image_preflight_runtime_references }}"
  loop_control:
    label: "{{ item }}"
  register: image_preflight_final_inspect
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Enforce runtime image platform and content identity
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json | first).Os
        == image_preflight_expected_os
      - (item.stdout | from_json | first).Architecture
        == image_preflight_expected_architecture
      - >-
        (item.stdout | from_json | first).Id
        is match("^sha256:[a-f0-9]{64}$")
    fail_msg: >-
      The cached image {{ item.item }} does not match the reviewed
      linux/amd64 contract.
    quiet: true
  loop: "{{ image_preflight_final_inspect.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Verify each channel image against its resolved registry digest
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../../scripts/resolve-image-channel.py"
      - verify
      - --resolved-reference
      - "{{ item.item }}"
    stdin: "{{ item.stdout }}"
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  changed_when: false
  loop: "{{ image_preflight_final_inspect.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - item.item in image_preflight_channel_resolved_references
