---
# Las imagenes ya no se descargan antes del despliegue: el stack renderiza la
# entrada de config/image-channels.yml y el CLI la resuelve con
# `resolve_image: changed`. La identidad se comprueba despues, sobre la imagen
# exacta que cada servicio ejecuta.
- name: Create application directories outside legacy state
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    state: directory
  loop:
    - {path: /srv/organizationweb, owner: 'root', group: 'root', mode: '0755'}
    - path: /srv/organizationweb/postgres
      owner: '70'
      group: '70'
      mode: '0700'
    - path: /srv/organizationweb/rabbitmq
      owner: '100'
      group: '101'
      mode: '0700'
    - path: /opt/dockerswarm/organizationweb
      owner: root
      group: root
      mode: '0750'

- name: Render the exact reviewed stack
  ansible.builtin.template:
    src: "{{ role_path }}/../../../stacks/organizationweb/stack.yml.j2"
    dest: /opt/dockerswarm/organizationweb/stack.yml
    owner: root
    group: root
    mode: '0640'

- name: Install the existing exact live-reference validator
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/validate-swarm-deployment.py"
    dest: /opt/dockerswarm/organizationweb/validate-swarm-deployment.py
    owner: root
    group: root
    mode: '0755'

- name: Deploy only the independent application stack
  community.docker.docker_stack:
    name: organizationweb
    state: present
    compose: [/opt/dockerswarm/organizationweb/stack.yml]
    detach: true
    prune: true
    # Unchanged rendered image: keep the live digest. Changed or new: resolve
    # the channel (or the hold digest) against the registry.
    resolve_image: changed

- name: Require all four replicas and no extra service
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - stack
      - services
      - organizationweb
      - --format
      - "{% raw %}{{.Name}}={{.Replicas}}{% endraw %}"
  register: organizationweb_replicas
  changed_when: false
  until: >-
    organizationweb_replicas.stdout_lines | sort == [
      'organizationweb_backend=1/1', 'organizationweb_postgres=1/1',
      'organizationweb_rabbitmq=1/1', 'organizationweb_web=1/1'
    ]
  retries: 36
  delay: 10

- name: Inspect the converged application services
  ansible.builtin.command:
    argv: [/usr/bin/docker, service, inspect, "organizationweb_{{ item }}"]
  loop: [backend, postgres, rabbitmq, web]
  register: organizationweb_service_inspections
  changed_when: false

- name: Require every live image to match its reviewed channel entry
  ansible.builtin.assert:
    that:
      - >-
        (
          image_channels_map.organizationweb[item.item].mode == 'hold'
          and
          (item.stdout | from_json | first)
          .Spec.TaskTemplate.ContainerSpec.Image
          == image_channels_map.organizationweb[item.item].spec_exact
        )
        or
        (
          image_channels_map.organizationweb[item.item].mode == 'channel'
          and
          (item.stdout | from_json | first)
          .Spec.TaskTemplate.ContainerSpec.Image
          is match(image_channels_map.organizationweb[item.item].spec_pattern)
        )
    fail_msg: >-
      The live image of {{ item.item }} differs from its channel entry.
  loop: "{{ organizationweb_service_inspections.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect the exact image every application service runs
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - image
      - inspect
      - >-
        {{
          (item.stdout | from_json | first)
          .Spec.TaskTemplate.ContainerSpec.Image
        }}
  loop: "{{ organizationweb_service_inspections.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: organizationweb_image_inspections
  changed_when: false

# Una entrada `hold` en su referencia base conserva la revision del release
# del catalogo; una entrada de canal solo exige una revision OCI de 40 hex,
# que queda registrada abajo como auditoria de lo desplegado.
- name: Require the published Linux amd64 images
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json | first).Os == 'linux'
      - (item.stdout | from_json | first).Architecture == 'amd64'
      - >-
        (
          image_channels_map.organizationweb[item.item.item].repository_familiar
          ~ '@'
          ~ (
            (item.item.stdout | from_json | first)
            .Spec.TaskTemplate.ContainerSpec.Image
            | regex_replace('^.*@', '')
          )
        ) in (item.stdout | from_json | first).RepoDigests
      - >-
        item.item.item not in ['backend', 'web'] or (
          (item.stdout | from_json | first)
          .Config.Labels['org.opencontainers.image.revision']
          is match('^[a-f0-9]{40}$')
        )
      - >-
        item.item.item not in ['backend', 'web']
        or not image_channels_map.organizationweb[item.item.item].is_baseline
        or (
          (item.stdout | from_json | first)
          .Config.Labels['org.opencontainers.image.revision']
          == organizationweb.release
        )
    fail_msg: Image identity or architecture differs from the reviewed release.
  loop: "{{ organizationweb_image_inspections.results }}"
  loop_control:
    label: "{{ item.item.item }}"

- name: Collect the live image and revision of every application service
  ansible.builtin.set_fact:
    organizationweb_observed_images: >-
      {{
        organizationweb_observed_images | default({})
        | combine({
          item.item.item: {
            'image': (item.item.stdout | from_json | first)
              .Spec.TaskTemplate.ContainerSpec.Image,
            'revision': (item.stdout | from_json | first)
              .Config.Labels['org.opencontainers.image.revision']
              | default('', true)
          }
        })
      }}
  loop: "{{ organizationweb_image_inspections.results }}"
  loop_control:
    label: "{{ item.item.item }}"

- name: Record the live application images observed by this apply
  ansible.builtin.copy:
    dest: /opt/dockerswarm/organizationweb/observed-images.yml
    content: |
      {{
        {
          'schema_version': 1,
          'stack': 'organizationweb',
          'source_revision':
            deployment_metadata_source_revision | default(''),
          'images': organizationweb_observed_images,
        } | to_nice_yaml(indent=2, sort_keys=true)
      }}
    owner: root
    group: root
    mode: '0644'

- name: Index the exact external secret identities
  ansible.builtin.set_fact:
    organizationweb_verified_secrets: >-
      {{
        organizationweb_verified_secrets | default({}) | combine({
          item.item.key: {
            'id': (item.stdout | from_json | first).ID,
            'name': (item.stdout | from_json | first).Spec.Name
          }
        })
      }}
  loop: "{{ organizationweb_secret_inspections.results }}"
  no_log: true

- name: Verify exact deployed config secret and network references
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /opt/dockerswarm/organizationweb/validate-swarm-deployment.py
      - --stack
      - /opt/dockerswarm/organizationweb/stack.yml
      - --stack-name
      - organizationweb
      - --verified-configs
      - '{}'
      - --verified-secrets
      - "{{ organizationweb_verified_secrets | to_json }}"
      - --verified-external-networks
      - >-
        {{ {'edge': {
          'id': (organizationweb_edge_inspect.stdout | from_json | first).Id,
          'name': organizationweb.edge_network,
          'internal': false
        }} | to_json }}
  changed_when: false

- name: Require a healthy running container for every application service
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - ps
      - --filter
      - "label=com.docker.swarm.service.name=organizationweb_{{ item }}"
      - --filter
      - status=running
      - --format
      - "{% raw %}{{.Status}}{% endraw %}"
  loop: [backend, postgres, rabbitmq, web]
  register: organizationweb_health
  changed_when: false
  until:
    - organizationweb_health.stdout_lines | length == 1
    - organizationweb_health.stdout is search('\(healthy\)$')
  retries: 36
  delay: 10
