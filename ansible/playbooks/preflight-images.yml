---
- name: Cache every immutable runtime image before stack mutation
  hosts: swarm_managers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  vars_files:
    - ../../config/platform.yml
    - ../../config/services.yml
    - ../group_vars/all.yml

  roles:
    - role: operation_lock_guard
    - role: image_preflight
    - role: workloads_runner_image
    - role: deployment_metadata
