---
- name: Reconcile the independent RacingGame stack
  hosts: swarm_managers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  vars_files:
    - ../../config/capacity.yml
    - ../../config/platform.yml
    - ../../config/racinggame.yml
    - ../group_vars/all.yml

  roles:
    - role: operation_lock_guard
    - role: capacity_preflight
      tags:
        - capacity
    - role: racinggame
    - role: deployment_metadata
