---
- name: Render approved workloads without mutating a Swarm
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars_files:
    - ../../config/platform.yml
    - ../../config/services.yml
    - ../../stacks/workloads/secrets.yml
    - ../group_vars/all.yml

  vars:
    workloads_render_only: true

  roles:
    - role: workloads
