---
- name: Reconcile approved application workloads
  hosts: swarm_managers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  vars_files:
    - ../../config/capacity.yml
    - ../../config/platform.yml
    - ../../config/services.yml
    - ../../config/minecraft.yml
    - ../../stacks/workloads/secrets.yml
    - ../group_vars/all.yml

  roles:
    - role: operation_lock_guard
    - role: capacity_preflight
      tags:
        - capacity
    - role: minecraft_preflight
    - role: image_preflight
    - role: workloads_runner_image
    - role: workloads
    - role: deployment_metadata
