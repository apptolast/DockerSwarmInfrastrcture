---
- name: Reconcile the reviewed host baseline after the platform
  hosts: swarm_managers
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true

  vars_files:
    - ../../config/host-security.yml
    - ../../config/platform.yml
    - ../group_vars/all.yml

  roles:
    - role: operation_lock_guard
    - role: host_security
    - role: host_baseline
    - role: deployment_metadata
