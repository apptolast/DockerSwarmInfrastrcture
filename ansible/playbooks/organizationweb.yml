---
- name: Reconcile the independent OrganizationWeb MVP stack
  hosts: swarm_managers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars_files:
    - ../../config/capacity.yml
    - ../../config/organizationweb.yml
    - ../group_vars/all.yml
  roles:
    - role: operation_lock_guard
    - role: capacity_preflight
    - role: organizationweb
    - role: deployment_metadata
